<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — FunnelSwift</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#1e1b4b,#312e81);display:flex;justify-content:center;align-items:center;min-height:100vh}
.c{background:#fff;border-radius:12px;padding:40px;width:380px;max-width:95vw;box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center}
.c h1{font-size:22px;color:#1e1b4b;margin-bottom:4px}
.c p.sub{font-size:13px;color:#64748b;margin-bottom:24px}
.c input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:12px;display:block;outline:none}
.c input:focus{border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.c button{width:100%;padding:12px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.c button:hover{background:#4f46e5}
.c button:disabled{opacity:.5}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-top:12px;display:none}
.msg.e{background:#fee2e2;color:#991b1b;display:block}
.msg.i{color:#6366f1;display:block}
.lk{margin-top:16px;font-size:12px;border-top:1px solid #f1f5f9;padding-top:14px}
.lk a{color:#6366f1}
</style>
</head>
<body>
<div class="c">
<h1>FunnelSwift</h1>
<p class="sub">Lead Generation &amp; Affiliate Marketing</p>
<div id="v-li">
<input id="e" type="email" placeholder="Email">
<input id="p" type="password" placeholder="Password">
<button id="b" onclick="L()">Sign In</button>
<div id="m" class="msg"></div>
<div style="margin-top:14px;font-size:12px"><a href="#" id="fp-link" onclick="showForgot();return false" style="color:#6366f1">Forgot password?</a></div>
<div class="lk"><a href="/admin">Admin Portal</a></div>
</div>

<!-- Password reset (kanban t_04bf3423). The back end has always had /api/v1/auth/forgot-password
     and /api/v1/auth/reset-password (both in the anonymous allowlist) plus a password_reset email,
     but no screen ever called them - so a user who forgot their password had no way back in. The
     email carries a one-hour, single-use code; this is the screen that redeems it. -->
<div id="v-fp" style="display:none">
<p class="sub" style="margin-bottom:16px">Enter the email on your account and we'll send you a reset code.</p>
<input id="fe" type="email" placeholder="Email">
<button id="fb" onclick="R()">Send reset code</button>
<div id="fm" class="msg"></div>
<div class="lk"><a href="#" onclick="showLogin();return false">&larr; Back to sign in</a></div>
</div>

<div id="v-rs" style="display:none">
<p class="sub" style="margin-bottom:16px">Enter the reset code from your email and choose a new password.</p>
<input id="rc" type="text" placeholder="Reset code" autocomplete="one-time-code">
<input id="rpw" type="password" placeholder="New password (at least 8 characters)">
<button id="rb" onclick="RS()">Set new password</button>
<div id="rm" class="msg"></div>
<div class="lk"><a href="#" onclick="showLogin();return false">&larr; Back to sign in</a></div>
</div>
</div>
<script>
function L(){
var e=document.getElementById("e").value.trim(),p=document.getElementById("p").value,m=document.getElementById("m"),b=document.getElementById("b");
if(!e||!p){m.className="msg e";m.textContent="Enter email and password";return}
m.className="msg i";m.textContent="Signing in...";b.disabled=true;
fetch("/api/v1/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})})
/* kanban t_af890bbf: surface the SERVER's message instead of a hard-coded one. 401 is still
   "Invalid email or password" from the API, but a retired workspace answers 403 with
   "This workspace is inactive..." and this page used to print "Invalid credentials" over it -
   the one screen that could explain the lockout was the one screen that lied about it. */
.then(function(r){return r.json().catch(function(){return {}}).then(function(x){if(!r.ok)throw new Error(x.error||"Invalid credentials");return x})})
.then(function(d){var t=d.token||d.access_token;
if(!t){m.className="msg e";m.textContent="Login response carried no session token";b.disabled=false;return}
try{localStorage.setItem("ws_fs_token",t);sessionStorage.setItem("wf_token",t)}catch(ex){}
/* Hand the session over OUT OF BAND.
   This used to be window.location.href="/app?token="+encodeURIComponent(t), which put the
   24h bearer token in the URL: nginx and Cloudflare record the full request line, so every
   login wrote a usable session into the access log (and into browser history and the
   Referer header). /login and /app are the SAME origin on app.funnelswift.net, and this
   page has already written localStorage['ws_fs_token'] above - which is exactly what the
   SPA's auth guard reads - so no URL transport is needed.
   location.replace() also keeps /login out of the back-button history. */
window.location.replace("/app")})
.catch(function(err){m.className="msg e";m.textContent=err.message;b.disabled=false});
}
/* ── Password reset (kanban t_04bf3423) ───────────────────────────────────────────────
   ForgotPassword shows the request screen, R() posts the email, RS() redeems the code the
   password_reset email carries. Both endpoints are anonymous by design (global_auth
   PUBLIC_EXACT) and both answer the API's own {"error":..} / {"message":..} shape. */
function showForgot(){
document.getElementById("v-li").style.display="none";
document.getElementById("v-fp").style.display="block";
document.getElementById("v-rs").style.display="none";
document.getElementById("fe").focus();
}
function showLogin(){
document.getElementById("v-li").style.display="block";
document.getElementById("v-fp").style.display="none";
document.getElementById("v-rs").style.display="none";
var f=document.getElementById("fm");if(f){f.className="msg";f.textContent=""}
var r=document.getElementById("rm");if(r){r.className="msg";r.textContent=""}
}
function R(){
var e=document.getElementById("fe").value.trim(),m=document.getElementById("fm"),b=document.getElementById("fb");
if(!e){m.className="msg e";m.textContent="Enter your email";return}
m.className="msg i";m.textContent="Sending...";b.disabled=true;
fetch("/api/v1/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e})})
.then(function(r){return r.json().catch(function(){return {}}).then(function(x){if(!r.ok)throw new Error(x.error||"Could not send the reset code");return x})})
.then(function(d){
m.className="msg i";m.textContent=(d&&d.message)||"If that email exists, a reset code has been sent.";
b.disabled=false;
document.getElementById("v-fp").style.display="none";
document.getElementById("v-rs").style.display="block";
document.getElementById("rc").focus();
})
.catch(function(err){m.className="msg e";m.textContent=err.message;b.disabled=false});
}
function RS(){
var t=document.getElementById("rc").value.trim(),p=document.getElementById("rpw").value,m=document.getElementById("rm"),b=document.getElementById("rb");
if(!t||!p){m.className="msg e";m.textContent="Enter the reset code and a new password";return}
if(p.length<8){m.className="msg e";m.textContent="New password must be at least 8 characters";return}
m.className="msg i";m.textContent="Saving...";b.disabled=true;
fetch("/api/v1/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t,new_password:p})})
.then(function(r){return r.json().catch(function(){return {}}).then(function(x){if(!r.ok)throw new Error(x.error||"Could not reset the password");return x})})
.then(function(d){
showLogin();
var m2=document.getElementById("m");m2.className="msg i";
m2.textContent=(d&&d.message)||"Password has been reset. You can sign in now.";
document.getElementById("p").value="";
document.getElementById("e").focus();
})
.catch(function(err){m.className="msg e";m.textContent=err.message;b.disabled=false});
}
</script>
</body>
</html>
