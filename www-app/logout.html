<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Signing out…</title><script>/* The old sign-out page used a <meta http-equiv="refresh"> to reach /login. A meta refresh is
   QUEUED when it is parsed and cannot be relied on to be cancelled afterwards: measured in a real
   browser (2026-11-24) the Danger-zone landing page removed the tag, drew "Your account and data
   were deleted", and was still thrown to /login a second later, so the person who had just
   deleted their account never got to read what happened. A timer that is never started for the
   landing case cannot misfire. */
(function(){var p=new URLSearchParams(location.search);
 if(p.get('erased')==='1'||p.get('closed')==='1')return;
 setTimeout(function(){location.replace('/login')},1200);})();</script><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;color:#1e293b;background:#f8fafc}.wrap{max-width:640px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px}.card h1{font-size:20px;margin:0 0 10px}.card p{font-size:14px;line-height:1.6;margin:0 0 10px;color:#334155}.card .kept{color:#7f1d1d}@media (prefers-color-scheme:dark){body{background:#0f1117;color:#e8eaed}.card{background:#1a1d27;border-color:#2d3148}.card p{color:#c7cbd1}}</style></head>

   (impersonateTenant() in index.html) parks the OPERATOR's own token under localStorage
   ws_fs_original_token and swaps ws_fs_token for the tenant's, so clearing only ws_fs_token left a
   live operator credential in the browser after the tenant signed out — measured live on
   app.funnelswift.net (kanban t_559c9a48: after /logout.html, ws_fs_original_token length 27). */
localStorage.removeItem('ws_fs_token');
localStorage.removeItem('ws_fs_original_token');</script>
<div class="wrap">
  <div class="card" id="done" role="status" aria-live="polite">
    <h1>Signing you out…</h1>
    <p>You are being taken to the sign-in page.</p>
  </div>
</div>
<script>/* DANGER-ZONE LANDING (2026-11-24, fleet standard §7: "after success: sign out, land on a plain
   page that states what happened and when"). The profile's Danger zone sends people here when they
   cancel a plan or delete their account, because the console's own page no longer exists for them —
   erasing the workspace also killed the session token. The time comes from the SERVER's erasure
   answer, so the page states the real moment rather than a value the browser guessed. */
(function(){
  var q=new URLSearchParams(location.search);
  var erased=q.get('erased')==='1', closed=q.get('closed')==='1';
  if(!erased && !closed) return;
  var box=document.getElementById('done');
  function when(iso){
    if(!iso) return '';
    var d=new Date(iso);
    if(isNaN(d.getTime())) return '';
    return ' This completed on '+d.toLocaleString()+'.';
  }
  if(erased){
    document.title='Your account and data were deleted';
    box.innerHTML='<h1>Your account and data were deleted</h1>'
      +'<p>This workspace and its records have been permanently deleted, and every session and API key on it no longer works.'+when(q.get('at'))+'</p>'
      +'<p class="kept">Your invoices were kept, because tax law requires us to retain them. They are the only thing left.</p>'
      +'<p>You can close this page.</p>';
  } else {
    document.title='Your plan is cancelled';
    box.innerHTML='<h1>Your plan is cancelled</h1>'
      +'<p>Your access has ended and every session and API key on the account no longer works.'+when(q.get('at'))+'</p>'
      +'<p>Your data has <strong>not</strong> been deleted. It is kept for 30 days, so you can restore this within 30 days by contacting support.</p>'
      +'<p>You can close this page.</p>';
  }
})();</script>
