<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirm your new sign-in email — FunnelSwift</title>
<style>
  :root{--accent:#4f46e5;--text:#0f172a;--muted:#64748b;--border:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f8fafc;color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}
  .card{width:100%;max-width:460px;background:#fff;border:1px solid var(--border);border-radius:14px;
        padding:28px 26px;box-shadow:0 8px 30px rgba(15,23,42,.06)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;margin-bottom:16px}
  .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:flex;
       align-items:center;justify-content:center;font-size:14px}
  h1{font-size:19px;margin:0 0 10px}
  p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .addr{color:var(--text);font-weight:600}
  .out{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
  .ok{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
  .bad{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .info{display:block;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3}
  a.btn{display:inline-block;margin-top:16px;background:var(--accent);color:#fff;text-decoration:none;
        padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="dot">◆</span> FunnelSwift</div>
  <h1>Confirm your new sign-in email</h1>
  <p id="lede">Checking your confirmation link…</p>
  <div id="out" class="out" role="status" aria-live="polite"></div>
  <a id="go" class="btn" href="https://app.funnelswift.net/login" style="display:none">Go to sign in</a>
</main>
<script>
(function(){
  var out=document.getElementById('out'), lede=document.getElementById('lede'), go=document.getElementById('go');
  function show(cls,text){ out.className='out '+cls; out.textContent=text; }
  var token='';
  try{ token=(new URLSearchParams(location.search).get('token')||'').trim(); }catch(e){}
  if(!token){
    lede.textContent='This link is incomplete.';
    show('bad','The confirmation code is missing from the link. Open the link from your email again, or ask for a new one from your profile page.');
    return;
  }
  fetch('/api/v1/auth/email-change/confirm',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token})})
    .then(function(r){return r.text().then(function(t){
      var d=null; try{ d=JSON.parse(t); }catch(e){}
      if(!r.ok) throw Error((d&&d.error)||('Error '+r.status));
      return d||{};
    });})
    .then(function(d){
      lede.textContent='Done.';
      show('ok',d.message||'Your sign-in address has been changed.');
      go.style.display='inline-block';
    })
    .catch(function(e){
      lede.textContent='That link did not work.';
      show('bad',(e&&e.message)||'The confirmation link is invalid or has expired.');
      go.style.display='inline-block';
    });
})();
</script>
</body>
</html>
