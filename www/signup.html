<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — FunnelSwift</title>
<link rel="canonical" href="https://funnelswift.net/">
<meta name="theme-color" content="#0F172A">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='fav' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%232563EB'/%3E%3Cstop offset='100%25' stop-color='%2306B6D4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230F172A'/%3E%3Cpath d='M 23 8 A 7 7 0 0 1 23 24' fill='none' stroke='url(%23fav)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M 12 22 L 20 10 L 16 16 L 22 16 L 13 24 L 15 19 Z' fill='url(%23fav)'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#2563eb,#1d4ed8);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.signup-card{background:#fff;border-radius:16px;padding:40px;width:420px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.signup-card .emoji{font-size:40px;text-align:center;margin-bottom:8px}
.signup-card h1{font-size:24px;font-weight:700;text-align:center;color:#1e293b;margin-bottom:4px}
.signup-card p.sub{text-align:center;color:#64748b;font-size:14px;margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:4px}
.form-group input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none}
.form-group input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:15px;font-weight:600;color:#fff;background:#2563eb;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{color:#ef4444;font-size:13px;margin-bottom:12px;display:none;text-align:center}
.error.show{display:block}
.loading{text-align:center;margin-top:12px;font-size:13px;color:#64748b;display:none}
.login-link{text-align:center;margin-top:18px;font-size:13px;color:#64748b}
.login-link a{color:#2563eb;text-decoration:none;font-weight:500}
.login-link a:hover{text-decoration:underline}
.ref-badge{display:none;background:#eef2ff;color:#4338ca;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:500;text-align:center;margin-bottom:16px}
.ref-badge.show{display:block}
.plan-badge{display:none;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:500;text-align:center;margin-bottom:16px;line-height:1.5}
.plan-badge.show{display:block}
</style>
</head>
<body>
<div class="signup-card">
<div class="emoji">🚀</div>
<h1>Get Started Free</h1>
<p class="sub">Create your FunnelSwift workspace</p>
<div class="ref-badge" id="ref-badge"></div>
<div class="plan-badge" id="plan-badge"></div>
<div class="error" id="signup-error"></div>
<form id="signup-form">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="signup-name" placeholder="Your name" required autocomplete="name" maxlength="243" aria-label="Your name">
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="signup-email" placeholder="your@email.com" required autocomplete="email" aria-label="Email">
</div>
<!-- No password field here by design: the server generates the login credentials and emails them,
     so signup uses the SAME path as the auto-created tag accounts; the user confirms their address
     by signing in with the password we sent. The empty .form-group wrapper that used to hold this
     note rendered a stray 14px gap under the Email field, so the note is a comment now. -->
<button type="submit" class="btn" id="signup-btn">Create Free Account</button>
<p style="font-size:12px;color:#64748b;line-height:1.5;margin:0">By creating an account you agree to our
<a href="https://funnelswift.net/terms" target="_blank" rel="noopener" style="color:#2563eb">Terms of Service</a> and
<a href="https://funnelswift.net/privacy" target="_blank" rel="noopener" style="color:#2563eb">Privacy Policy</a>.</p>
</form>
<div class="loading" id="signup-loading">Creating your workspace...</div>
<!-- kanban t_4fc8cfa6: this used to be a RELATIVE /login, which is THIS host's own login page -
     it authenticated for real and then threw the session away (a different origin), so a visitor
     who had just created an account retyped the same credentials into a second, empty form. The
     apex no longer serves a login form at all: /login is a 301 to the canonical login below, and
     the target is spelled out absolutely so the link cannot land on this host again. -->
<p class="login-link">Already have an account? <a href="https://app.funnelswift.net/login">Sign in</a></p>
</div>
<script>
// Check for affiliate ref code in URL
var params = new URLSearchParams(window.location.search);
var refCode = params.get('ref') || params.get('affiliate_code');
var badge = document.getElementById('ref-badge');
if (refCode) {
  badge.textContent = '🔗 Referred by ' + refCode;
  badge.classList.add('show');
}

// ── WHICH PRODUCT the visitor picked on /pricing (measured live 2026-10-21) ──────────────
// Every card on /pricing advertises ONE product, and the plain door seats whichever side the
// server defaults to. A visitor who chose 'Kinetic Pro' was therefore landed on a CAPTURE
// workspace whose dashboard reads 'Cards not on this plan'. The CTA now carries the slug and
// the server derives the SIDE from it (a slug starting 'kinetic' -> kinetic free tier); this
// page only has to pass it on and say, in plain words, what the account starts on.
var PLANS = {
  'capture-free':    {label: 'Capture Free',    starts: 'Capture Free'},
  'kinetic-free':    {label: 'Kinetic Free',    starts: 'Kinetic Free'},
  'capture-starter': {label: 'Capture Starter', starts: 'Capture Free'},
  'kinetic-pro':     {label: 'Kinetic Pro',     starts: 'Kinetic Free'},
  'suite':           {label: 'Suite',           starts: 'Capture Free'},
  // The catalogue's REAL slug is `agency` (plans table); the shipped /pricing card still carries
  // the older `agency-scale` spelling. Both must be labelled, or a visitor arriving with the real
  // slug sees no badge -- measured 2026-10-21 by cross-checking every slug the vhost map can emit.
  'agency':          {label: 'Agency / Scale',  starts: 'Capture Free'},
  'agency-scale':    {label: 'Agency / Scale',  starts: 'Capture Free'}
};
var chosenPlan = (new URLSearchParams(location.search).get('plan') || '').trim().toLowerCase();
// LEGACY SPELLINGS (2026-10-23): the $79 card shipped `plan=agency-scale` until today while the
// catalogue's slug is `agency`, and the app filed no request for a slug it does not know — measured
// live: an arrival carrying `agency-scale` created the workspace with no plan request at all. A
// saved link, an ad or a bookmark can still carry the old spelling, so normalise it HERE, on the one
// page every signup door lands on. The badge keeps the pretty label from PLANS below.
var PLAN_ALIAS = {'agency-scale': 'agency'};
chosenPlan = PLAN_ALIAS[chosenPlan] || chosenPlan;
var chosen = PLANS[chosenPlan] || null;
if (chosen) {
  var pb = document.getElementById('plan-badge');
  pb.textContent = (chosen.starts === chosen.label)
    ? 'You picked ' + chosen.label + ' — free, no card. Name and email is all we need.'
    : 'You picked ' + chosen.label + '. New accounts start on ' + chosen.starts +
      ', and you can move up any time from your dashboard.';
  pb.classList.add('show');
}

document.getElementById('signup-form').addEventListener('submit', async function(e){
e.preventDefault();
var btn = document.getElementById('signup-btn');
var err = document.getElementById('signup-error');
var loading = document.getElementById('signup-loading');
err.classList.remove('show');
btn.disabled = true;
loading.style.display = 'block';

var body = {
  name: document.getElementById('signup-name').value,
  email: document.getElementById('signup-email').value,
  // No password: the server generates the login credentials and emails them to this address.
  source: refCode ? 'affiliate_referral' : 'homepage',
  // The slug the visitor chose. The server honours only its PRODUCT SIDE and always seats
  // that side's zero-priced tier, so a paid card still starts on the matching free plan.
  plan: chosen ? chosenPlan : 'free'
};

if (refCode) {
  body.affiliate_code = refCode;
}

try{
  var res = await fetch('/api/v1/auth/signup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  var data = await res.json();
  if (!res.ok) throw new Error(data.error || data.message || 'Signup failed');
  // NO auto-login. David's model: the server generated the login credentials and emailed them, so the
  // user confirms their address by signing in with the password we sent — a real two-step check. The
  // old code handed the session over in the URL fragment, which skipped that check entirely.
  // The server records the PAID plan the visitor chose as a plan request (2026-10-21). Say so,
  // because that row is what their dashboard shows and what the team acts on — a silent record
  // would leave the customer thinking the choice was lost.
  var ask = '';
  if (data && data.plan_request && data.plan_request.plan_name) {
    ask = '<div style="margin-top:10px;padding:10px 12px;background:#eef2ff;border:1px solid #c7d2fe;' +
      'border-radius:8px;font-size:13px;color:#312e81">We\u2019ve logged your interest in <strong>' +
      data.plan_request.plan_name.replace(/[<>&]/g, '') + '</strong>. It shows on your dashboard as a ' +
      'request, and the team moves the workspace onto it as soon as payments are open.</div>';
  }
  // The server now answers whether the login mail actually LEFT (`credentials_emailed`). It is
  // false when the send failed, and false for a reserved test address the sender withholds — so a
  // page that printed "Check your email" unconditionally sent real customers hunting an inbox that
  // would stay empty, holding an account whose password nobody could ever read. Say the truth.
  var emailed = !(data && data.credentials_emailed === false);
  // The session signup just returned: what the password chooser below authenticates with.
  window.__signupToken = (data && data.token) || '';
  window.__signupEmail = body.email;
  var resetLink = '<a href="https://app.funnelswift.net/forgot-password?email=' +
    encodeURIComponent(body.email) + '" style="color:#2563eb;font-weight:600">send yourself a reset code</a>';
  if (emailed) {
    loading.innerHTML = "<strong>Account created!</strong><br>Check your email — we've sent your login " +
      "details to " + body.email.replace(/[<>&]/g, '') + '.<br><br>You can change your password any time ' +
      'in your profile settings.' + ask +
      '<div style="margin-top:12px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:13px">' +
      'Nothing in your inbox after a minute? Check your spam folder, then ' + resetLink +
      ' or <a href="https://app.funnelswift.net/login.html" style="color:#2563eb;font-weight:600">sign in</a>.' +
      '</div>';
    btn.innerHTML = 'Check your email';
  } else {
    loading.innerHTML = "<strong>Account created!</strong><br>We could not send your login details to " +
      body.email.replace(/[<>&]/g, '') + ' — so there is nothing waiting in your inbox, and we will not ' +
      'pretend otherwise. Choose your password in the box below and sign in with it.' + ask +
      '<div style="margin-top:12px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:13px">' +
      'You can also ' + resetLink + ' — though while the ' +
      'mail service for this site is having trouble that code will not arrive either. In that case write to ' +
      '<a href="mailto:support@swiftsoftware.net" style="color:#2563eb;font-weight:600">support@swiftsoftware.net</a> ' +
      'and we will set you up by hand.</div>';
    btn.innerHTML = 'Set your password';
    loading.insertAdjacentHTML('beforeend', initialPwBoxHtml());
  }
  loading.style.display = 'block';
} catch(ex) {
  err.textContent = ex.message;
  err.classList.add('show');
  btn.disabled = false;
  loading.style.display = 'none';
}
});
  // The mail-independent half of the "we could not send your login details" arm. Signup already
  // returned a session, so the customer can choose the password they will sign in with instead of
  // waiting for a mail that is not coming (POST /api/v1/auth/initial-password, migration 119).
  function initialPwBoxHtml() {
    return '<div style="margin-top:12px;padding:12px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:8px;text-align:left">'
      + '<strong style="font-size:14px">Choose your password now</strong>'
      + '<div style="font-size:13px;color:#334155;margin:6px 0">You are already signed up \u2014 set the password you will use to sign in:</div>'
      + '<input id="initPw" type="password" minlength="8" placeholder="At least 8 characters" style="width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px">'
      + '<button type="button" onclick="saveInitialPassword()" style="margin-top:8px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer">Save password</button>'
      + '<div id="initPwMsg" style="font-size:13px;margin-top:8px"></div></div>';
  }
  async function saveInitialPassword() {
    var box = document.getElementById('initPwMsg');
    var pw = (document.getElementById('initPw') || {}).value || '';
    if (pw.length < 8) { box.innerHTML = '<span style="color:#b91c1c">That is shorter than 8 characters \u2014 try again.</span>'; return; }
    try {
      var r = await fetch('/api/v1/auth/initial-password', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + window.__signupToken}, body: JSON.stringify({password: pw})});
      var d = await r.json().catch(function(){ return {}; });
      if (!r.ok) throw new Error(d.message || d.error || 'Could not save that password.');
      box.innerHTML = '<span style="color:#15803d"><strong>Password saved.</strong> Taking you to sign in\u2026</span>';
      setTimeout(function(){ window.location = 'https://app.funnelswift.net/login.html' + (window.__signupEmail ? '?email=' + encodeURIComponent(window.__signupEmail) : ''); }, 900);
    } catch (e) { box.innerHTML = '<span style="color:#b91c1c">' + String(e.message).replace(/[<>&]/g, '') + '</span>'; }
  }
</script>
</body>
</html>
