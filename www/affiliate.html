<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Portal - FunnelSwift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px}
a{color:#2563eb;text-decoration:none}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;width:560px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal-header{padding:16px 24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:17px;font-weight:600}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#e2e8f0;color:#475569}.btn-secondary:hover{background:#cbd5e1}
.btn-success{background:#059669;color:#fff}.btn-success:hover{background:#047857}
.btn-sm{padding:6px 12px;font-size:12px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#2563eb,#1d4ed8,#1e40af)}
.auth-card{background:#fff;border-radius:16px;padding:36px;width:420px;max-width:92vw;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.auth-card h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px;color:#2563eb}
.auth-card p{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}
.auth-card .links{margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0;text-align:center}
.links a{display:block;margin:4px 0}
.portal{display:flex;min-height:100vh}
.sidebar{width:200px;background:#1e293b;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-header{padding:18px 16px;border-bottom:1px solid #334155}
.sidebar-header h1{font-size:17px;font-weight:700;color:#fff}
.sidebar-header .sub{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
.sidebar-nav{padding:8px;flex:1}
.sidebar-nav a{display:block;padding:9px 14px;color:#94a3b8;text-decoration:none;font-size:13px;border-radius:6px;margin:1px 0;cursor:pointer}
.sidebar-nav a:hover{background:#334155;color:#e2e8f0}
.sidebar-nav a.active{background:#2563eb;color:#fff}
.sidebar-footer{padding:14px 16px;border-top:1px solid #334155}
.sidebar-footer span{font-size:12px;color:#64748b;display:block;margin-bottom:6px}
.sidebar-footer button{background:0;border:1px solid #475569;border-radius:6px;color:#94a3b8;font-size:12px;padding:6px 10px;cursor:pointer;width:100%}
.main{margin-left:200px;flex:1;padding:24px 28px;min-height:100vh}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.page-header h2{font-size:20px;font-weight:700}
.page-header p{color:#64748b;font-size:13px;margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card .label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.stat-card .value{font-size:22px;font-weight:700;margin:4px 0}
.stat-card .sub{font-size:11px;color:#94a3b8}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.badge-green{background:#dcfce7;color:#059669}.badge-blue{background:#dbeafe;color:#2563eb}
.badge-yellow{background:#fef3c7;color:#d97706}.badge-gray{background:#f1f5f9;color:#64748b}
.text-muted{color:#64748b}.text-sm{font-size:12px}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:8px;color:#fff;font-size:13px}
.toast-success{background:#059669}.toast-error{background:#ef4444}
.hidden{display:none}.w-full{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div class="toast-container" id="toast-container"></div>
<script>

window.appGuidePages = {
  "dashboard": {
    title: "Affiliate Dashboard",
    desc: "Your affiliate performance at a glance — leads and commissions earned.",
    actions: ["See total leads attributed to you", "Track total commissions earned", "Read the full guide from the sidebar"]
  },
  "leads": {
    title: "Leads",
    desc: "People who've come through your affiliate links.",
    actions: ["View all leads attributed to you", "See conversion status and dates", "Submit a lead manually"]
  },
  "earnings": {
    title: "Earnings",
    desc: "Your commission summary.",
    actions: ["See total commissions earned", "Track pending vs. paid", "Read how payouts work in the guide"]
  },
  "guide": {
    title: "Affiliate Guide",
    desc: "How the FunnelSwift affiliate program works, in plain language.",
    actions: ["Learn how you earn", "See payout rates by plan", "Understand commission attribution"]
  }
};
</script>
<script src="/inline-guide-widget.js"></script>
<script>
const API = window.location.origin + '/api/v1';
const TOKEN_KEY = 'ws_fs_token';
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
let S = { user:null, isAffiliate:false, view:'dashboard', dashboard:null, prospects:[], loading:false };

function $(id){ return document.getElementById(id); }
function esc(s){ if(s===null||s===void 0) return '-'; const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function dstr(d){ if(!d) return '-'; try{ return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return String(d); } }
function money(n){ return '$' + Number(n||0).toFixed(2); }
function toast(msg,t){ t=t||'success'; const c=$('toast-container'), e=document.createElement('div'); e.className='toast toast-'+t; e.textContent=msg; c.appendChild(e); setTimeout(function(){ e.remove(); },3500); }
function showModal(h,w){ $('modal').innerHTML='<div class="modal-scrim" onclick="if(event.target===this)closeModal()"><div class="modal'+(w?' wide-modal':'')+' fade-in">'+h+'</div></div>'; }
function closeModal(){ $('modal').innerHTML=''; }

async function affApi(m,p,b){
  const o={ method:m, headers:{'Content-Type':'application/json'} };
  const t=getToken(); if(t) o.headers['Authorization']='Bearer '+t;
  if(b) o.body=JSON.stringify(b);
  const r=await fetch(API+p,o);
  const ct=r.headers.get('content-type')||'';
  const d = ct.indexOf('application/json')>=0 ? await r.json().catch(function(){return{};}) : await r.text();
  if(!r.ok) throw new Error((d&&d.error)||(d&&d.message)||('Request failed ('+r.status+')'));
  return d;
}

function affLogout(){ localStorage.removeItem(TOKEN_KEY); S.user=null; S.isAffiliate=false; S.view='dashboard'; render(); }
function navigate(v){ S.view=v; window.location.hash=v; render(); }

// ── bootstrap: determine auth + affiliate status ──────────────────────────
async function bootstrap(){
  if(!getToken()){ render(); return; }
  try{
    S.user = await affApi('GET','/me');
    const chk = await affApi('POST','/check-affiliate-email',{});
    S.isAffiliate = !!chk.exists;
    if(S.isAffiliate){
      try{ S.dashboard = await affApi('POST','/affiliate/dashboard',{}); }catch(e){ S.dashboard=null; }
    }
  }catch(e){
    localStorage.removeItem(TOKEN_KEY);
    S.user=null; S.isAffiliate=false;
  }
  render();
}

async function becomeAffiliate(){
  try{
    const d = await affApi('POST','/affiliate/signup',{});
    toast(d.message || 'You\'re now an affiliate!');
    S.isAffiliate = true;
    try{ S.dashboard = await affApi('POST','/affiliate/dashboard',{}); }catch(e){ S.dashboard=null; }
    navigate('dashboard');
  }catch(e){ toast(e.message,'error'); }
}

// ── render ────────────────────────────────────────────────────────────────
function render(){
  if(!S.user){
    $('app').innerHTML = signInView();
    return;
  }
  if(!S.isAffiliate){
    $('app').innerHTML = becomeAffiliateView();
    return;
  }
  $('app').innerHTML = portalLayout();
  renderView();
}
function renderView(){
  const c=$('view-content'); if(!c) return;
  const m={ dashboard:renderDashboard, leads:renderLeads, earnings:renderEarnings, guide:renderGuide };
  (m[S.view]||renderDashboard)(c);
}

function signInView(){
  const loginUrl = window.location.origin + '/login';
  return '<div class="auth-page"><div class="auth-card fade-in"><h1>FunnelSwift</h1><p>Affiliate Portal</p>'+
    '<p style="margin-bottom:20px">Sign in to your FunnelSwift account to access the affiliate portal. There is no separate affiliate login.</p>'+
    '<a class="btn btn-primary w-full" href="'+loginUrl+'" style="justify-content:center;padding:10px;font-size:14px">Sign in to FunnelSwift</a>'+
    '<div class="links"><a href="'+window.location.origin+'" style="font-size:12px;color:#94a3b8">Back to FunnelSwift</a></div></div></div>';
}

function becomeAffiliateView(){
  const un = (S.user && (S.user.name || S.user.email)) || 'you';
  return '<div class="auth-page"><div class="auth-card fade-in"><h1>FunnelSwift</h1><p>Become an Affiliate Partner</p>'+
    '<p style="margin-bottom:20px">Welcome, '+esc(un)+'. Request affiliate status to start earning a commission on the leads you refer to any Swift product. Approval is automatic.</p>'+
    '<button class="btn btn-primary w-full" onclick="becomeAffiliate()" style="justify-content:center;padding:10px;font-size:14px">Become an Affiliate</button>'+
    '<div class="links"><button onclick="affLogout()" style="background:0;border:none;color:#2563eb;cursor:pointer;font-size:13px">Sign out</button></div></div></div>';
}

function portalLayout(){
  const n=[
    {id:'dashboard',label:'Dashboard'},
    {id:'leads',label:'Leads'},
    {id:'earnings',label:'Earnings'},
    {id:'guide',label:'Guide'}
  ];
  const nh=n.map(function(i){ return '<a class="'+(S.view===i.id?'active':'')+'" onclick="navigate(\''+i.id+'\')"><span>'+i.label+'</span></a>'; }).join('');
  const un = S.user && S.user.name ? S.user.name : (S.user && S.user.email || 'Affiliate');
  return '<div class="portal"><div class="sidebar"><div class="sidebar-header"><h1>FunnelSwift</h1><div class="sub">Affiliate Portal</div></div>'+
    '<div class="sidebar-nav">'+nh+'</div>'+
    '<div class="sidebar-footer"><span>'+esc(un)+'</span><button onclick="affLogout()">Sign out</button></div></div>'+
    '<div class="main fade-in" id="view-content"></div></div>';
}

// ── views ─────────────────────────────────────────────────────────────────
function renderDashboard(el){
  const d = S.dashboard || {};
  el.innerHTML =
    '<div class="page-header"><div><h2>Affiliate Dashboard</h2><p>Your performance overview</p></div></div>'+
    '<div class="stat-grid">'+
    '<div class="stat-card"><div class="label">Leads Attributed</div><div class="value">'+(d.total_leads||0)+'</div><div class="sub">across all apps</div></div>'+
    '<div class="stat-card"><div class="label">Total Earned</div><div class="value">'+money(d.total_earnings)+'</div><div class="sub">commissions</div></div>'+
    '<div class="stat-card"><div class="label">Affiliate ID</div><div class="value" style="font-size:16px">'+esc(d.affiliate_id)+'</div><div class="sub">your referral code</div></div>'+
    '</div>'+
    '<div class="card"><h3>About the program</h3>'+
    '<p class="text-sm" style="color:#475569;line-height:1.6">You earn a commission every time a lead that came through your account upgrades to a paid plan in any Swift product — with no expiry. See the <a onclick="navigate(\'guide\')" style="cursor:pointer;font-weight:600">Guide</a> for full details.</p></div>';
}

function renderLeads(el){
  el.innerHTML =
    '<div class="page-header"><div><h2>Leads</h2><p>Prospects attributed to your account</p></div>'+
    '<div><button class="btn btn-primary" onclick="showLeadForm()">+ New Lead</button></div></div>'+
    '<div class="card"><h3>Your Leads</h3><div id="prospects-list"><p class="text-muted text-sm">Loading...</p></div></div>';
  loadProspects();
}

function showLeadForm(){
  const a=['workflowswift','incentiveswift','coreswift','adaswift','missedcall','funnelswift'];
  const o=a.map(function(x){ return '<option value="'+x+'">'+x.charAt(0).toUpperCase()+x.slice(1)+'</option>'; }).join('');
  showModal(
    '<div class="modal-header"><h2>Submit New Lead</h2><button class="btn btn-secondary btn-sm" onclick="closeModal()">X</button></div>'+
    '<div class="modal-body"><form onsubmit="handleSubmitLead(event)">'+
    '<div class="form-group"><label>Full Name *</label><input name="lead_name" required></div>'+
    '<div class="form-row"><div class="form-group"><label>Email</label><input name="lead_email" type="email"></div>'+
    '<div class="form-group"><label>Phone</label><input name="lead_phone"></div></div>'+
    '<div class="form-group"><label>Notes</label><textarea name="lead_notes" rows="2"></textarea></div>'+
    '<p id="lead-submit-error" class="hidden" style="color:#ef4444;font-size:13px;margin-bottom:8px"></p>'+
    '<div class="modal-footer" style="padding:0;padding-top:14px;border-top:1px solid #e2e8f0">'+
    '<button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>'+
    '<button type="submit" class="btn btn-success">Submit Lead</button></div></form></div>'
  );
}

async function handleSubmitLead(e){
  e.preventDefault(); const el=$('lead-submit-error'); if(el) el.classList.add('hidden');
  const fd=e.target;
  const custom = { notes: fd.elements['lead_notes'].value || null };
  try{
    await affApi('POST','/affiliate/submit-lead',{
      affiliate_id: (S.dashboard && S.dashboard.affiliate_id) || null,
      name: fd.elements['lead_name'].value,
      email: fd.elements['lead_email'].value || null,
      phone: fd.elements['lead_phone'].value || null,
      custom_fields: custom
    });
    toast('Lead submitted!'); closeModal(); navigate('leads');
  }catch(err){ if(el){ el.textContent=err.message; el.classList.remove('hidden'); } else { toast(err.message,'error'); } }
}

async function loadProspects(){
  try{
    const r = await affApi('POST','/affiliate/leads',{});
    S.prospects = Array.isArray(r) ? r : (r.leads || []);
    const el=$('prospects-list'); if(!el) return;
    if(!S.prospects.length){ el.innerHTML='<p class="text-muted text-sm" style="padding:16px;text-align:center">No leads yet.</p>'; return; }
    el.innerHTML = S.prospects.map(function(p){
      const st = p.status==='converted' ? 'badge-green' : (p.status==='new' ? 'badge-blue' : 'badge-yellow');
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9">'+
        '<div><strong>'+esc(p.name)+'</strong><br><span class="text-muted text-sm">'+esc(p.email||'')+' '+(p.phone?esc(p.phone):'')+'</span></div>'+
        '<div style="text-align:right"><span class="badge '+st+'">'+esc(p.status)+'</span><br><span class="text-muted text-sm">'+dstr(p.created_at)+'</span></div></div>';
    }).join('');
  }catch(e){ toast(e.message,'error'); }
}

function renderEarnings(el){
  const d = S.dashboard || {};
  el.innerHTML =
    '<div class="page-header"><div><h2>Earnings</h2><p>Your commission summary</p></div></div>'+
    '<div class="stat-grid">'+
    '<div class="stat-card"><div class="label">Total Earned</div><div class="value">'+money(d.total_earnings)+'</div><div class="sub">all-time commissions</div></div>'+
    '<div class="stat-card"><div class="label">Leads</div><div class="value">'+(d.total_leads||0)+'</div><div class="sub">attributed to you</div></div>'+
    '</div>'+
    '<div class="card"><h3>How you get paid</h3>'+
    '<p class="text-sm" style="color:#475569;line-height:1.6">Commissions are credited automatically when a lead upgrades to a paid plan. Payouts are processed on the admin side. See the <a onclick="navigate(\'guide\')" style="cursor:pointer;font-weight:600">Guide</a> for payout rates and how commission works.</p></div>';
}

async function renderGuide(el){
  el.innerHTML='<div class="page-header"><div><h2>Affiliate Guide</h2><p>How the program works</p></div></div><div id="guide-body"><p style="color:#64748b">Loading guide...</p></div>';
  try{
    const t=getToken();
    const r=await fetch(API+'/affiliate/guide',{method:'GET',headers:t?{'Authorization':'Bearer '+t}:{}});
    if(!r.ok){ const d=await r.json().catch(function(){return{};}); throw new Error(d.error||d.message||'Forbidden'); }
    const html=await r.text();
    $('guide-body').innerHTML=html;
  }catch(e){
    $('guide-body').innerHTML='<div class="card"><p style="color:#ef4444">'+esc(e.message)+'</p></div>';
  }
}

// ── init ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function(){
  var h=window.location.hash.replace('#','');
  if(h && ['dashboard','leads','earnings','guide'].indexOf(h)>=0) S.view=h;
  bootstrap();
});
window.addEventListener('hashchange', function(){
  var h=window.location.hash.replace('#','');
  if(h && ['dashboard','leads','earnings','guide'].indexOf(h)>=0 && h!==S.view) navigate(h);
});
</script>
</body>
</html>
