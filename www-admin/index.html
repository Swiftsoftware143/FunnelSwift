function openEmailTemplateModal(id) {
  STATE.modal = { title: id ? 'Edit Email Template' : 'Add Email Template', content: `<div class="empty"><div class="icon">⏳</div></div>` };
  renderApp();
  setTimeout(async () => {
    let t = {};
    if (id) { try { t = await rowForEdit(id, null, (i) => api('/admin/email-templates/'+i)); }
              catch(e) { return failEdit(e, 'Could not load the email template'); } }
    /* The API's row field is `template_type` — this table has no `type` column and the create route
       REQUIRES `template_type` (kanban t_052b4c7a): the old form sent `type`, so every POST was a 422
       ("missing field `template_type`", nothing written) and the Type select could never leave its
       default. The type list is the one endpoint that advertises types AND their merge fields. */
    let types = [{ type: 'credentials', merge_fields: ['name', 'email', 'password', 'login_url', 'app_name'] },
                 { type: 'password_reset', merge_fields: ['name', 'token', 'app_name'] },
                 { type: 'welcome', merge_fields: ['name', 'email', 'login_url', 'app_name'] },
                 { type: 'purchase_confirmed', merge_fields: ['name', 'plan_name', 'login_url', 'app_name'] }];
    let rows = [];
    try { const ty = await api('/admin/email-templates/types'); if (Array.isArray(ty) && ty.length) types = ty; } catch(e) {}
    try { const rs = await api('/admin/email-templates'); rows = Array.isArray(rs) ? rs : ((rs && (rs.data || rs.templates)) || []); } catch(e) {}
    const names = types.map(v => v.type).filter(Boolean);
    const cur = t.template_type || names[0] || 'welcome';
    if (names.indexOf(cur) === -1) names.unshift(cur);
    /* The partial unique index allows ONE default per type and the sender only reads
       `template_type = $1 AND (aid = $2 OR is_default = true)`, so a new NON-default row for a type
       that has no default is a row nothing can ever send: a new template therefore starts as that
       type's default, and when the type already has one the box starts unchecked (ticking it
       replaces the incumbent — the API demotes it in the same transaction). */
    const hasDefault = rows.some(r => r.template_type === cur && r.is_default);
    const defOn = id ? !!t.is_default : !hasDefault;
    const body = document.getElementById('modal-body');
    if (!body) return;
    window._etMergeHint = function() {
      const sel = document.querySelector('#email-form [name=template_type]');
      const hit = types.filter(v => v.type === (sel && sel.value))[0];
      const el = document.getElementById('et-merge');
      if (el) el.textContent = 'Merge fields for this type: ' + ((((hit || {}).merge_fields) || []).join(', ') ||
        'none advertised — write placeholders as {{double_braces}}; a single brace is sent literally');
      /* Keep the toggle in step with the CHOSEN type on a new template: ticked when that type has no
         default yet, unticked when it has one (ticking it then replaces the incumbent). Without this
         an admin who switched the type would create a row the sender never reads. An EDIT never moves
         the admin's own choice. */
      if (!id) {
        const box = document.querySelector('#email-form [name=is_default]');
        if (box) box.checked = !rows.some(r => r.template_type === (sel && sel.value) && r.is_default);
      }
    };
    /* FS-10: the inline guide promises "Preview a template", and the recipient's own renderer is the
       only honest oracle — FunnelSwift's `render()` substitutes DOUBLE braces only, so this does the
       same and then NAMES any `{single}` or unknown placeholder that would reach the recipient
       literally (the defect the hint above warns about). */
    window._etPreview = function() {
      const form = document.getElementById('email-form');
      const pane = document.getElementById('et-preview');
      if (!form || !pane) return;
      const sel = form.querySelector('[name=template_type]');
      const hit = types.filter(v => v.type === (sel && sel.value))[0] || {};
      const samples = {
        name: 'Alex Rivera', email: 'alex@example.com', password: 'Temp-Pass-1234',
        login_url: 'https://app.funnelswift.net/login', app_url: 'https://app.funnelswift.net',
        app_name: 'FunnelSwift', brand_name: 'Your Brand', logo_url: '(your uploaded logo)',
        token: 'reset-token-a1b2c3', plan_name: 'Capture Pro', company: 'Acme Co'
      };
      const fields = (hit.merge_fields && hit.merge_fields.length) ? hit.merge_fields.slice() : Object.keys(samples);
      const sub = function(s) {
        let out = String(s || '');
        fields.forEach(function(k) { out = out.split('{{' + k + '}}').join(samples[k] != null ? samples[k] : ('[' + k + ']')); });
        return out;
      };
      const subj = sub(form.querySelector('[name=subject]').value);
      const txt = sub(form.querySelector('[name=body]').value);
      const html = sub(form.querySelector('[name=html_body]').value);
      const shown = html.trim() ? html.replace(/<script[\s\S]*?<\/script>/gi, '') : '';
      const left = ((txt + '\n' + html).match(/\{\{[a-zA-Z0-9_]+\}\}|\{[a-zA-Z0-9_]+\}/g) || []);
      pane.style.display = 'block';
      pane.innerHTML =
        '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">What the recipient sees - sample values filled in for: ' + x(fields.join(', ')) + '</div>' +
        '<div style="font-weight:600;margin-bottom:8px">' + x(subj || '(no subject)') + '</div>' +
        (shown
          ? '<div style="border:1px solid var(--border);border-radius:6px;padding:10px;background:#fff">' + shown + '</div>'
          : '<pre style="white-space:pre-wrap;font-size:12px;margin:0">' + x(txt || '(no body)') + '</pre>') +
        (shown && txt.trim() ? '<details style="margin-top:8px"><summary style="font-size:12px;cursor:pointer">Plain-text version</summary><pre style="white-space:pre-wrap;font-size:12px">' + x(txt) + '</pre></details>' : '') +
        (left.length ? '<div style="margin-top:8px;font-size:12px;color:#b45309">&#9888; These placeholders would be sent LITERALLY: ' + x(Array.from(new Set(left)).join(', ')) + ' - use the double-brace form.</div>' : '');
    };
    body.innerHTML = `<form id="email-form">
      <div class="form-group"><label class="form-label">Name</label><input class="input" name="name" value="${x(t.name||'')}" required></div>
      <div class="form-group"><label class="form-label">Subject</label><input class="input" name="subject" value="${x(t.subject||'')}"></div>
      <div class="form-group"><label class="form-label">Type</label><select class="input" name="template_type" onchange="window._etMergeHint()">${names.map(n => `<option value="${x(n)}" ${n === cur ? 'selected' : ''}>${x(n)}</option>`).join('')}</select>
        <div id="et-merge" style="font-size:12px;color:var(--muted);margin-top:6px"></div></div>
      <div class="form-group"><label class="form-label">Body (plain text)</label><textarea class="input" name="body" rows="6" style="font-family:monospace;font-size:12px;resize:vertical">${x(t.body||'')}</textarea></div>
      <div class="form-group"><label class="form-label">HTML body (optional — when non-empty this is what the recipient sees)</label><textarea class="input" name="html_body" rows="6" style="font-family:monospace;font-size:12px;resize:vertical">${x(t.html_body||'')}</textarea></div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="is_default" id="et-default" ${defOn ? 'checked' : ''}><label class="form-label" for="et-default" style="margin:0">Default for this type — one default per type, ticking it replaces the current one</label></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn btn-secondary" onclick="window._etPreview()">Preview</button>
        <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${id?'Update':'Create'}</button>
      </div>
      <div id="et-preview" data-ops="email-template-preview" style="display:none;margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--bg-secondary)"></div>
    </form>`;
    window._etMergeHint();
    document.getElementById('email-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      /* An explicit payload rather than serialising the whole form in one go: the API wants
         `template_type`, the two bodies are separate columns, and an unchecked box must send `false`
         instead of vanishing from the body (the route's `is_default` is Option<bool>). */
      const data = {
        template_type: fd.get('template_type'),
        name: fd.get('name'),
        subject: fd.get('subject'),
        body: fd.get('body'),
        html_body: fd.get('html_body'),
        is_default: e.target.querySelector('[name=is_default]').checked
      };
      try {
        if (id) await api('/admin/email-templates/'+id, { method: 'PUT', body: JSON.stringify(data) });
        else await api('/admin/email-templates', { method: 'POST', body: JSON.stringify(data) });
        showToast('Saved!', 'success');
        STATE.modal = null; renderApp();
      } catch(e) { showToast(e.message, 'error'); }
    });
  }, 100);
}

let _providerElsewhere = [];

function _rowField(row, name, idx) {
  if (row && !Array.isArray(row) && row[name] !== undefined) return row[name];
  return Array.isArray(row) ? row[idx] : undefined;
}

// At-rest posture of a SAVED credential (the rule CoreSwift's panel set, kanban t_d1fcda7e).
// The API measures it off the ciphertext COLUMN through the same `is_encrypted` predicate the write
// path seals with; this page prints it and never asserts it. Tri-state on purpose — a row the API did
// not report prints "unknown", never "in the clear", because those are different claims.
function _postureCell(set, sealed) {
  if (!set) return '<span style="color:var(--muted)" data-posture="none" title="Nothing is saved for this half yet.">\u2014</span>';
  if (sealed === true) return '<span class="badge badge-green" data-posture="sealed" title="A copy of the database cannot yield the saved credential.">encrypted</span>';
  if (sealed === false) return '<span class="badge badge-red" data-posture="plain" title="The saved credential is readable in the database as it stands \u2014 it arrived from a restored dump, a manual write or a rotation tool. Save it again from the form below and it is encrypted at rest.">in the clear</span>';
  return '<span style="color:var(--muted)" data-posture="unknown" title="The API did not report the at-rest state of this row.">unknown</span>';
}

async function renderProviderKeys() {
  let keys = [], payments = [], catalog = [];
  try { keys = await api('/provider-keys'); } catch(e) { keys = []; }
  if (!Array.isArray(keys)) keys = keys.items || keys.data || [];
  try { payments = await api('/payment-providers'); } catch(e) { payments = []; }
  if (!Array.isArray(payments)) payments = payments.items || [];
  try { catalog = await api('/available-providers'); } catch(e) { catalog = []; }
  if (!Array.isArray(catalog)) catalog = [];
  // kanban t_c10c05b6 — the API serves OBJECTS ({key,name,coming_soon,credential_note,...}); the old
  // `typeof p === 'string'` filter always yielded [] and fell through to a hardcoded list of
  // providers this app does not even have (stripe, gemini, anthropic, twilio). Read the real key,
  // and keep coming_soon rows out of the picker because the API now refuses a key for them.
  // kanban t_2a019b99 — a row carrying credential_note is read from ANOTHER surface (the email rows
  // resolve from the Email Provider setting, never from provider_keys), so the API refuses a key for
  // it too and it must stay out of the picker.
  _providerComingSoon = (catalog || []).filter(p => p && p.coming_soon === true).map(p => p.name);
  _providerElsewhere = (catalog || []).filter(p => p && p.credential_note).map(p => p.name + ' (' + p.credential_note + ')');
  _providerCatalog = (catalog || [])
    .filter(p => p && typeof p === 'object' && p.key && p.coming_soon !== true && !p.credential_note).map(p => p.key);
  if (_providerCatalog.length === 0) _providerCatalog = ['coreswift','incentiveswift'];

  return `<div>
    <div class="card-header" style="padding:0;margin-bottom:8px">
      <h1 style="font-size:22px;font-weight:700">🔑 Provider Keys</h1>
    </div>
    <p style="font-size:13px;color:var(--muted);margin:0 0 16px">Credentials for third-party providers (AI, email, SMS, payments) are stored per tenant in the database and read at call time — no provider is hardwired. Keys are shown masked. The <strong>Encrypted</strong> column states the <strong>measured</strong> at-rest state of the saved copy: <strong>encrypted</strong> means a copy of the database cannot yield it, <strong>in the clear</strong> means it is readable as it stands (it arrived from a restored dump, a manual write or a rotation tool) — saving it again from the form below encrypts it.</p>

    <div class="card" style="margin-bottom:20px">
      <h2 style="font-size:16px;font-weight:600;margin-bottom:12px">Provider credentials</h2>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Provider</th><th>Base URL</th><th>Key</th><th>Encrypted</th><th>Added</th><th>Actions</th></tr></thead>
        <tbody>${keys.length === 0 ? `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px">No provider keys configured</td></tr>`
          : keys.map(k => {
            const prov = _rowField(k, 'provider', 0);
            const base = _rowField(k, 'base_url', 2);
            const key = _rowField(k, 'api_key_masked', 1);
            const created = (_rowField(k, 'created_at', 3) || '').toString().slice(0, 10);
            return `<tr>
              <td><span class="badge badge-blue">${x(prov)}</span></td>
              <td><code style="font-size:11px">${x(base || '—')}</code></td>
              <td><code style="font-size:11px">${x(key || '—')}</code></td>
              <td>${_postureCell(_rowField(k, 'api_key_set'), _rowField(k, 'api_key_sealed'))}</td>
              <td style="font-size:12px;color:var(--muted)">${x(created || '—')}</td>
              <td><button class="btn btn-danger btn-xs" onclick="window._deleteProviderKey('${x(prov)}')">Delete</button></td>
            </tr>`;
          }).join('')}</tbody>
      </table></div>
      <form id="provider-key-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:14px">
        <div class="form-group" style="margin:0;min-width:170px">
          <label class="form-label">Provider</label>
          <input class="input" name="provider" list="provider-catalog" placeholder="e.g. coreswift" required>
          <datalist id="provider-catalog">${_providerCatalog.map(p => `<option value="${x(p)}">`).join('')}</datalist>
        </div>
        <div class="form-group" style="margin:0;min-width:220px;flex:1">
          <label class="form-label">API Key</label>
          <input class="input" name="api_key" type="password" placeholder="paste the provider key" autocomplete="off" required>
        </div>
        <div class="form-group" style="margin:0;min-width:200px;flex:1">
          <label class="form-label">Base URL (optional)</label>
          <input class="input" name="base_url" placeholder="https://api.example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Save Key</button>
      </form>
      ${(_providerElsewhere && _providerElsewhere.length)
        ? `<p style="font-size:12px;color:var(--muted);margin-top:10px">Set up elsewhere — ${x(_providerElsewhere.join(', '))}, so this form refuses a key for them. <!-- kanban t_2a019b99: every row carrying credential_note is an email row today, so the jump target below is the Email Provider card (Email Templates view). Add a target per note if a non-email row ever gets one. -->See <a href="#" onclick="window._goEmailProvider();return false">Email Templates → Email Provider</a> for the system-wide sender. <!-- kanban t_7ac7ceb5: the card above writes the INSTALLATION's mail row; a workspace may store its own sender, and that door is in the workspace's own console (Settings → Email provider), which the customer console links to. -->Each workspace can also send through its own provider — set in that workspace's console under <strong>Settings → Email provider</strong>.</p>`
        : ''}
      ${(_providerComingSoon && _providerComingSoon.length)
        ? `<p style="font-size:12px;color:var(--muted);margin-top:10px">Coming Soon — not connectable, because nothing in this app reads their key: ${x(_providerComingSoon.join(', '))}. Listed so you know they are planned, not missing.</p>`
        : ''}
    </div>

    <div class="card">
      <h2 style="font-size:16px;font-weight:600;margin-bottom:12px">Payment providers</h2>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">The secret key and the webhook signing secret are never shown back in full, and the <strong>Encrypted</strong> column states whether the saved copy is encrypted at rest.</p>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Provider</th><th>Key</th><th>Signing secret</th><th>Encrypted</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${payments.length === 0 ? `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px">No payment provider configured</td></tr>`
          : payments.map(p => {
            const ptype = _rowField(p, 'provider_type', 2);
            const key = _rowField(p, 'api_key_masked', 3);
            const active = _rowField(p, 'is_active', 4);
            // A provider with a key but no signing secret LOOKS complete and cannot verify a single
            // payment, so the gap is shown rather than hidden.
            const wh = p && (p.webhook_secret_set === true || p.webhook_secret_set === 'true');
            return `<tr>
              <td><span class="badge badge-blue">${x(ptype)}</span></td>
              <td><code style="font-size:11px">${x(key || '—')}</code></td>
              <td>${wh ? '<span class="badge badge-green">Set</span>' : '<span class="badge badge-red">Missing</span>'}</td>
              <td style="font-size:11px;white-space:nowrap" data-pp-posture>key ${_postureCell(p && p.api_key_set, p && p.api_key_sealed)} webhook ${_postureCell(p && p.webhook_secret_set, p && p.webhook_secret_sealed)}</td>
              <td><span class="badge ${active ? 'badge-green' : 'badge-red'}">${active ? 'Active' : 'Inactive'}</span></td>
              <td><button class="btn btn-secondary btn-xs" onclick="window._testPaymentProvider('${x(ptype)}','')">Test stored key</button> <button class="btn btn-danger btn-xs" onclick="window._deletePaymentProvider('${x(ptype)}')">Delete</button></td>
            </tr>`;
          }).join('')}</tbody>
      </table></div>
      <form id="payment-provider-form" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:14px">
        <div class="form-group" style="margin:0;min-width:170px">
          <label class="form-label">Provider type</label>
          <input class="input" name="provider_type" list="payment-catalog" placeholder="e.g. stripe" required>
          <datalist id="payment-catalog"><option value="stripe"><option value="paypal"><option value="mintbird"><option value="groovesell"></datalist>
        </div>
        <div class="form-group" style="margin:0;min-width:260px;flex:1">
          <label class="form-label">Secret key</label>
          <input class="input" name="api_key" type="password" placeholder="paste the payment secret key" autocomplete="off">
        </div>
        <div class="form-group" style="margin:0;min-width:260px;flex:1">
          <label class="form-label">Webhook signing secret</label>
          <input class="input" name="webhook_secret" type="password" placeholder="whsec_… — required, or no payment can be verified" autocomplete="off">
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Save Provider</button>
        <button type="button" class="btn btn-secondary btn-sm" id="payment-test-btn" title="Asks Stripe whether the key in the box works, without saving it.">Test key</button>
        <p style="width:100%;margin:6px 0 0;font-size:12px;color:#64748b">Leave either field blank to keep the value already stored. Stripe's signing secret is on the webhook endpoint page in the Stripe dashboard, and the exact endpoint to register there is written out in the Admin Guide under "Taking payments (Stripe)". Payments are refused, with the reason recorded, until the signing secret is saved.</p>
      </form>
    </div>
  </div>`;
}

// kanban t_2a019b99 — jump from the Provider Keys screen to the real door for the rows whose

window._goEmailProvider = function() {

window._deleteProviderKey = async function(provider) {
  if (!confirm('Delete the ' + provider + ' key?')) return;
  try { await api('/provider-keys/' + encodeURIComponent(provider), { method: 'DELETE' }); showToast('Provider key deleted', 'success'); renderView(); }
  catch(e) { showToast(e.message, 'error'); }
};

window._deletePaymentProvider = async function(ptype) {
  if (!confirm('Delete the ' + ptype + ' payment provider?')) return;
  try { await api('/payment-providers/' + encodeURIComponent(ptype), { method: 'DELETE' }); showToast('Payment provider deleted', 'success'); renderView(); }
  catch(e) { showToast(e.message, 'error'); }
};

// kanban t_6a192c06 — find out whether a payment key works BEFORE it matters. A raw fetch, NOT api():
// a refusal is a 424 whose BODY carries the provider's own sentence, while api() throws on !res.ok
// and would show the operator a short code instead of the reason Stripe gave.
// The key itself is never echoed back — only the mask, and only when a key was actually used.
window._testPaymentProvider = async function(ptype, apiKey) {
  const p = String(ptype || '').trim();
  if (!p) { showToast('Choose a provider type first', 'error', false); return; }
  const usingBox = !!(apiKey && String(apiKey).trim());
  showToast('Testing the ' + p + ' key with ' + (usingBox ? 'the key in the box' : 'the stored key') + '\u2026', 'info', false);
  try {
    const res = await fetch(API_BASE + '/payment-providers/' + encodeURIComponent(p) + '/test', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {}),
      body: JSON.stringify({ api_key: usingBox ? String(apiKey).trim() : '' })
    });
    let j = {};
    try { j = await res.json(); } catch (e) { j = {}; }
    const tail = j.api_key_masked ? ' (key ' + j.api_key_masked + ')' : '';
    showToast((j.message || (res.ok ? 'Key accepted' : 'The test could not run')) + tail, res.ok ? 'success' : 'error', false);
  } catch (err) {
    showToast('Could not run the key test: ' + ((err && err.message) ? err.message : err), 'error', false);
  }
};

function bindProviderKeys() {
  const kf = document.getElementById('provider-key-form');
  if (kf) kf.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    if (!data.base_url) delete data.base_url;
    try {
      // ONE call. POST /provider-keys upserts (ON CONFLICT (tenant_id, provider) DO UPDATE) and a
      // BLANK api_key KEEPS the stored one -- the promise the field's help text makes. The DELETE
      // that used to sit here destroyed the row first, so a blank key really did wipe the stored
      // credential and the request then answered 400 "api_key required" (measured live 2026-10-11).
      // Re-keying needs no delete: the upsert replaces exactly what it is given.
      await api('/provider-keys', { method: 'POST', body: JSON.stringify(data) });
      showToast('Provider key saved', 'success');
      renderView();
    } catch(err) { showToast(err.message, 'error'); }
  });

  const pf = document.getElementById('payment-provider-form');
  if (pf) pf.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    try {
      // ONE call. POST /payment-providers upserts and keeps a blank field's stored value
      // (COALESCE(NULLIF(EXCLUDED.api_key,''), payment_providers.api_key)) -- the promise this
      // form's own help text makes ("Leave either field blank to keep the value already stored").
      // The pre-DELETE that used to sit here destroyed the stored API key whenever the operator
      // left the Secret key box blank (measured live 2026-10-11: stored key length 0). Removing a
      // provider is the Delete button's job, never the Save form's.
      await api('/payment-providers', { method: 'POST', body: JSON.stringify(data) });
      showToast('Payment provider saved', 'success');
      renderView();
    } catch(err) { showToast(err.message, 'error'); }
  });

  // kanban t_6a192c06 — the box's own "Test key": the key in the field is tested as typed and is
  // never stored, so an operator can check a key before committing it (and a bad key can no longer
  // be discovered only by a customer).
  const pt = document.getElementById('payment-test-btn');
  if (pt && pf) pt.addEventListener('click', () => {
    const sel = pf.querySelector('input[name="provider_type"]');
    const box = pf.querySelector('input[name="api_key"]');
    window._testPaymentProvider(sel ? sel.value : '', box ? box.value : '');
  });
}

  let items = [];
  try { items = await api('/tags?system=true'); } catch(e) { items = []; }

  items.forEach(t => { EDIT_ROWS.sysTags[String(t.id)] = t; });

  // Provisioning log — every tag-driven free-account attempt, newest first. The admin guide tells
  // the operator these are visible in the provisioning log; until this view the backing table had
  // a writer and NO reader in the console (only the probe harness could read it).

  try { const r = await api('/admin/provisioning-log?limit=25'); plog = (r && r.attempts) || []; } catch(e) { plog = []; }
  const plogBadge = (s) => {
    const m = { provisioned:'badge-green', already_exists:'badge-green', pending:'badge-yellow',
                refused:'badge-yellow', invalid:'badge-red', failed:'badge-red', unknown_app:'badge-red' };

// A workspace owner address that NO customer can hold — the fleet's probe badge. Two arms:
//  * the reserved TLDs (RFC 2606/6761: .invalid/.example/.test/.local, plus example.com/.net/.org);
//  * the fleet's OWN machine-minted probe domains, which are not reserved TLDs and so were invisible
//    to the first cut of this badge. The nightly tenancy canary keys its fixtures at
//    `probe-canary-a@swiftsoftware.dev` (reverse-tested by `fleet/canary-identity-restore.py`), so
//    the two `Tenancy Canary A/B` workspaces sat in the operator's Tenants list looking like
//    unrecognised signups — the exact question kanban t_a055baf8 asks.
//    `maxxspace.com` is the fleet's mail.tm probe inbox: the tag-provision probe mints its owner
//    address there (`probe-arm…@maxxspace.com`, measured live in ADASwift 2026-10-16), and a probe
//    row landing in THIS app reads as a customer until this arm is present (kanban t_8fa22773).
// `swiftsoftware.com` is deliberately NOT here: it is a real, routable domain and the operator's own.
const RESERVED_ADDR_RE = /@(?:[^@]*\.)?(?:invalid|example|test|local)$|@(?:[^@]*\.)?example\.(?:com|net|org)$/i;
const FLEET_PROBE_ADDR_RE = /@(?:[^@]*\.)?(?:swiftsoftware\.(?:dev|local)|sw\.dev|maxxspace\.com)$|@local\.(?:funnelswift|coreswift|adaswift|incentiveswift|workflowswift|missedcallrespondr|multidirectory)$/i;
function isProbeAddress(addr) {
  const a = String(addr || '');
  return RESERVED_ADDR_RE.test(a) || FLEET_PROBE_ADDR_RE.test(a);
}
// The AUTHORITATIVE arm (kanban t_fc88ec2a): `tenants.probe_harness` is written at signup by the
// door that minted the workspace, so a non-empty value names a harness even when the owner address
// looks ordinary. Before this the list could only GUESS from the address, so a harness that signed
// up with an ordinary-looking address rendered as an ordinary customer and the only tell was a name
// the operator had to recognise. The address arms stay as a FALLBACK for rows minted before the
// column existed (and for rows a probe left behind at a door that does not write it) — the column
// simply outranks them.
const probeHarnessOf = (t) => String((t && t.probe_harness) || '').trim();
// ── PERSISTENT FIXTURES (cron 2026-10-18) ────────────────────────────────────────────────────────
// The tenancy canaries and the fixed seed row are the fleet's OWN fixtures: `canary-id-watch` looks
// both canary workspaces up by NAME on every run (`probe-canary-a` / `probe-canary-b`), so deleting
// one is not cleanup — the next canary run silently recreates a fresh tenant and its verdict stops
// meaning anything. Their owner addresses sit on the fleet's own mail domain, so the probe predicate
// above counts them as probes and "Select probes" ARMED them: one click put the canaries in the
// selection and left a live Delete button aimed at the fleet's own fixtures. The API now refuses a
// fixture outright; this predicate is the other half — the picker must not ARM one either.
const FIXTURE_SLUG_PREFIXES = ['probe-canary-'];
const FIXTURE_IDS = ['00000000-0000-0000-0000-000000000001'];
function isFleetFixture(t) {
  const slug = String((t && (t.slug || t.tenant_slug)) || '').toLowerCase();
  const id = String((t && t.id) || '').toLowerCase();
  return FIXTURE_SLUG_PREFIXES.some(p => slug.startsWith(p)) || FIXTURE_IDS.indexOf(id) !== -1;
}
function probeBadgeFor(t, ownerEmail) {
  if (isFleetFixture(t)) {
    return ` <span class="badge" title="a fleet fixture the canary looks up by name - kept on purpose, never deletable">fixture</span>`;
  }
  const harness = probeHarnessOf(t);
  const probe = !!harness || isProbeAddress(ownerEmail);
  if (!probe) return '';
  const why = harness
    ? `minted by the "${harness}" test harness - a probe, not a customer`
    : 'a reserved address - a fleet probe, not a customer';
  return ` <span class="badge badge-yellow" title="${x(why)}">probe</span>`;
}

// Bulk tenant delete (kanban t_ac2fe688). The backend refuses two deletes — the account you are
// signed in as, and a portfolio company — and answers per-id, so a refused row shows its reason
// instead of hiding behind a generic failure.
function bindTenants() {
  const all = document.getElementById('tnAll');
  const del = document.getElementById('tnDel');
  const boxes = () => Array.from(document.querySelectorAll('.tn-chk'));
  const sync = () => {
    const picked = boxes().filter(b => b.checked);
    if (del) {
      del.disabled = picked.length === 0;
      del.textContent = picked.length ? `Delete selected (${picked.length})` : 'Delete selected';
    }
    if (all) all.checked = boxes().length > 0 && picked.length === boxes().length;
  };
  if (all) all.addEventListener('change', () => { boxes().forEach(b => { b.checked = all.checked; }); sync(); });
  // ONE-CLICK PROBE SELECT (cron 2026-10-18). The rows carry `data-probe="1"` from the SAME predicate
  // that renders the probe badge (`probeBadgeFor`), so the button's count, the rows it ticks and the
  // badges on screen cannot disagree — which is exactly how a test-account sweep under-counts when the
  // operator has to tick rows by eye. Rows the API refuses are still ticked: bulk-delete answers per
  // id and keeps the reason next to the row it kept.
  const probeBoxes = () => Array.from(document.querySelectorAll('tr[data-probe="1"] .tn-chk'));
  const pb = document.getElementById('tnProbes');
  if (pb) {
    pb.textContent = 'Select probes (' + probeBoxes().length + ')';
    pb.disabled = probeBoxes().length === 0;
    pb.addEventListener('click', () => {
      boxes().forEach(b => { b.checked = false; });
      probeBoxes().forEach(b => { b.checked = true; });
      sync();
    });
  }
  boxes().forEach(b => b.addEventListener('change', sync));
  // Assign a workspace's plan from the row it is read on. The backend route has existed since
  // `assign_plan` (POST /api/v1/tenants/:id/plan) and its only caller was the Plan Admin screen's
  // two-dropdown form, so an operator looking at "no plan" here had to remember which screen could
  // fix it. Same writer either way: `set_active_plan` on the active subscription row.
  document.querySelectorAll('.plan-sel').forEach(sel => sel.addEventListener('change', async () => {
    const tid = sel.getAttribute('data-tenant');
    const slug = sel.value;
    const prev = sel.getAttribute('data-current') || '';
    if (slug === prev) return;
    if (!slug) { sel.value = prev; showToast('A workspace keeps its plan once it has one - pick a plan', 'info'); return; }
    const plan = TENANT_PLAN_ROWS.find(p => p.slug === slug);
    if (!plan) { sel.value = prev; showToast('That plan is not in the catalogue', 'error'); return; }
    sel.disabled = true;
    try {
      await api('/tenants/' + encodeURIComponent(tid) + '/plan', { method: 'POST', body: JSON.stringify({ plan_id: plan.id }) });
      showToast('Plan set to ' + (plan.name || slug), 'success');
      renderApp();
    } catch (e) {
      sel.disabled = false;
      sel.value = prev;
      showToast((e && e.message) || 'Could not set the plan', 'error');
    }
  }));
  if (del) del.addEventListener('click', async () => {
    const ids = boxes().filter(b => b.checked).map(b => b.value).filter(Boolean);
    if (ids.length === 0) return;
    if (!confirm(`Delete ${ids.length} tenant(s)? This cannot be undone.`)) return;
    del.disabled = true;
    try {
      const r = await api('/tenants/bulk-delete', { method: 'POST', body: JSON.stringify({ ids }) });
      const n = r && typeof r.deleted === 'number' ? r.deleted : 0;
      const refused = (r && r.failed) || [];
      showToast(`${n} tenant(s) deleted` + (refused.length ? ` — ${refused.length} refused or not found` : ''),
                refused.length ? 'error' : 'success');
      if (refused.length && refused[0] && refused[0].error) showToast(refused[0].error, 'error');
    } catch (e) {
      showToast((e && e.message) || 'Delete failed', 'error');
    }
    renderApp();
  });
  // ── one workspace's people: open, list, add ──
  document.querySelectorAll('.tu-open').forEach(b => b.addEventListener('click', async () => {
    TENANT_USER_TENANT = b.getAttribute('data-tenant');
    TENANT_USER_TENANT_NAME = b.getAttribute('data-name') || '';
    TENANT_USERS = null; TENANT_USERS_MSG = '';
    renderApp();
    try {
      const r = await api('/admin/tenants/' + encodeURIComponent(TENANT_USER_TENANT) + '/users', { method: 'POST', body: '{}' });
      TENANT_USERS = Array.isArray(r) ? r : ((r && (r.users || r.data)) || []);
    } catch (e) { TENANT_USERS = []; TENANT_USERS_MSG = '<span style="color:#b91c1c">Could not load the people here: ' + x(e.message) + '</span>'; }
    renderApp();
  }));
  const closeTu = document.getElementById('tu-close');
  if (closeTu) closeTu.addEventListener('click', () => { TENANT_USER_TENANT = null; TENANT_USERS = null; TENANT_USERS_MSG = ''; renderApp(); });
  const addTu = document.getElementById('tu-add');
  if (addTu) addTu.addEventListener('click', async () => {
    const nameEl = document.getElementById('tu-name'), mailEl = document.getElementById('tu-email');
    const email = (mailEl && mailEl.value || '').trim();
    if (!email) { showToast('An email address is required', 'error', false); return; }
    addTu.disabled = true;
    try {
      const r = await api('/admin/users', { method: 'POST', body: JSON.stringify({ tenant_id: TENANT_USER_TENANT, name: (nameEl && nameEl.value || '').trim(), email, role: ((document.getElementById('tu-role')||{}).value || 'user') }) });
      // The credentials mail is the only way the customer learns their password. When it did not go
      // out, the route hands the generated value back ONCE — that is the whole point of this pane.
      if (r && r.credentials_emailed) {
        TENANT_USERS_MSG = '<span style="color:#15803d">✅ Added ' + x(r.email) + ' — their login details were emailed.</span>';
      } else if (r && r.withheld) {
        TENANT_USERS_MSG = '<span style="color:#b45309">⛔ Added ' + x(r.email) + ', but nothing was emailed (reserved/test address). Hand them this password:</span> <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px">' + x(r.handover_password || '') + '</code>';
      } else {
        TENANT_USERS_MSG = '<span style="color:#b91c1c">❌ Added ' + x(r && r.email || email) + ', but the credentials email FAILED — they have no way in. Hand them this password:</span> <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px">' + x((r && r.handover_password) || '') + '</code>' + (r && r.detail ? '<div style="font-size:12px;color:#b91c1c">' + x(r.detail) + '</div>' : '');
      }
      try {
        const l = await api('/admin/tenants/' + encodeURIComponent(TENANT_USER_TENANT) + '/users', { method: 'POST', body: '{}' });
        TENANT_USERS = Array.isArray(l) ? l : ((l && (l.users || l.data)) || []);
      } catch (e) {}
    } catch (e) {
      TENANT_USERS_MSG = '<span style="color:#b91c1c">' + x(e.message) + '</span>';
    }
    renderApp();
  });
  // Move an existing teammate to another role. The route refuses two cases in words — your own
  // role, and the workspace's only admin — so those refusals land in the panel instead of a toast
  // that disappears.
  document.querySelectorAll('.tu-role-sel').forEach(sel => sel.addEventListener('change', async () => {
    const uid = sel.getAttribute('data-user');
    const role = sel.value;
    const prev = sel.getAttribute('data-current') || '';
    if (!uid || role === prev) return;
    sel.disabled = true;
    try {
      const r = await api('/admin/users/' + encodeURIComponent(uid) + '/role', { method: 'POST', body: JSON.stringify({ role }) });
      TENANT_USERS_MSG = '<span style="color:#15803d">✅ ' + x((r && r.email) || 'That teammate') + ' is now ' + x(roleLabel((r && r.role) || role)) + '.</span>';
      try {
        const l = await api('/admin/tenants/' + encodeURIComponent(TENANT_USER_TENANT) + '/users', { method: 'POST', body: '{}' });
        TENANT_USERS = Array.isArray(l) ? l : ((l && (l.users || l.data)) || []);
      } catch (e) {}
    } catch (e) {
      sel.value = prev;
      sel.disabled = false;
      TENANT_USERS_MSG = '<span style="color:#b91c1c">' + x((e && e.message) || 'Could not change that role') + '</span>';
    }
    renderApp();
  }));
  sync();
}

function bindLeadCapture() {
  document.getElementById('wtl-create')?.addEventListener('click', async () => {
    const name = ((document.getElementById('wtl-name')||{}).value||'').trim();
    const form_title = ((document.getElementById('wtl-title')||{}).value||'').trim();
    if (!name) { showToast('Give the form a name first', 'error'); return; }
    const fields = ['name','email','phone','company'].filter(f => { const el = document.getElementById('wtl-f-'+f); return el && el.checked; });
    const tag = ((document.getElementById('wtl-tag')||{}).value||'').trim();
    try {
      await api('/web-to-lead/configs', { method: 'POST', body: JSON.stringify({ name: name, form_title: form_title || undefined, fields: fields, tag_ids: tag ? [tag] : [] }) });
      showToast('Capture form created', 'success');
    } catch (e) { showToast('Could not create the form: ' + e.message, 'error'); }
  });
  document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
    try {
      await api('/web-to-lead/configs/' + b.dataset.toggle, { method: 'PUT', body: JSON.stringify({ is_active: b.dataset.on !== '1' }) });
      showToast(b.dataset.on === '1' ? 'Form paused' : 'Form activated', 'success');
    } catch (e) { showToast('Could not update the form: ' + e.message, 'error'); }
  }));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this capture form? Any site still showing its snippet will stop capturing leads.')) return;
    try { await api('/web-to-lead/configs/' + b.dataset.del, { method: 'DELETE' }); showToast('Capture form deleted', 'success'); }
    catch (e) { showToast('Could not delete the form: ' + e.message, 'error'); }
  }));
  document.querySelectorAll('[data-embed]').forEach(b => b.addEventListener('click', async () => {
    try {
      const r = await api('/web-to-lead/configs/' + b.dataset.embed + '/embed');
      const box = document.getElementById('wtl-embed-box');
      const pre = document.getElementById('wtl-embed');
      if (pre) pre.textContent = (r && r.embed_code) || '';
      if (box) { box.style.display = ''; box.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    } catch (e) { showToast('Could not load the snippet: ' + e.message, 'error'); }
  }));
  document.getElementById('wtl-copy')?.addEventListener('click', async () => {
    const pre = document.getElementById('wtl-embed');
    if (!pre) return;
    try { await navigator.clipboard.writeText(pre.textContent || ''); showToast('Snippet copied', 'success'); }
    catch (e) { showToast('Select the snippet and copy it manually', 'error'); }
  });
}

function bindEmailBranding() {
  const picker = document.getElementById('brand-color-picker');
  const hex = document.getElementById('brand-color');
  if (picker && hex) {
    picker.addEventListener('input', () => { hex.value = picker.value; });
    hex.addEventListener('input', () => { if (/^#[0-9a-fA-F]{6}$/.test(hex.value.trim())) picker.value = hex.value.trim(); });
  }
  document.getElementById('brand-save')?.addEventListener('click', saveEmailBranding);
  /* FS-10: the inline guide promises "Preview how a mail will look" — re-render the mock header on
     every edit (name, colour, logo) so the operator sees the real header before saving. */
  const bpName = document.getElementById('brand-name');
  if (bpName) bpName.addEventListener('input', window._brandPreview);
  if (picker) picker.addEventListener('input', window._brandPreview);
  if (hex) hex.addEventListener('input', window._brandPreview);
  window._brandPreview();
  const file = document.getElementById('brand-logo-file');
  document.getElementById('brand-logo-pick')?.addEventListener('click', () => { if (file) file.click(); });
  if (file) file.addEventListener('change', uploadBrandLogo);
  document.getElementById('brand-logo-remove')?.addEventListener('click', removeBrandLogo);
}

window._brandPreview = function() {
  const box = document.getElementById('brand-preview');
  if (!box) return;
  const nameEl = document.getElementById('bp-name');
  const rule = document.getElementById('bp-rule');
  const logoWrap = document.getElementById('bp-logo');
  const logoImg = document.getElementById('brand-logo-img');
  const nameInput = document.getElementById('brand-name');
  const hexInput = document.getElementById('brand-color');
  const picked = document.getElementById('brand-color-picker');
  const name = ((nameInput && nameInput.value) || '').trim();
  let color = ((hexInput && hexInput.value) || '').trim();
  if (!/^#[0-9a-fA-F]{6}$/.test(color)) color = (picked && picked.value) || '#4f46e5';
  const logo = (logoImg && logoImg.getAttribute) ? (logoImg.getAttribute('src') || '') : '';
  if (nameEl) { nameEl.textContent = name || 'FunnelSwift'; nameEl.style.color = color; }
  if (rule) rule.style.background = color;
  const wrap = document.getElementById('bp-logo');
  const img = document.getElementById('bp-logo-img');
  if (wrap && img) {
    if (logo) { img.setAttribute('src', logo); wrap.style.display = 'block'; }
    else { wrap.style.display = 'none'; }
  }
};

async function saveEmailBranding() {
  const name = ((document.getElementById('brand-name') || {}).value || '').trim();
  const color = ((document.getElementById('brand-color') || {}).value || '').trim();
  try {
    await api('/settings', { method: 'PUT', body: JSON.stringify({ key: 'email_branding', value: { brand_name: name, brand_color: color } }) });
    showToast('Email branding saved', 'success');
    renderApp();
  } catch (e) { showToast('Save failed: ' + e.message, 'error'); }
}

async function uploadBrandLogo() {
  const file = document.getElementById('brand-logo-file');
  const f = file && file.files && file.files[0];
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { showToast('That image is larger than 2 MB', 'error'); return; }
  const fd = new FormData();
  fd.append('logo', f, f.name);
  try {
    const res = await fetch(API_BASE + '/settings/branding/logo', {
      method: 'POST',
      headers: TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {},
      body: fd
    });
    if (res.status === 401) { clearSession(); window.location.href = '/login'; return; }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || body.message || ('Error ' + res.status));
    showToast('Logo uploaded', 'success');
    renderApp();
  } catch (e) { showToast('Upload failed: ' + e.message, 'error'); }
}

async function removeBrandLogo() {
  try {
    await api('/settings/branding/logo', { method: 'DELETE' });
    showToast('Logo removed', 'success');
    renderApp();
  } catch (e) { showToast('Remove failed: ' + e.message, 'error'); }
}

     saw only their own workspace's cards and every other customer's cards were invisible (measured
     2026-10-20: `/kinetic/cards` -> 0 rows for a fresh operator, while `/admin/kinetic-cards` -> 7
     cards across 3 workspaces). The admin route existed with no door onto it. The per-card
     Stats/UTM panes are still workspace-scoped READS/WRITES, so they are offered only on the
     operator's own cards; a foreign card is shown, labelled with its workspace, and not editable. */

  try { const r = await api('/admin/kinetic-cards'); cards = Array.isArray(r)?r:(r?.cards||r?.data||[]); } catch(e) { cards = []; }

      <thead><tr><th>Card</th><th>Workspace</th><th>Type</th><th>Slug</th><th>Views</th><th>UTM</th><th>Actions</th></tr></thead>

        <td><strong>${x(c.title||'Untitled')}</strong>${c.is_active===false?' <span class="badge" style="background:#e2e8f0">inactive</span>':''}</td>
        <td>${x(c.tenant_name||'Unknown')}</td>

        <td><code style="font-size:11px">${x(c.slug)}</code></td>
        <td>${(c.view_count||c.views||0).toLocaleString()}</td>
        <td>${c.utm_source?`<span class="badge badge-green">${x(c.utm_source)}</span>`:`<span class="badge" style="background:#e2e8f0">None</span>`}</td>
        <td>

function bindCardUtmBuilder() {
  document.getElementById('save-utm-btn')?.addEventListener('click', async () => {
    const cardId = STATE.data?.cardId;
    if (!cardId) return;
    const data = {
      utm_source: document.getElementById('utm-source')?.value||'',
      utm_medium: document.getElementById('utm-medium')?.value||'',
      utm_campaign: document.getElementById('utm-campaign')?.value||'',
      utm_content: document.getElementById('utm-content')?.value||'',
      utm_term: document.getElementById('utm-term')?.value||''
    };
    try {
      await api('/card-analytics/'+cardId+'/utm', { method: 'PUT', body: JSON.stringify(data) });
      showToast('UTM parameters saved!', 'success');
    } catch(e) { showToast(e.message, 'error'); }
  });

  document.getElementById('gen-url-btn')?.addEventListener('click', async () => {
    const cardId = STATE.data?.cardId;
    if (!cardId) return;
    try {
      const res = await api('/card-analytics/'+cardId+'/tracking-url');
      const url = res?.tracking_url||res?.url||'';
      const area = document.getElementById('utm-url-area');
      const input = document.getElementById('utm-url-display');
      if (area) area.style.display = 'block';
      if (input) input.value = url;
    } catch(e) { showToast(e.message, 'error'); }
  });

  document.getElementById('copy-url-btn')?.addEventListener('click', () => {
    const input = document.getElementById('utm-url-display');
    if (!input) return;
    navigator.clipboard.writeText(input.value).then(() => showToast('URL copied!', 'success')).catch(() => showToast('Failed to copy', 'error'));
  });
}

function bindPlanAdmin() {
  const rl = $('planadmin-reload'); if (rl) rl.onclick = () => renderView();
  document.querySelectorAll('[data-plan-edit]').forEach(b => { b.onclick = () => window._editPlanFeatures(b.dataset.planEdit); });
  const ab = $('planadmin-assign-btn');
  if (ab) ab.onclick = async () => {
    const tenant_id = ($('planadmin-assign-tenant') || {}).value;
    const plan_id = ($('planadmin-assign-plan') || {}).value;
    const msg = $('planadmin-assign-msg');
    if (!tenant_id || !plan_id) { if (msg) msg.textContent = 'Select both a tenant and a plan.'; return; }
    ab.disabled = true; if (msg) msg.textContent = 'Assigning…';
    try {
      const r = await api('/admin/plans/assign', { method: 'POST', body: JSON.stringify({ tenant_id, plan_id }) });
      if (msg) msg.textContent = '✓ ' + (r.message || 'Plan assigned');
      showToast('Plan assigned', 'success');
    } catch (e) { if (msg) msg.textContent = '✗ ' + e.message; }
    ab.disabled = false;
  };
  const os = $('planadmin-ov-save');
  if (os) os.onclick = async () => {
    const tid = ($('planadmin-ov-tenant') || {}).value;
    const key = (($('planadmin-ov-key') || {}).value || '').trim();
    const raw = (($('planadmin-ov-val') || {}).value || '').trim();
    // A blank value is an explicit CLEAR (null), not a zero — 0 means "disabled for this tenant"
    // and must never be sent by accident. The input ships empty for the same reason.
    const val = raw === '' ? null : parseInt(raw, 10);
    const msg = $('planadmin-ov-msg');
    if (!tid || !key || (val !== null && isNaN(val))) { if (msg) msg.textContent = 'Tenant and feature_key are required; limit_value must be a number (or blank to clear).'; return; }
    os.disabled = true;
    try {
      const r = await api('/admin/tenants/' + tid + '/feature-override', { method: 'POST', body: JSON.stringify({ feature_key: key, limit_value: val }) });
      const done = (r && r.status) ? r.status : 'set';
      if (msg) msg.textContent = '✓ ' + (done === 'cleared' ? 'Override cleared — the plan decides again.' : 'Override set: ' + key + ' = ' + val + ' for this tenant only.');
      showToast(r.message || 'Override saved', 'success');
      loadPlanRegistry();
    } catch (e) { if (msg) msg.textContent = '✗ ' + e.message; }
    os.disabled = false;
  };
  const ol = $('planadmin-ov-load');
  if (ol) ol.onclick = async () => {
    const tid = ($('planadmin-ov-tenant') || {}).value;
    const out = $('planadmin-ov-out');
    if (!tid) { if (out) out.textContent = 'Select a tenant first.'; return; }
    ol.disabled = true;
    try {
      const r = await api('/admin/tenants/' + tid + '/feature-overrides');
      const ov = (r && r.overrides) || [];
      if (out) out.innerHTML = ov.length
        ? `<table class="table"><thead><tr><th>feature_key</th><th>limit_value</th></tr></thead><tbody>${ov.map(o => `<tr><td><code>${x(o.feature_key)}</code></td><td>${x(o.limit_value)}</td></tr>`).join('')}</tbody></table>`
        : 'No overrides set for this tenant.';
    } catch (e) { if (out) out.textContent = '✗ ' + e.message; }
    ol.disabled = false;
  };
  const gt = $('planadmin-grant-top');
  if (gt) gt.onclick = async () => {
    if (!confirm('Grant EVERY registry feature to the top tier?\n\nExisting limit caps are never raised, and booleans not already granted are turned on.')) return;
    gt.disabled = true;
    try { const r = await api('/admin/plans/grant-top-tier', { method: 'POST' }); showToast(r.message || 'Top tier granted', 'success'); }
    catch (e) { showToast('✗ ' + e.message, 'error'); }
    gt.disabled = false;
    loadPlanRegistry();
  };
  loadPlanRegistry();
}

// ── Feature registry matrix (kanban t_35acff73, AF-5) ─────────────────────────────────────────
// One row per key the app's gates can read, one column per plan, showing the value the GATE will
// actually see (not just what the row stores). Loaded AFTER its container exists, in
// bindPlanAdmin — a loader that runs before its own element is the bug that leaves a panel stuck
// on "Loading…" forever.
async function loadPlanRegistry() {
  const host = $('planadmin-registry');
  if (!host) return;
  try {
    const d = await api('/admin/plans/registry');
    host.innerHTML = planRegistryHTML(d);
  } catch (e) {
    host.innerHTML = '<div class="empty" style="padding:14px"><div class="desc">Could not load the registry: ' + x(e.message) + '</div></div>';
  }
}

function planRegistryValue(kind, v) {
  if (kind === 'boolean') return v === true ? '✅' : (v === false ? '❌' : '—');
  if (v === null || v === undefined) return '<span style="color:var(--muted)" title="not configured — the gate ALLOWS">unset</span>';
  if (v === -1) return '∞';
  if (v === 0) return '<span class="badge badge-red">off</span>';
  return String(v);
}

function planRegistryHTML(d) {
  const feats = (d && d.features) || [], plans = (d && d.plans) || [];
  if (!feats.length || !plans.length) return '<div class="empty" style="padding:14px"><div class="desc">The registry returned nothing.</div></div>';
  const head = '<tr><th style="text-align:left">Feature (gate key)</th>' +
    plans.map(p => '<th>' + (p.is_top ? '★ ' : '') + x(p.name) +
      '<div style="font-weight:400;font-size:11px;color:var(--muted)">' + x(p.slug) + ' · ' + formatCurrency(p.price) + '</div></th>').join('') +
    '</tr>';
  const rows = feats.map(f => {
    const cells = plans.map(p => {
      const v = (p.values || {})[f.key];
      const hint = f.kind === 'boolean' ? 'true or false' : 'a number: -1 unlimited, 0 off, blank = unset';
      return '<td style="text-align:center;cursor:pointer" title="click to change — ' + x(hint) + '" ' +
        'onclick="window._fsEditEntitlement(\'' + x(p.slug) + '\',\'' + x(f.key) + '\',\'' + x(f.kind) + '\')">' +
        planRegistryValue(f.kind, v) + '</td>';
    }).join('');
    return '<tr><td style="text-align:left"><strong>' + x(f.label) + '</strong>' +
      '<div style="font-size:11px;color:var(--muted)"><code>' + x(f.key) + '</code> · ' + x(f.kind) +
      (f.unit ? ' (' + x(f.unit) + ')' : '') + '</div></td>' + cells + '</tr>';
  }).join('');
  const viol = (d && d.superset_violations) || [];
  const inert = (d && d.inert_on_top) || [];
  const topName = (d && d.top_plan && d.top_plan.name) || 'the top tier';
  const status = (viol.length === 0
    ? '<div style="color:#16a34a;font-weight:600">✅ No plan beats ' + x(topName) + ' on any registry key.</div>'
    : '<div style="color:#dc2626;font-weight:600">⚠ ' + viol.length + ' key(s) where another plan beats the top tier: ' +
      viol.map(v => x(v.feature) + ' (' + x(v.beats_plan) + ' = ' + x(v.beats_value) + ', top = ' + x(v.top) + ')').join('; ') + '</div>') +
    (inert.length
      ? '<div style="color:#b45309;margin-top:4px">Inert on the top tier (no row, no column — the gate allows by ABSENCE, not by a grant): ' +
        inert.map(i => x(i.key)).join(', ') + '</div>'
      : '');
  const retired = (d && d.retired_keys) || [];
  const retiredNames = retired.map(r => '<span title="' + x(r.reason || '') + '">' + x(r.key) + '</span>').join(', ');
  const retiredLine = retired.length
    ? '<div style="font-size:11px;color:#b45309;margin-top:6px">Retired keys — no gate reads them, so ' +
      'they are not editable here and they enforce nothing. The <code>feature_limits</code> rows were ' +
      'DELETED by the migration that retired them (086 the ungated keys, 088 the retired routing ' +
      'resource, 090 the api-key family): ' + retiredNames + '. ' +
      '<strong>None of them is a usage cap:</strong> no API-call volume and no stored size is metered on ' +
      'any plan — the app counts no requests and no bytes, so this matrix cannot show a calls-per-period ' +
      'allowance. Hover a key for why it was retired.</div>'
    : '';
  return '<div style="font-size:12px;margin-bottom:8px">' + status + '</div>' +
    '<div class="table-wrap"><table class="table"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:6px">' + x((d && d.limit_semantics) || '') + '<br>' + x((d && d.boolean_semantics) || '') + '</div>' +
    retiredLine;
}

window._fsEditEntitlement = async function (plan, feature, kind) {
  const answer = prompt(kind === 'boolean'
    ? 'Set ' + feature + ' for ' + plan + ' — type true or false'
    : 'Set ' + feature + ' for ' + plan + ' — a number (-1 = unlimited, 0 = off, blank = unset)', '');
  if (answer === null) return;
  let value;
  if (kind === 'boolean') {
    const t = answer.trim().toLowerCase();
    if (t !== 'true' && t !== 'false') { showToast('Type true or false', 'error'); return; }
    value = t === 'true';
  } else if (answer.trim() === '') {
    value = null;
  } else {
    value = parseInt(answer, 10);
    if (isNaN(value)) { showToast('That is not a number', 'error'); return; }
  }
  try {
    const r = await api('/admin/plans/entitlement', { method: 'PUT', body: JSON.stringify({ plan: plan, feature: feature, value: value }) });
    showToast('Saved — the gate now sees ' + JSON.stringify(r.effective), 'success');
  } catch (e) { showToast('✗ ' + e.message, 'error'); }
};

/* kanban t_aad42041: the plan-features editor is the one modal whose SUCCESS path calls BOTH
   showToast() (which re-renders the shell) and an inline status line. STATE.modal.content used to be
   a STRING captured when the modal opened, so showToast's renderApp() rebuilt the modal from that
   stale string: #planadmin-features-msg came back empty and the textarea was repainted with the
   features the plan had at OPEN time. admin_update_plan_features MERGES
   (`features = features::jsonb || $1::jsonb`), so an operator who saved, saw the reverted box, typed a
   second change on top of it and saved again re-sent the OLD value of every key the first save had
   changed -- the first change was silently undone behind a 200 and a green toast. So:
     * renderModal() now evaluates a FUNCTION content, and this modal's content reads the draft (PFS)
       below -- that is what makes a repaint show the truth instead of the open-time snapshot;
     * the Save control is an inline `onclick`, because renderApp() replaces the node and a handler
       bound as a property on that node is destroyed with it, so a second Save click performed no
       request at all;
     * the success path stores the SAVED value in the draft (and in the list row the editor prefills
       from) BEFORE it toasts, so the box the operator keeps editing holds what the DB holds;
     * the refusal path (400, e.g. the retired features.card_types key) writes the same draft with NO
       toast, so the operator's '✗ ...' stays on screen exactly as before.
   The box is also the draft's authority while typing (oninput), so no repaint can drop a keystroke. */
const PFS = { id: null, features: '{}', templates: '', msg: '', busy: false };
window._planFeaturesInput = function (v) { PFS.features = v; };
window._planTemplatesInput = function (v) { PFS.templates = v; };
window._planFeaturesHTML = function () {
  return `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">The JSON object below is merged into the plan's existing <code>features</code>.</div>
      <textarea id="planadmin-features-json" class="input" style="width:100%;height:170px;font-family:ui-monospace,monospace;font-size:12px" oninput="window._planFeaturesInput(this.value)">${x(PFS.features)}</textarea>
      <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">allowed_template_ids (optional JSON array, leave blank to keep unchanged)</div>
      <input id="planadmin-templates-json" class="input" style="width:100%" placeholder='["tpl_1","tpl_2"]' value="${x(PFS.templates)}" oninput="window._planTemplatesInput(this.value)">
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-primary btn-sm" id="planadmin-features-save" onclick="window._savePlanFeatures()">Save Features</button>
        <button class="btn btn-secondary btn-sm" onclick="window._closeModal()">Cancel</button>
      </div>
      <div id="planadmin-features-msg" style="font-size:12px;margin-top:10px;color:var(--muted)">${x(PFS.msg)}</div>`;
};
window._editPlanFeatures = function (id) {
  const p = (STATE.data.planAdminPlans || []).find(z => z.id === id) || {};
  PFS.id = id;
  PFS.features = JSON.stringify(p.features || {}, null, 2);
  PFS.templates = p.allowed_template_ids ? JSON.stringify(p.allowed_template_ids) : '';
  PFS.msg = '';
  PFS.busy = false;
  STATE.modal = { title: 'Feature flags — ' + (p.name || id), content: window._planFeaturesHTML };
  renderApp();
};
window._savePlanFeatures = async function () {
  if (PFS.busy) return;
  /* snapshot the box FIRST: it is the authority on what the operator typed, and the success path
     re-renders, so the box is rebuilt from this draft */
  const ta = document.getElementById('planadmin-features-json');
  const tp = document.getElementById('planadmin-templates-json');
  const sv = document.getElementById('planadmin-features-save');
  const msg = document.getElementById('planadmin-features-msg');
  if (ta) PFS.features = ta.value;
  if (tp) PFS.templates = tp.value;
  /* the NON-success paths write the live status node, exactly as they always did: they raise no toast,
     so no re-render is involved and the operator's text is left where it is. */
  const sayMsg = (t) => { PFS.msg = t; if (msg) msg.textContent = t; };
  let features;
  try { features = JSON.parse(PFS.features || '{}'); }
  catch (e) { sayMsg('✗ features must be valid JSON: ' + e.message); return; }
  const tplRaw = (PFS.templates || '').trim();
  const body = { features };
  if (tplRaw) { try { body.allowed_template_ids = JSON.parse(tplRaw); } catch (e) { sayMsg('✗ allowed_template_ids must be valid JSON array'); return; } }
  PFS.busy = true; sayMsg('Saving…'); if (sv) sv.disabled = true;
  try {
    const r = await api('/admin/plans/' + PFS.id + '/features', { method: 'PUT', body: JSON.stringify(body) });

    PFS.features = JSON.stringify(features, null, 2);

    if (row) { row.features = features; if (body.allowed_template_ids) row.allowed_template_ids = body.allowed_template_ids; }

// ═══════════════════════════════════════════════════════════════════════════════
// WIRED SURFACES — kanban t_4cc3f695 (dead-endpoint triage)
// Every endpoint below was served by the backend with no caller in any shipped
// shell. Each one is now reachable from this console: four first-class sidebar
// views, plus a panel appended to the view that owns the feature. Panels mount
// after the owning view renders and swallow their own errors, so a failing
// endpoint can never blank a working view.
// ═══════════════════════════════════════════════════════════════════════════════

function wiredPanel(view, title, subtitle) {
  const c = document.getElementById('view-container');
  if (!c) return null;
  const host = document.createElement('div');
  host.innerHTML = '<div class="card"><div class="card-header"><div><div class="card-title">' + x(title) +
    '</div><div class="card-subtitle">' + x(subtitle) + '</div></div></div><div class="wbody"></div></div>';
  c.appendChild(host);
  return host.querySelector('.wbody');
}

function wiredErr(body, e) {
  body.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div class="desc">' + x((e && e.message) || String(e)) + '</div></div>';
}

function wiredInput(id, placeholder, type, value) {
  return '<input class="input" id="' + id + '" type="' + (type || 'text') + '" placeholder="' + x(placeholder || '') + '" value="' + x(value === undefined || value === null ? '' : value) + '" style="max-width:320px">';
}

function wiredTable(cols, rows, empty) {
  if (!rows || !rows.length) return '<div class="empty" style="padding:14px">' + x(empty || 'Nothing here yet') + '</div>';
  return '<div class="table-wrap"><table class="table"><thead><tr>' + cols.map(c => '<th>' + x(c) + '</th>').join('') +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}

function mountWiredPanels(view) {
  try {
    switch (view) {
      case 'dashboard': wiredInsights(); break;
      case 'affiliateProducts': wiredAffiliateProductSync(); break;
      case 'portfolio': wiredPortfolioSync(); break;
      case 'emailTemplates': wiredTemplateTypes(); break;
      case 'settings': wiredSettingDelete(); break;
      case 'affiliates': wiredAffiliateDetail(); break;
    }
  } catch (e) { /* a panel must never break the view it is attached to */ }
}

function bindSiteSettings() {
  const load = document.getElementById('wired-ss-load');
  const save = document.getElementById('wired-ss-save');
  const keyEl = document.getElementById('wired-ss-key');
  const valEl = document.getElementById('wired-ss-value');
  const msg = document.getElementById('wired-ss-msg');
  const doLoad = async () => {
    const key = keyEl.value.trim();
    if (!key) { msg.textContent = '✗ enter a key'; return; }
    msg.textContent = 'Loading…';
    try {
      const r = await api('/admin/sites/' + encodeURIComponent(key));
      valEl.value = typeof r.value === 'string' ? r.value : JSON.stringify(r.value, null, 2);
      msg.textContent = '✓ loaded';
    } catch (e) { msg.textContent = '✗ ' + e.message; }
  };
  if (load) load.onclick = doLoad;
  document.querySelectorAll('button[data-site-key]').forEach(b => {
    b.onclick = async () => {
      keyEl.value = b.dataset.siteKey;
      await doLoad();
      valEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  });
  if (save) save.onclick = async () => {
    const key = keyEl.value.trim();
    if (!key) { msg.textContent = '✗ enter a key'; return; }
    let value = valEl.value;
    try { value = JSON.parse(valEl.value); } catch (e) { value = valEl.value; }
    save.disabled = true; msg.textContent = 'Saving…';
    try {
      await api('/admin/sites/' + encodeURIComponent(key), { method: 'PUT', body: JSON.stringify({ value: value }) });
      msg.textContent = '✓ saved';
      showToast('Site setting saved', 'success');
      renderView();
    } catch (e) { msg.textContent = '✗ ' + e.message; save.disabled = false; }
  };
}

    const msg = document.getElementById('wired-tr-msg');
    const body = {
      name: document.getElementById('wired-tr-name').value.trim(),
      trigger_tag_id: document.getElementById('wired-tr-trigger').value,
      action_type: document.getElementById('wired-tr-action').value,
      target_app: document.getElementById('wired-tr-app').value,
      is_active: true,
    };
    const atag = document.getElementById('wired-tr-actiontag').value;
    if (atag) body.action_tag_id = atag;
    if (!body.name || !body.trigger_tag_id || !body.action_type) { msg.textContent = '✗ name, trigger tag and action are required'; return; }
    add.disabled = true; msg.textContent = 'Saving…';
    try {
      await api('/tag-rules', { method: 'POST', body: JSON.stringify(body) });
      showToast('Tag rule created', 'success');
      renderView();
    } catch (e) { msg.textContent = '✗ ' + e.message; add.disabled = false; }
  };
  document.querySelectorAll('button[data-rule-del]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try { await api('/tag-rules/' + b.dataset.ruleDel, { method: 'DELETE' }); showToast('Tag rule deleted', 'success'); renderView(); }
      catch (e) { showToast(e.message, 'error'); b.disabled = false; }
    };
  });
  document.querySelectorAll('button[data-rule-toggle]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try { await api('/tag-rules/' + b.dataset.ruleToggle, { method: 'PUT', body: JSON.stringify({ is_active: false }) }); showToast('Tag rule updated', 'success'); renderView(); }
      catch (e) { showToast(e.message, 'error'); b.disabled = false; }
    };
  });
}

    <!-- route: GET /api/v1/checkout/sessions -->
    <div style="font-size:12px;color:var(--muted);margin-bottom:18px">Every payment session this workspace has started, with its provider, amount and status.</div>
    <div class="card">
