<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FunnelSwift — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate icon" href="/favicon.ico">
  <script src="/chart.umd.min.js"></script>
<style>
:root{--primary:#6366f1;--primary-dark:#4f46e5;--bg:#f1f5f9;--surface:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);margin:0;color:var(--text)}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);min-height:100vh;padding:12px;display:flex;flex-direction:column;flex-shrink:0;position:fixed;left:0;top:0;bottom:0;z-index:100;overflow-y:auto}
.main{margin-left:240px;padding:24px;min-height:100vh}
.logo-area{display:flex;align-items:center;gap:8px;padding:12px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-area .icon{font-size:24px}
.logo-area .title{font-weight:700;font-size:16px;color:var(--text)}
.nav-section{margin-bottom:4px}
.nav-section-header{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:#f1f5f9;color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge{font-size:10px;padding:1px 6px;border-radius:10px;background:#e2e8f0;color:var(--muted);margin-left:auto}
.nav-item.active .badge{background:rgba(255,255,255,.25);color:#fff}
.nav-divider{height:1px;background:var(--border);margin:8px 0}
.nav-footer{padding:8px;border-top:1px solid var(--border);margin-top:auto}
.nav-user{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted)}
.nav-user:hover{background:#f1f5f9}
.nav-user .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.nav-user .logout{color:var(--danger);font-size:11px;margin-left:auto;cursor:pointer}
.nav-guide{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.nav-guide:hover{background:#f1f5f9;color:var(--text)}
/* Cards & Tables */
.card{background:var(--surface);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600}
.card-subtitle{font-size:13px;color:var(--muted)}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
.table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.table tr:hover td{background:#f8fafc}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#f1f5f9;color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:2px 8px;font-size:11px;border-radius:6px}
.btn-icon{padding:6px;border-radius:8px;background:0 0;border:none;cursor:pointer;font-size:16px}
.btn-icon:hover{background:#f1f5f9}
.btn-group{display:flex;gap:6px}
/* Inputs */
.input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:100%;outline:0;background:var(--surface);box-sizing:border-box}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.select{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;outline:0;background:var(--surface)}
.search-bar{position:relative}
.search-bar .input{padding-left:32px}
.search-bar .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;animation:slideUp .2s}
.modal-lg{max-width:700px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:600}
.modal-close{background:0 0;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{margin-bottom:20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:11px;color:var(--muted);margin-top:2px}
/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#ede9fe;color:#5b21b6}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-value{font-size:24px;font-weight:700;color:var(--text)}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.stat-change{font-size:11px;margin-top:4px}
.stat-change.up{color:var(--success)}.stat-change.down{color:var(--danger)}
/* Toggle */
.toggle{position:relative;width:40px;height:22px;background:#cbd5e1;border-radius:11px;cursor:pointer;transition:background .2s;display:inline-block}
.toggle.on{background:var(--primary)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:12px}
.empty .title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.empty .desc{font-size:13px}
/* Section divider in sidebar */
.sidebar-section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#94a3b8;padding:8px 12px 2px}
/* Role indicator */
.role-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fef3c7;color:#92400e;margin-left:4px}
.role-badge.admin{background:#ede9fe;color:#5b21b6}
/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;z-index:300;animation:slideUp .2s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--primary)}
/* Responsive */
@media(max-width:768px){.sidebar{width:60px!important}.sidebar .nav-text,.sidebar .nav-section-header,.sidebar .logo-area .title,.sidebar .badge,.sidebar .role-badge,.sidebar .section-divider-label{display:none}.sidebar .nav-item{justify-content:center;padding:10px}.sidebar .nav-item .icon{font-size:18px}.main{margin-left:60px!important}}
/* Plan card in upgrade */
.plan-card{border:2px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:all .2s}
.plan-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(99,102,241,.1)}
.plan-card.current{border-color:var(--primary);background:#eef2ff}
.plan-name{font-size:18px;font-weight:700;margin-bottom:8px}
.plan-price{font-size:32px;font-weight:800;color:var(--primary);margin-bottom:4px}
.plan-price span{font-size:14px;font-weight:400;color:var(--muted)}
.plan-features{list-style:none;padding:0;margin:16px 0;text-align:left;font-size:13px}
.plan-features li{padding:6px 0;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px}
.plan-features li .check{color:var(--success);font-weight:700}
.plan-features li .cross{color:var(--muted)}
</style>
<link rel="stylesheet" href="/tw.css">
</head>
<body>
<div id="app"></div>
<script type="module">
// ── FunnelSwift Admin SPA ──
const API_BASE = '/api/v1';
let TOKEN = localStorage.getItem('ws_fs_token') || '';
let USER = null; // { user_id, tenant_id, email, name, role, is_admin, api_key, current_plan, planObj }
let STATE = { view: 'dashboard', modal: null, data: {}, toast: null, subView: null };
// Open asks in the operator's plan-request queue (below). Kept at this level because the shell is
// re-rendered on every view switch: the sidebar label has to carry the count from the module, not
// from a DOM node that the next render throws away. `var` so the boot IIFE cannot hit a TDZ.
var PLAN_REQ_OPEN = 0;

// ── API ──
async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  if (res.status === 401) { clearSession(); window.location.href = '/login'; throw new Error('auth'); }
  if (res.status === 402) { showToast('Upgrade required — this feature needs a paid plan', 'error', false); throw new Error('402'); }
  if (!res.ok) { const e = await res.json().catch(()=>({error:'Request failed'})); throw new Error(e.error||e.message||'Error '+res.status); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── Toast ──
function showToast(msg, type='info', reRender=true) {
  STATE.toast = { msg, type };
  /* kanban t_d10ac776/[post]: a modal's body is NOT part of this shell's markup -- renderApp()
     paints `<div class="modal-body" id="modal-body">${m.content||''}</div>` from the PLACEHOLDER
     the opener stored, while every opener fills that node itself afterwards, in its own
     setTimeout, from its own fetch. So the immediate renderApp() here repainted the shell over an
     open modal and destroyed the injected form: the overlay stayed up and the admin had nothing to
     submit (measured on the failed-create path, admin.funnelswift.net). While a modal is open the
     toast is therefore painted into the node it owns, `#toast`, and the shell is left alone --
     exactly what this slot's own 3500 ms clear timer already does in reverse.
     Outside a modal the repaint is KEPT on purpose: it is the refresh mechanism for 52 of
     showToast's 93 call sites (classify-renders.py: those sites call no renderView themselves), so
     dropping it everywhere would stop those panels reloading. This is arm (a) narrowed to the one
     situation where the repaint is destructive. */
  if (!STATE.modal && reRender) {
    renderApp();
  } else {
    const prev = document.getElementById('toast');
    if (prev) prev.remove();
    const app = document.getElementById('app');
    if (app) {
      const el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.id = 'toast';
      el.textContent = msg;
      app.appendChild(el);
    }
  }
  /* kanban t_20c72970: clear the slot WITHOUT rebuilding the shell. A modal is not part of the
     shell's markup: every modal fills #modal-body itself, after its own fetch, in its own
     setTimeout (openAffiliateProductModal, openTagModal, openWebhookModal, ...), so the full
     renderApp() that used to run here repainted the shell 3500 ms later and wiped a body a modal
     had already painted -- an operator who opened any modal within 3.5 s of a toast saw an empty
     form with no way to save (measured, admin.funnelswift.net). Candidate (b) -- have renderApp()
     preserve the painted #modal-body -- was rejected by measurement: re-injecting the saved
     innerHTML re-creates the nodes, so every handler a modal bound as a property (the product
     form's submit listener) is gone and the form renders but cannot be submitted. STATE.toast is
     the only state this timer changes, so removing the painted node leaves the DOM exactly as a
     re-render would produce, minus the modal body. Doing no renderApp() here at all also means a
     STALE timer (two toasts in flight, single toast slot) can no longer repaint the shell over an
     open modal. */
  setTimeout(() => {
    STATE.toast = null;
    const t = document.getElementById('toast');
    if (t) t.remove();
  }, 3500);
}

// ── Helpers ──
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id) { return document.getElementById(id); }
/* kanban t_02f8fd6d: this gate asked for a vocabulary the app never issues. /api/v1/auth/me
   (src/auth/handlers.rs) returns `role` straight from the JWT and `is_admin` (= role === "admin"),
   and `auth.is_admin` is what every /api/v1/admin/* route checks server-side. `role === "super_admin"`
   and `is_super_admin` are therefore never true for a real sign-in (users.role is admin | company_admin
   | user), so the entire SUPER ADMIN nav section was hidden and its screens answered "Access Denied" —
   including the Tag Groups screen whose Edit button this card fixes. Accept the server's own
   vocabulary, the way IncentiveSwift's console already does. */
function isSuperAdmin() { return !!(USER && (USER.role === 'super_admin' || USER.role === 'admin' || USER.is_admin === true)); }
function canManageAffiliates() { return isSuperAdmin(); }
/* The Profile → Role line used to paint a bare "User" for every non-admin — the binary
   isSuperAdmin() word, not the account's real role (kanban: the same defect the sibling consoles
   fixed with roleLabel). Show the stored role, written out; the stored value as-is when it has no
   label (honest, never an invented role), and an em-dash when the server sent nothing. The Plan
   badge beside it carries the REAL plan name from GET /auth/me. */
const ROLE_LABELS = { super_admin:'Super admin', admin:'Admin', account_owner:'Account owner',
  owner:'Owner', company_admin:'Company admin', agency_admin:'Agency admin',
  client_admin:'Client admin', team_member:'Team member', member:'Member', user:'Member',
  viewer:'Viewer' };
function roleLabel(r) { const s = String(r == null ? '' : r).trim(); if (!s) return '—'; return ROLE_LABELS[s.toLowerCase()] || s; }
// Timestamps arrive as naive-UTC strings (the columns are `timestamp without time zone` and the
// Rust models serialise `NaiveDateTime`, so the JSON carries no zone suffix) and the analytics
// buckets arrive as date-only `YYYY-MM-DD`. A bare `new Date(v)` reads a naive value as LOCAL and
// a date-only value as UTC midnight, so the reader's offset shifted both: 4 hours on a timestamp,
// and a whole day on a bucket for every reader west of UTC. `asUtc` pins a naive timestamp to UTC
// (and is a no-op for the tz-suffixed ones, e.g. leads.updated_at / affiliates.rate_updated_at);
// `fmtDayLabel` reads a day bucket as a day and never routes it through Date.
const asUtc = (v) => { const s = String(v == null ? '' : v); return /[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z'; };
const fmtDayLabel = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v == null ? '' : v)); if (!m) return '-'; return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1] + ' ' + (+m[3]); };
function formatDate(d) { if(!d) return '-'; return new Date(asUtc(d)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function formatCurrency(n) { return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0); }
// Fleet plan-limit convention (src/features.rs::check_numeric_limit / resolved_limit): -1 = unlimited,
// 0 = NOT included on this plan (the gate refuses it), N>0 = a cap of N, and an unset (null) column is
// unlimited too (resolved_limit answers Ok on None). NEVER render a limit as `v || '∞'`: 0 is falsy,
// so that prints "unlimited" for a feature the gate REFUSES (measured live: Capture Free / Starter
// showed ∞ cards, Kinetic Free / Pro showed ∞ leads).
const fmtPlanLimit = (v) => (v === null || v === undefined || Number(v) < 0) ? '∞' : (Number(v) === 0 ? 'None' : v);

/* ── kanban t_02f8fd6d: prefill sources for the Edit modals ──────────────────────────────────
   The rows each list screen last rendered, keyed by id. These lists are `SELECT *`, so the row an
   Edit button came from already carries every field its modal reads — prefilling from it is the
   only source that cannot disagree with what the operator clicked. */
const EDIT_ROWS = { tags: {}, sysTags: {}, groups: {}, affiliateProducts: {}, webhooks: {} };
/* `rows` is that cache (optional); `fallback(id)` is the detail route for an out-of-band id.
   NOTE: GET /api/v1/tag-groups/:id is NOT routed (PUT/DELETE only — src/api_router.rs), which is
   what made the tag-group Edit answer an empty-bodied 405 and open a blank form. Its fallback is
   the LIST route, which IS served. */
async function rowForEdit(id, rows, fallback) {
  if (!id) return {};
  const hit = rows && rows[String(id)];
  if (hit) return hit;
  return (await fallback(String(id))) || {};
}
/* A failed prefill must never leave an editable form half-empty (the pre-fix tag-group Edit
   rendered an empty, `required` Name for a group that HAS one, so a no-touch save was impossible
   and a retyped name silently renamed the group): close the modal and say what failed instead of
   swallowing the rejection. */
function failEdit(e, what) {
  showToast((what || 'Could not load the record') + ': ' + ((e && e.message) || 'unknown error'), 'error');
  STATE.modal = null;
  renderApp();
}
/* Fallback for an out-of-band tag-group id: the LIST route, scoped and served. */
async function loadTagGroupById(id) {
  const list = await api('/tag-groups');
  const arr = Array.isArray(list) ? list : ((list && (list.data || list.groups)) || []);
  const found = arr.filter(g => String(g.id) === String(id))[0];
  if (!found) throw new Error('Tag group not found');
  return found;
}

/* -- kanban t_5289fd7b / t_968c2b09: the tags GROUP column and editor -------------------------
   `tags` stores `group_id` (Option<Uuid>, src/models/tag.rs) and has NO `group_name` column, and
   `UpdateTagRequest` accepts no such field -- so the old cell fell back to a hard-coded badge on
   every row (it read a key neither that table nor GET /api/v1/tags returns) and the old editor's
   free-text group box wrote a key serde silently ignored.
   The VOCABULARY is now the admin read GET /api/v1/admin/tag-groups (kanban t_968c2b09): the
   caller's own groups PLUS the groups its visible tags point at. The fleet's shared taxonomy is
   owned by the SYSTEM tenant, so the tenant-scoped GET /api/v1/tag-groups answers [] here and this
   console could not name a single taxonomy group -- the admin read is derived from `tags.group_id`,
   the very column being rendered, so it can never disagree with the rows it names. It is a READ:
   rename/delete stay tenant-scoped and the Tag Groups screen offers them only for its OWN rows. */
const TAG_GROUPS = { list: [], names: {} };
async function loadTagGroups() {
  let items = [];
  // kanban t_968c2b09 follow-up: the admin read is the OPERATOR's vocabulary. GET
  // /api/v1/admin/tag-groups is gated (`if !auth.is_admin -> Forbidden "Admin access required"`,
  // src/handlers/tag_group_handler.rs), so a tenant session's attempt answered a GUARANTEED 403 --
  // a red error in the console's own network log on every Tags load, for every customer. The
  // fallback below already answers for a tenant (its own groups), so gating the admin attempt on
  // the operator role changes NO data: the tenant path is exactly what today's 403 fell through
  // to. renderTags() -> loadTagGroups() runs only from renderApp(), which renders only once TOKEN
  // and USER are both present, so the role is always known here.
  try { items = await api(isSuperAdmin() ? '/admin/tag-groups' : '/tag-groups'); }
  catch(e) { try { items = await api('/tag-groups'); } catch(e2) { items = []; } }
  if (!Array.isArray(items)) items = items.data || items.groups || [];
  TAG_GROUPS.list = items;
  TAG_GROUPS.names = {};
  items.forEach(g => { TAG_GROUPS.names[String(g.id)] = g.name; });
}
function tagGroupCell(t) {
  if (!t || !t.group_id) return '<span style="color:var(--muted)">—</span>';
  const id = String(t.group_id);
  const name = TAG_GROUPS.names[id];
  if (name) return `<span class="badge badge-blue">${x(name)}</span>`;
  return `<span class="badge badge-blue" title="group id ${x(id)} - not in this console's tag-groups list">${x(id.slice(0,8)+'…')}</span>`;
}
/* kanban t_f94a8a00: a tag's group can now be CLEARED. `update_tag()` binds `req.group_id.or(
   tag.group_id)`, so an absent key AND an explicit null both mean "keep the stored one" -- null cannot
   express a clear, and a bare "" is an axum 422. The clear is therefore an explicit ADDITIVE flag,
   `clear_group: true` (UpdateTagRequest.clear_group): it ungroups the tag and leaves every body shape
   a shipped caller already sends (null = keep) meaning exactly what it means today, so no surface can
   silently wipe a tag's group. The select ALWAYS offers "— No group —"; choosing it sends
   `clear_group` (not a group_id), while an untouched select still sends the stored group (a no-op). */
function tagGroupOptions(current) {
  const cur = current ? String(current) : '';
  let opts = `<option value=""${cur ? '' : ' selected'}>— No group —</option>`;
  let found = false;
  TAG_GROUPS.list.forEach(g => {
    const id = String(g.id);
    if (id === cur) found = true;
    opts += `<option value="${x(id)}"${id === cur ? ' selected' : ''}>${x(g.name)}</option>`;
  });
  if (cur && !found)
    opts += `<option value="${x(cur)}" selected>${x(cur.slice(0,8)+'…')} - not in this console's group list</option>`;
  return opts;
}

/* Fallback for the affiliate-product Edit (kanban t_2b82d8f0): `GET
   /api/v1/affiliate-products/:id` is NOT routed either (PUT/DELETE only — src/api_router.rs), so the
   console's Edit prefilled through an empty-bodied 405 and failEdit closed the modal without a form.
   Same shape as loadTagGroupById: the LIST route is served, so resolve the row from it. */
async function loadAffiliateProductById(id) {
  const list = await api('/affiliate-products');
  const arr = Array.isArray(list) ? list : ((list && (list.data || list.products)) || []);
  const found = arr.filter(p => String(p.id) === String(id))[0];
  if (!found) throw new Error('Affiliate product not found');
  return found;
}

/* Fallback for an out-of-band WEBHOOK id (kanban t_ae907da8). `GET /api/v1/webhooks/:id` is not
   routed either (PUT/DELETE only — src/api_router.rs), so the editor's prefill used to reject with
   an empty-bodied 405 and failEdit closed the modal without a form. The LIST route is served, so
   resolve the row from it — the same shape as loadAffiliateProductById and loadTagGroupById. */
async function loadWebhookById(id) {
  const list = await api('/webhooks');
  const arr = Array.isArray(list) ? list : ((list && (list.data || list.webhooks)) || []);
  const found = arr.filter(w => String(w.id) === String(id))[0];
  if (!found) throw new Error('Webhook not found');
  return found;
}

// ── Login ──
async function doLogin(email, password) {
  const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
  TOKEN = res.token;
  localStorage.setItem('ws_fs_token', TOKEN);
  await loadUser();
  renderApp();
}

async function loadUser() {
  try {
    const me = await api('/auth/me');
    // `/me` serves the tenant's active plan row as `current_plan` (every column, including `price`);
    // it carries no plan id and no slug, so bind the plan from the field the endpoint really returns
    // instead of re-fetching a row that cannot be addressed (kanban t_c284c098).
    USER = { ...me, planObj: me.current_plan || null };
  } catch(e) { clearSession(); }
}

const IMP_ORIGINAL_KEY = 'ws_fs_original_token';

// ONE place that ends a session in this console. A session that leaves without the parked
// impersonation token is how the sign-in screen's banner button put the operator straight back in
// (kanban t_559c9a48), so EVERY path that drops the session — the Logout control, a request
// answered 401, and a failed /auth/me — drops both together.
function clearSession() {
  TOKEN = '';
  USER = null;
  try {
    localStorage.removeItem('ws_fs_token');
    localStorage.removeItem(IMP_ORIGINAL_KEY);
  } catch (e) {}
  const b = document.getElementById('imp-banner');
  if (b) b.remove();
}

// Logging out ends EVERY session this console holds. _impersonate() parks the operator's OWN token
// under `ws_fs_original_token` so their session can be restored, and the sign-in screen renders a
// banner button that does exactly that — so logging out WHILE impersonating used to leave the
// operator signed in one click away: measured in real Chromium on admin.funnelswift.net (kanban
// t_559c9a48), the logout landed on the sign-in screen, the banner was still there, its "Stop
// impersonating" button answered /api/v1/auth/me 200 role=admin, and the operator's live token was
// still in browser storage after signing out. No server call is owed: the impersonation session is
// a stateless JWT, so ending it IS discarding it (see admin_handler::stop_impersonation) — and that
// token is `ws_fs_token`, the active one this console already drops.
function doLogout() {
  clearSession();
  window.location.href = '/login';
}

// ── Init ──
(async function init() {
  if (TOKEN) await loadUser();
  renderApp();
  // kanban cron-1019: put the count of waiting plan asks on the sidebar label before the operator
  // has to think of opening the screen. Fire-and-forget: a failure here must not delay the console.
  refreshPlanRequestBadge();
  // Re-check while the console stays open (kanban cron-1020): a buying request that arrives between
  // page loads now shows up on its own, within one interval, instead of waiting for a reload.
  setInterval(() => { if (TOKEN) refreshPlanRequestBadge(); }, 45000);
  // A reload mid-impersonation must not silently swallow the banner: the operator needs to see
  // which account this session belongs to and the control that hands their own session back.
  if (localStorage.getItem(IMP_ORIGINAL_KEY)) {
    showImpBanner(USER && (USER.name || USER.company || USER.email));
  }
})();

function bindLogin() {
  const btn = document.getElementById('login-btn');
  const email = document.getElementById('login-email');

// dashboard paint never adds a second call to the same route.
// ── RECENT ACTIVITY: the DETAILS cell ───────────────────────────────────────────────────────────
// GET /api/v1/dashboard/activity returns `ActivityLog` rows: action, entity_type, entity_id,
// metadata, created_at. It has NEVER returned `details` or `description`, and this cell read exactly
// those two names, so every row on the operator's dashboard showed a bare '-' whatever had happened
// (measured 2026-10-22: five stage_change rows carrying {"new_stage":"Contacted"} rendered '-').
// Render the fields that exist: the entity plus the metadata's own pairs, which is the sentence the
// row was always meant to show. A row with no metadata still names its entity and short id, and only
// a row with nothing at all falls back to '-'.
function activityDetail(r){
  if(!r) return '-';
  const ent=String(r.entity_type||'').trim();
  const entLabel=ent?ent.charAt(0).toUpperCase()+ent.slice(1):'';
  const parts=[];
  const meta=r.metadata;
  if(meta&&typeof meta==='object'){
    Object.keys(meta).forEach(function(k){
      const v=meta[k];
      if(v===null||v===undefined||v==='') return;
      const val=(typeof v==='object')?JSON.stringify(v):String(v);
      parts.push(k.replace(/_/g,' ')+': '+val);
    });
  }else if(typeof meta==='string'&&meta.trim()){
    parts.push(meta.trim());
  }
  if(parts.length) return (entLabel?entLabel+' - ':'')+parts.join(', ');
  const id=String(r.entity_id||'').trim();
  if(entLabel) return entLabel+(id?' '+id.slice(0,8):'');
  return '-';
}

window._fsAvatarUpload = async function () {
  const f = document.getElementById('fsac-file');
  const file = f && f.files ? f.files[0] : null;
  if (!file) { fsMsg('fsac-avmsg', 'Choose an image first', false); return; }
  if (file.size > 2 * 1024 * 1024) { fsMsg('fsac-avmsg', 'That image is too large \u2014 2 MB maximum', false); return; }
  fsMsg('fsac-avmsg', 'Uploading\u2026', null);
  // Multipart, so NOT through api(): that helper pins Content-Type: application/json, which would
  // destroy the multipart boundary the browser generates for a FormData body.
  const fd = new FormData();
  fd.append('file', file, file.name || 'picture');
  try {
    const r = await fetch(API_BASE + '/auth/avatar', {
      method: 'POST',
      headers: TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {},
      body: fd
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || d.message || ('Error ' + r.status));
    if (d.avatar_url) USER.avatar_url = d.avatar_url;
    const im = document.getElementById('fsac-av'), ph = document.getElementById('fsac-avph');
    const del = document.getElementById('fsac-avdel');

    // Without this the operator had to leave the tab and come back before it appeared (measured in

    if (del) del.style.display = '';

    // Repaint the sidebar chip in place too — a full renderApp() here would rebuild the screen and
    // throw away the confirmation this very message is.
    const chip = document.querySelector('.nav-user .avatar');
    if (chip && USER.avatar_url) {
      chip.textContent = '';
      chip.style.backgroundImage = "url('" + USER.avatar_url + "')";

/* Change of the operator's OWN sign-in address (cron 2026-10-20). The route pair shipped in the app
   console with no operator surface: the address in the Profile card was read-only. This only ASKS -
   POST /auth/email-change writes one pending row and mails the NEW address, and users.email does not
   move until that link is opened. The two server answers are shown verbatim: a reserved test address
   answers delivered:false ("no mail was sent, nothing has changed") and a clash arrives as a 400
   carrying its own sentence, so a mistyped or taken address never looks like a successful save. */
window._fsEmailChangeSend = async function () {
  const el = document.getElementById('fsac-ec');
  const v = ((el && el.value) || '').trim();
  if (!v) { fsMsg('fsac-ecmsg', 'Enter the new email address first', false); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { fsMsg('fsac-ecmsg', 'That does not look like an email address', false); return; }
  const btn = document.getElementById('fsac-ec-btn');
  if (btn) btn.disabled = true;
  fsMsg('fsac-ecmsg', 'Sending\u2026', null);
  try {
    const r = await fetch(API_BASE + '/auth/email-change', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {}) },
      body: JSON.stringify({ new_email: v })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || d.message || ('Error ' + r.status));
    if (d && d.delivered === false) {
      fsMsg('fsac-ecmsg', d.message || 'That address cannot receive mail, so nothing was sent.', false);
    } else {
      if (el) el.value = '';
      fsMsg('fsac-ecmsg', 'Confirmation link sent to ' + v + '. Your sign-in address stays as it is until you open it.', true);
    }
  } catch (e) { fsMsg('fsac-ecmsg', (e && e.message) || 'Could not start the change', false); }
  if (btn) btn.disabled = false;
};

// ── Impersonation: the way in, and the way back out ──
// POST /api/v1/admin/impersonate swaps this console into a tenant's session; POST
// /api/v1/admin/stop-impersonation ends it server-side. The way IN shipped without the way OUT:
// no control called stop-impersonation, nothing on screen said whose session this was, and the
// operator's OWN token was overwritten with no copy kept — so an operator who impersonated from
// this console was stranded in the tenant's account. Both halves live here now: the original
// token is kept, a banner names the account, and Stop restores the operator's own session.

function showImpBanner(name) {
  let b = document.getElementById('imp-banner');
  if (!b) { b = document.createElement('div'); b.id = 'imp-banner'; document.body.appendChild(b); }
  b.setAttribute('style', 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#e11d48;' +
    'color:#fff;padding:8px 24px;font-size:13px;font-weight:600;display:flex;justify-content:center;' +
    'align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)');
  b.innerHTML = '<span>\u26A0\uFE0F Viewing as <span id="imp-name"></span> — you are impersonating this account</span>' +
    '<button id="imp-stop" style="background:#fff;color:#e11d48;border:none;border-radius:4px;' +
    'padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer">Stop impersonating</button>';
  document.getElementById('imp-name').textContent = name || 'this account';
  document.getElementById('imp-stop').onclick = stopImpersonation;
}

async function stopImpersonation() {
  // Tell the server first, so the session it minted is actually ended rather than merely dropped
  // by the browser. A failure here must not strand the operator in the tenant either.
  try { await api('/admin/stop-impersonation', { method: 'POST' }); } catch (e) { /* fall through */ }
  const orig = localStorage.getItem(IMP_ORIGINAL_KEY);
  localStorage.removeItem(IMP_ORIGINAL_KEY);
  if (orig) { TOKEN = orig; localStorage.setItem('ws_fs_token', orig); }
  window.location.reload();
}

window._impersonate = async function(tenantId) {
  try {
    // POST /api/v1/admin/impersonate (handlers::admin_handler::impersonate) — body {account_id:<tenant>}.
    // The served console used to call `GET /portfolio-companies/<id>/impersonate`, a route registered
    // NOWHERE (measured live 404), and a portfolio-company id is not a tenant. Impersonation targets a
    // TENANT, so the control lives on the Tenants list (renderTenants), not on Portfolio Companies.
    const res = await api('/admin/impersonate', { method: 'POST', body: JSON.stringify({ account_id: tenantId }) });
    const token = res.token || res.access_token;
    if (!token) { showToast('No impersonation token was returned', 'error'); return; }
    // Keep the operator's OWN session before it is replaced, so Stop puts them back exactly here.
    localStorage.setItem(IMP_ORIGINAL_KEY, TOKEN);
    TOKEN = token;
    localStorage.setItem('ws_fs_token', TOKEN);
    await loadUser();
    STATE.view = 'dashboard';
    showToast('Impersonating company...', 'info');
    renderApp();
    showImpBanner(USER && (USER.name || USER.company || USER.email));
  } catch(e) { showToast(e.message, 'error'); }
};

// ── UPGRADE (2026-10-19) ────────────────────────────────────────────────────────────────────────
// The Plans screen shipped a "Compare Plans & Upgrade" button whose only action was
// `_navTo('plans')` — the view it was already on. A free-plan customer had NO way to start an
// upgrade from this console: the click did nothing and no request was made. Every paid, non-current
// plan now carries an Upgrade button that POSTs /api/v1/checkout/create (the same route the tenant
// app's Upgrade tab uses), follows the provider's URL on success, and — when the install has no
// payment provider configured yet — says so plainly instead of failing silently.
function planIsCurrent(p) {
  const cp = (USER && (USER.current_plan || USER.planObj)) || null;
  if (!cp) return false;
  if (cp.slug) return String(cp.slug) === String(p.slug);
  if (cp.name) return String(cp.name) === String(p.name);
  return false;
}

window._startUpgrade = async function (slug) {
  if (!slug) return;
  try {
    const r = await api('/checkout/create', { method: 'POST', body: JSON.stringify({ plan_slug: slug }) });
    const url = r && (r.url || r.checkout_url || (r.session && r.session.url));
    if (url) { window.location.href = url; return; }
    showToast('Checkout was created but no payment link came back — nothing was charged. Please contact support.', 'error', false);
  } catch (e) {
    const msg = String((e && e.message) || '');
    if (msg === '402') return;                 // api() already toasted the plan limit
    if (/payment_provider|not[_ ]configured/i.test(msg)) {
      showToast('Upgrades are not open on this workspace yet — nothing was charged. Contact support and we will set the plan up for you.', 'info', false);
    } else {
      showToast('Could not start checkout: ' + msg + ' — nothing was charged.', 'error', false);
    }
  }
};

// ── LEADS ──
// ── LEAD PIPELINE ──
// The pipeline has lived in the database since the app shipped: `leads.stage` (VARCHAR(100),
// DEFAULT 'New'), the dashboard's `leads_by_stage`, and the conversion rate that counts
// stage='Closed Won'. Three writable routes have existed just as long — POST /leads/:id/stage,
// PUT /leads/:id/status and POST /leads/:id/tags — and NOTHING in either console ever called the
// stage or tag writer, so a lead could be created and then never advanced: the operator saw a
// tag column it could not fill and a pipeline its own guide told it to filter by. These are the
// missing callers. The vocabulary is the tenant's `lead_stages` setting (title-case, edited on the
// customer's Lead Stages screen) with the same default the backend seeds.
const DEFAULT_LEAD_STAGES = ['New', 'Contacted', 'Qualified', 'Proposal', 'Negotiation', 'Closed Won', 'Closed Lost'];
let LEAD_STAGES = DEFAULT_LEAD_STAGES.slice();
// The people in this workspace, for the lead owner picker (cron 2026-10-21). `null` means "not
// loaded yet", which is different from "loaded and there is nobody else here": the picker says so
// instead of showing an empty list that looks broken.
let LEAD_TEAM = null;
async function loadLeadTeam() {
  try {
    const r = await api('/team/members');
    const rows = Array.isArray(r) ? r : ((r && r.members) || []);
    LEAD_TEAM = Array.isArray(rows) ? rows : [];
  } catch (e) { LEAD_TEAM = []; }
  return LEAD_TEAM;
}
// One row's owner control. The current owner is written into the option list even when it is not
// in LEAD_TEAM (a person removed from the workspace still owns their leads), so the row shows the
// truth instead of silently reading "Unassigned".
function leadOwnerCell(l) {
  const cur = String(l.assigned_to || '');
  const people = (LEAD_TEAM || []).slice();
  if (cur && !people.some(p => String(p.id) === cur)) people.push({ id: cur, name: 'Former teammate' });
  const opts = [`<option value=""${cur === '' ? ' selected' : ''}>Unassigned</option>`].concat(
    people.map(p => `<option value="${x(p.id)}"${String(p.id) === cur ? ' selected' : ''}>${x(p.name || p.email || 'Teammate')}</option>`));
  const title = LEAD_TEAM === null ? 'Loading the people in this workspace…'
    : (people.length ? 'Give this lead to a teammate' : 'Nobody else is in this workspace yet — add a teammate first');
  return `<select class="input lead-owner-sel" data-lead="${x(l.id)}" data-current="${x(cur)}"
            style="padding:4px 6px;font-size:12px;min-width:130px" title="${x(title)}">${opts.join('')}</select>`;
}
async function loadLeadStages() {
  try {
    const st = await api('/settings');
    const rows = Array.isArray(st) ? st : (st.data || []);
    rows.forEach(s => {
      if (s.key === 'lead_stages' && Array.isArray(s.value) && s.value.length) LEAD_STAGES = s.value.map(String);
    });
  } catch (e) { /* keep the default vocabulary */ }
  return LEAD_STAGES;
}
// A row's own value is appended when it is not in the vocabulary, so a stage renamed after the
// lead was written still shows what the lead actually says instead of silently reading "New".
function leadStageOptions(current) {
  const list = LEAD_STAGES.slice();
  const cur = String(current || 'New');
  if (!list.includes(cur)) list.push(cur);
  return list.map(s => `<option value="${x(s)}"${s === cur ? ' selected' : ''}>${x(s)}</option>`).join('');
}
function leadStageCell(l) {
  const cur = String(l.stage || 'New');
  return `<select class="input lead-stage-sel" data-lead="${x(l.id)}" data-current="${x(cur)}"
            style="padding:4px 6px;font-size:12px;min-width:120px" title="Move this lead to another stage">${leadStageOptions(cur)}</select>`;
}

async function renderLeads() {
  // PAGED, SERVER-SEARCHED (2026-10-18). GET /leads has always answered {data,total,page,per_page}, but
  // this screen called it with no parameters and kept `data` only — so a workspace with more than 20
  // leads showed the newest 20 and nothing else, and the search box filtered just those 20. After a CSV
  // import that was the difference between "my file worked" and "where did my file go". The page and
  // the term now go to the server, and the footer says which slice is on screen.
  const per = 50;
  const page = Math.max(1, STATE.leadsPage || 1);
  const term = (STATE.leadsSearch || '').trim();
  let payload = { data: [], total: 0 };
  try {
    payload = await api('/leads?per_page=' + per + '&page=' + page +
      (term ? '&search=' + encodeURIComponent(term) : ''));
  } catch (e) { payload = { data: [], total: 0 }; }
  let leads = Array.isArray(payload) ? payload : (payload.data || payload.leads || []);
  const total = Array.isArray(payload) ? leads.length : (payload.total || leads.length);
  const from = total === 0 ? 0 : (page - 1) * per + 1;
  const to = Math.min(page * per, total);
  await loadLeadStages();
  await loadLeadTeam();

  return `<div>
    <div class="card-header" style="padding:0;margin-bottom:20px">

        <tbody id="leads-tbody">${leads.map(l=>`<tr>
          <td><strong>${x(l.name||l.full_name||'-')}</strong></td>
          <td>${x(l.email||'-')}</td>
          <td><span class="badge badge-blue">${x(l.source||'direct')}</span></td>
          <td>${leadStageCell(l)}</td>
          <td>${leadOwnerCell(l)}</td>
          <td>${(l.tags||[]).map(t=>`<span class="badge badge-green">${x(t.name||t)}</span>`).join(' ')}</td>
          <td>${formatDate(l.created_at)}</td>
          <td><button class="btn btn-secondary btn-xs" onclick="window._editLead('${l.id}')">Edit</button></td>
        </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--muted)">${term ? 'No lead matches that search.' : 'No leads yet — add one, or import a CSV.'}</td></tr>`}</tbody>
      </table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 4px">
        <span style="font-size:13px;color:var(--muted)">Showing ${from}–${to} of ${total}${term ? ' matching "' + x(term) + '"' : ''}</span>
        <div class="btn-group">
          <button class="btn btn-secondary btn-sm" id="leads-prev" ${page <= 1 ? 'disabled' : ''}>← Previous</button>
          <button class="btn btn-secondary btn-sm" id="leads-next" ${to >= total ? 'disabled' : ''}>Next →</button>
        </div>
      </div>
    </div>
  </div>`;
}
function bindLeads() {
  // The stage writer. One listener on the container, so a re-render never leaves a
  // dead control behind; a refusal restores the select to the value the row still has.
  document.querySelectorAll('.lead-stage-sel').forEach(sel => sel.addEventListener('change', async () => {
    const id = sel.getAttribute('data-lead');
    const prev = sel.getAttribute('data-current') || '';
    const stage = sel.value;
    if (!id || stage === prev) return;
    sel.disabled = true;
    try {
      await api('/leads/' + id + '/stage', { method: 'POST', body: JSON.stringify({ stage }) });
      sel.setAttribute('data-current', stage);
      showToast('Moved to ' + stage, 'success');
    } catch (e) {
      sel.value = prev;
      showToast((e && e.message) || 'Could not change the stage', 'error');
    } finally { sel.disabled = false; }
  }));
  document.getElementById('add-lead-btn')?.addEventListener('click', () => openLeadModal());
  // The OWNER writer (cron 2026-10-21). `POST /leads/:id/assign` has been in the router since the
  // leads table did and nothing in this console ever called it, so a lead could not be given to a
  // teammate from the UI at all. Same shape as the stage picker beside it: one listener, the refusal
  // restores the previous value, and a blank option means "put it back in the shared pool".
  document.querySelectorAll('.lead-owner-sel').forEach(sel => sel.addEventListener('change', async () => {
    const id = sel.getAttribute('data-lead');
    const prev = sel.getAttribute('data-current') || '';
    const owner = sel.value || '';
    if (!id || owner === prev) return;
    sel.disabled = true;
    try {
      await api('/leads/' + id + '/assign', { method: 'POST', body: JSON.stringify({ assigned_to: owner || null }) });
      sel.setAttribute('data-current', owner);
      const who = owner ? (sel.options[sel.selectedIndex] || {}).text : '';
      showToast(owner ? ('Lead assigned to ' + who) : 'Lead put back in the shared pool', 'success');
    } catch (e) {
      sel.value = prev;
      showToast((e && e.message) || 'Could not change the owner', 'error');
    } finally { sel.disabled = false; }
  }));
  // The server has had GET /leads/export since it shipped, but nothing in this console ever
  // called it — so an operator with a few hundred leads had no way to get them out, and the
  // route answered JSON even when `format=csv` was asked for. This button is the missing caller:
  // it asks for the CSV form and saves the response as a file, and it shows the PLAN REFUSAL when
  // the workspace's tier has no import/export rather than a silent no-op.
  // CSV IMPORT — the other half of the plan's `import_export` entitlement. The server has had
  // GET /leads/export for months; nothing accepted a FILE until now, so a customer who bought the
  // plan for "import/export" could only get data out. The file is read here and posted as text, so
  // the browser does the file handling and the server keeps one validation path (the same
  // name/email/storable checks the Add-lead form goes through), one plan gate, and ONE transaction:
  // either the whole file lands or none of it does.
  document.getElementById('import-leads-btn')?.addEventListener('click', () => {
    document.getElementById('import-leads-file')?.click();
  });
  document.getElementById('import-leads-file')?.addEventListener('change', async function () {
    const file = this.files && this.files[0];
    if (!file) return;
    const btn = document.getElementById('import-leads-btn');
    const label = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Importing…'; }
    try {
      const text = await file.text();
      const headers = { 'Content-Type': 'application/json' };
      if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
      const r = await fetch(API_BASE + '/leads/import', {
        method: 'POST', headers: headers, body: JSON.stringify({ csv: text })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        showToast((d && (d.error || d.message)) || ('Import failed (' + r.status + ')'), 'error');
        return;
      }
      const first = (d.errors && d.errors[0]);
      showToast((d.message || 'Leads imported') +

    const currentTagNames = (lead.tags || []).map(t => String(t && t.name ? t.name : t));

      const box = document.getElementById('lead-tag-picker');

      let tags = [];

      if (!Array.isArray(tags)) tags = tags.data || tags.tags || [];
      box.innerHTML = tags.length ? tags.map(t => {
        const name = String(t.name || t);
        const on = currentTagNames.includes(name) ? ' checked' : '';

    })();
    document.getElementById('lead-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = Object.fromEntries(fd);
      const pickedStage = data.stage || '';
      const pickedTags = Array.from(document.querySelectorAll('.lead-tag-chk:checked')).map(c => c.value);
      delete data.stage;
      try {
        let leadId = id;
        if (id) await api('/leads/'+id, { method: 'PUT', body: JSON.stringify(data) });
        else {
          const made = await api('/leads', { method: 'POST', body: JSON.stringify(data) });
          leadId = (made && (made.id || (made.data && made.data.id))) || null;
        }
        // The two writers the modal never had. One refusal must not lose the other's work,
        // so each is reported on its own and the lead itself is already saved above.
        if (leadId && pickedStage && pickedStage !== String(lead.stage || 'New')) {
          try { await api('/leads/' + leadId + '/stage', { method: 'POST', body: JSON.stringify({ stage: pickedStage }) }); }
          catch (e) { showToast('Saved, but the stage was refused: ' + ((e && e.message) || 'error'), 'error'); }
        }
        if (leadId) {
          const add = pickedTags.filter(n => !currentTagNames.includes(n));
          const remove = currentTagNames.filter(n => !pickedTags.includes(n));
          if (add.length || remove.length) {
            try { await api('/leads/' + leadId + '/tags', { method: 'POST', body: JSON.stringify({ tags: add, remove }) }); }
            catch (e) { showToast('Saved, but the tags were refused: ' + ((e && e.message) || 'error'), 'error'); }
          }
        }
        showToast(id?'Lead updated':'Lead created', 'success');
        STATE.modal = null; renderApp();
      } catch(e) { showToast(e.message, 'error'); }
    });
  }, 100);
}

    const isAdmin = isSuperAdmin();
    /* kanban t_5c2a9bde: a plan-derived product (`plan_stated`, i.e. plan_id IS NOT NULL) has no rate
       of its own — its rate IS its plan's (kanban t_92bd5eb6, migration 076), and the API now refuses a
       change with a 409 naming the plan. So the field is rendered read-only with the plan to edit, and
       the form does not send the key at all: a save can then never race the plan's own rate. */
    const rateLocked = !!p.plan_stated;
    body.innerHTML = `<form id="product-form">
      <div class="form-row"><div class="form-group"><label class="form-label">Name</label><input class="input" name="name" value="${x(p.name||p.product_name||'')}" ${isAdmin?'':'readonly'}></div><div class="form-group"><label class="form-label">URL</label><input class="input" name="url" value="${x(p.url||'')}" ${isAdmin?'':'readonly'}></div></div>
      <div class="form-row"><div class="form-group"><label class="form-label">Commission Rate (%)</label><input class="input" name="default_commission_rate" type="number" step="0.1" value="${p.default_commission_rate||p.commission_rate||''}" ${isAdmin && !rateLocked?'':'readonly'}>${rateLocked?`<div style="font-size:11px;color:var(--muted);margin-top:4px">Comes from its plan ${x(p.plan_name||p.plan_slug||'')} — edit the plan to change it.</div>`:''}</div><div class="form-group"><label class="form-label">Third Party</label><select class="input" name="is_third_party" ${isAdmin?'':'disabled'}><option value="false" ${!p.is_third_party?'selected':''}>No</option><option value="true" ${p.is_third_party?'selected':''}>Yes</option></select></div></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="input" name="description" rows="2" ${isAdmin?'':'readonly'}>${x(p.description||'')}</textarea></div>
      <!-- kanban t_2b82d8f0: the System Tag link (affiliate attribution). A product with no tag can be
           promoted but never attributed: tag_logic::attribute_affiliate_on_tags (src/tag_logic.rs:319)
           resolves every active product whose system_tag_id equals the tag the lead received. Options are
           loaded below from GET /api/v1/admin/system-tags — the route that had no caller in any shipped
           surface. "(No system tag)" clears the link; the API needs the explicit additive
           clear_system_tag flag for that, because a bare null KEEPS the stored tag (a backtick in
           this comment would terminate the template literal that builds this form). -->
      <div class="form-group"><label class="form-label">System Tag</label><select class="input" name="system_tag_id" id="product-system-tag" ${isAdmin?'':'disabled'}><option value="">(No system tag)</option>${p.system_tag_id?`<option value="${x(p.system_tag_id)}" selected>${x(p.system_tag_name||'Current system tag')}</option>`:''}</select><div style="font-size:11px;color:var(--muted);margin-top:4px">Attributes this product to the affiliate who brought a lead carrying the tag.</div></div>
      ${isAdmin?`<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0 0"><span class="toggle ${p.is_active!==false?'on':''}" id="product-active-toggle"></span> Active<div style="font-size:11px;color:var(--muted)">A retired product is not promoted and attributes no commission. One system tag routes one active product, so activating this one may be refused while another holds its tag.</div></label>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${id?'Update':'Create'} Product</button>
      </div>`:''}
    </form>`;
    if (isAdmin) {
      /* The picker is FILLED by the route that had no caller (kanban t_2b82d8f0). */
      api('/admin/system-tags').then((list) => {
        const sel = document.getElementById('product-system-tag');
        if (!sel) return;
        const arr = Array.isArray(list) ? list : ((list && list.data) || []);
        arr.forEach((t) => {
          if (String(t.id) === String(p.system_tag_id || '')) return;   /* already offered, with its own name */
          const o = document.createElement('option');
          o.value = t.id; o.textContent = t.name || '';
          sel.appendChild(o);
        });
      }).catch(() => {});
      const tagSel = document.getElementById('product-system-tag');
      if (tagSel) tagSel.value = p.system_tag_id || '';
      /* kanban t_24941022: the lifecycle toggle, in the same shape as #webhook-active-toggle. */
      document.getElementById('product-active-toggle')?.addEventListener('click', function(){this.classList.toggle('on');});
      document.getElementById('product-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd);
        /* kanban t_2b82d8f0: a BLANK number input arrives as '' and serde refuses it
           ("invalid type: string \"\", expected f64" -> 422), so the key is dropped instead: absent means
           "keep" on PUT and 0.0 on POST (the handler's own unwrap_or). Measured on the deployed binary. */
        if (data.default_commission_rate === '') delete data.default_commission_rate;
        else data.default_commission_rate = parseFloat(data.default_commission_rate);
        /* kanban t_5c2a9bde: a plan-derived product's rate comes from its plan, so the form never sends
           the key at all — the API would refuse a different value with a 409 naming the plan, and the
           handler writes the plan's own rate back for a product whose plan owns the column. */
        if (rateLocked) delete data.default_commission_rate;
        data.is_third_party = data.is_third_party === 'true';
        /* `system_tag_id` goes out as JSON null, never "" (axum answers a bare 422 "UUID parsing failed");
           null alone KEEPS a stored tag (measured), so un-assigning one sends the additive
           `clear_system_tag` flag — kanban t_2b82d8f0. */
        const tagVal = data.system_tag_id || '';
        data.system_tag_id = tagVal || null;
        if (id && !tagVal && p.system_tag_id) data.clear_system_tag = true;
        /* kanban t_24941022: the product's lifecycle flag. THE PAYLOAD HALF -- the control alone
           would save a body with no `is_active` key, and `update_affiliate_product` keeps the
           stored value when the key is absent, so the switch would look wired and move nothing.
           Sent as a real boolean, so a no-touch save re-sends the value the toggle was prefilled
           with (the stored flag) and cannot re-tick a retired product. Activating one whose tag is
           already routed answers the API's named 409; `api()` throws `e.error` and the catch below
           shows it as a toast. */
        data.is_active = document.getElementById('product-active-toggle').classList.contains('on');
        try {
          if (id) await api('/affiliate-products/'+id, { method: 'PUT', body: JSON.stringify(data) });
          else await api('/affiliate-products', { method: 'POST', body: JSON.stringify(data) });
          showToast(id?'Product updated':'Product created', 'success');
          STATE.modal = null; renderApp();
        } catch(e) { showToast(e.message, 'error'); }
      });
    }
  }, 100);
}

function bindCommissionGroups() {
  document.getElementById('group-form')?.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const ids = fd.getAll('product_ids').map(String).filter(Boolean);
    const rateRaw = fd.get('commission_rate');
    const payload = { name: (fd.get('name') || '').toString().trim() };
    if (rateRaw !== null && rateRaw !== '') payload.commission_rate = Number(rateRaw);
    if (ids.length) payload.product_ids = ids;
    if (!payload.name) { showToast('A group needs a name', 'error'); return; }
    try {
      const r = await api('/affiliate-product-groups', { method: 'POST', body: JSON.stringify(payload) });
      /* The SERVER's own counts, not the tick count (kanban t_e8a297fb). A group is scoped to this
         workspace plus the shared catalogue, so an id the call could not reach comes back as
         `products_skipped` — the toast must never claim more landed than actually did, the same rule
         the bulk rate toast below follows (kanban t_5c2a9bde). */
      const done = (r && typeof r.products_assigned === 'number') ? r.products_assigned : 0;
      const skipped = (r && r.products_skipped) || 0;
      showToast('Group created' + (done ? ' with ' + done + ' product(s)' : '')
        + (skipped ? ' — ' + skipped + ' product(s) not reachable from this workspace' : ''),
        (skipped && !done) ? 'error' : 'success');
      renderView();
    } catch(e) { showToast(e.message, 'error'); }
  });
  document.getElementById('bulk-rate-form')?.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const ids = fd.getAll('product_ids').map(String).filter(Boolean);
    const rate = Number(fd.get('commission_rate'));
    if (!ids.length) { showToast('Tick at least one product', 'error'); return; }
    if (!Number.isFinite(rate)) { showToast('Enter a rate', 'error'); return; }
    try {
      const r = await api('/affiliate-product-rates/bulk', { method: 'POST', body: JSON.stringify({ product_ids: ids, commission_rate: rate }) });
      /* The server's own count, not the tick count: it reports what it actually wrote (`products_updated`)
         and the ids it could not reach (`products_skipped`), so a toast can never claim more than landed
         (kanban t_5c2a9bde). */
      const done = (r && typeof r.products_updated === 'number') ? r.products_updated : ids.length;
      const skipped = (r && r.products_skipped) || 0;
      showToast('Rate set on ' + done + ' product(s)' + (skipped ? ' — ' + skipped + ' not reachable' : ''), (skipped && !done) ? 'error' : 'success');
      renderView();
    } catch(e) { showToast(e.message, 'error'); }
  });
}
window._deleteCommissionGroup = async function(id) {
  if (!confirm('Delete this group? Products in it keep their own rates — deleting a group never deletes products.')) return;
  try { await api('/affiliate-product-groups/' + encodeURIComponent(id), { method: 'DELETE' }); showToast('Group deleted', 'success'); renderView(); }
  catch(e) { showToast(e.message, 'error'); }
};

/* kanban t_4b7991fd: `PUT /:id` (re-rate/rename) and `POST /:id/products` (replace membership) were
   API-only — the module doc claimed every route here had a control, and these two did not. Both are
   wired below in the shape t_619533e2/t_dc79fb2a used for tab audience: a control on the view that
   calls the route, and a toast driven by the SERVER's own numbers, never the tick count (t_e8a297fb).
   WIRED, not retired, because delete+recreate is not an equivalent operator path: a group DELETE nulls
   every member's `group_id` (products fall back to their own rate until re-ticked) and re-creating a
   group owned by the shared SYSTEM catalogue would re-own it to this workspace. "Edit rate" changes
   the rate in place; "Members" replaces the membership and reports what really landed. */

         sent as typed so emptying the box is the one way to clear it. */
      const payload = { name, description: (fd.get('description') || '').toString() };

window._membersCommissionGroup = function(id) {
  const g = EDIT_ROWS.commissionGroups[String(id)] || {};
  STATE.modal = { title: 'Members of ' + (g.name || 'this group') };
  STATE.modalData = { id };
  renderApp();
  setTimeout(async () => {
    /* Fresh reads, not the last table render: membership is pre-ticked from `product_ids` the SERVER
       reports for this group, so the editor can never show a tick state the database does not have. */
    let products = [], groups = [];
    try { products = await api('/affiliate-products'); } catch(e) { products = []; }
    try { groups = await api('/affiliate-product-groups'); } catch(e) { groups = []; }
    if (!Array.isArray(products)) products = products.data || products.products || [];
    if (!Array.isArray(groups)) groups = groups.data || groups.groups || [];
    const fresh = groups.find(gg => String(gg.id) === String(id));
    const current = new Set(((fresh && fresh.product_ids) || g.product_ids || []).map(String));
    /* The same list the create form offers: a plan product has no rate of its own, so a group rate
       would outrank its plan — both group routes answer that 409. */
    const ratable = products.filter(p => !p.plan_stated);
    /* kanban t_b2a9059b: re-read the host AFTER the reads. renderApp() rebuilds #modal-body, so a
       reference captured before these `await`s points at a DETACHED node the moment the shell
       re-renders (a nav click while the modal is still loading is enough). The markup then lands
       where nobody can see it and the getElementById below returns null, so the bind throws and
       Save Membership stays dead. Capturing here keeps capture -> inject -> bind in one block. */
    const body = document.getElementById('modal-body');
    if (!body) return;
    body.innerHTML = `<form id="group-members-form">
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Tick every product this group should
      cover. Saving <strong>replaces</strong> the membership: an unticked product leaves the group and
      falls back to its own rate; tick nothing to empty the group. A product not listed here (a plan
      product, or another workspace's) is never reachable from this workspace and is left exactly as it is.</p>
      ${ratable.length === 0 ? '<p style="color:var(--muted);font-size:12px">No products with a rate of their own yet.</p>' : `
      <div style="max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:6px;padding:8px">
        ${ratable.map(p => `<label style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px">
          <input type="checkbox" name="product_ids" value="${x(p.id)}" ${current.has(String(p.id)) ? 'checked' : ''}> ${x(p.name || p.product_name || '-')}
          <span style="color:var(--muted)">— now ${p.default_commission_rate != null ? p.default_commission_rate : (p.commission_rate != null ? p.commission_rate : 0)}%</span></label>`).join('')}
      </div>`}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Membership</button>
      </div>
    </form>`;
    const form = document.getElementById('group-members-form');
    if (form) form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const ids = new FormData(ev.target).getAll('product_ids').map(String).filter(Boolean);
      const ticked = new Set(ids);
      try {
        const r = await api('/affiliate-product-groups/' + encodeURIComponent(id) + '/products', { method: 'POST', body: JSON.stringify({ product_ids: ids }) });
        /* The SERVER's own counts, never the tick count (kanban t_e8a297fb): `products_in_group` is what
           really landed and `products_skipped` is a ticked id this workspace cannot reach, so the toast
           never claims more than the database holds. "N left" is the members the SERVER itself showed
           (`current`, from this group's `product_ids`) that the operator did not tick — deliberately NOT
           `previously_removed`: the replace CLEARS every link and then re-sets the ticked ones, so that
           number counts a re-ticked member as removed and would report more leaving than really did
           (measured: 1 product unticked reported "2 removed" — kanban t_4b7991fd). */
        const landed = (r && typeof r.products_in_group === 'number') ? r.products_in_group : 0;
        const left = Array.from(current).filter((cid) => !ticked.has(String(cid))).length;
        const skipped = (r && r.products_skipped) || 0;
        showToast('Membership replaced — ' + landed + ' product(s) in the group'
          + (left ? ', ' + left + ' left' : '')
          + (skipped ? ' — ' + skipped + ' not reachable from this workspace' : ''),
          (skipped && !landed) ? 'error' : 'success');
        window._closeModal(); renderView();
      } catch(e) { showToast(e.message, 'error'); }
    });
  }, 0);
};

// ── EMAIL PROVIDER (system email — DB-stored, provider is an admin choice) ──
async function bindEmailProvider() {
  const sel = document.getElementById('ep-provider');
  if (!sel) return;
  try {
    const d = await api('/admin/email-config');
    const cfg = d.config || {};
    (d.providers || []).forEach(p => { const o = document.createElement('option'); o.value = p.value; o.textContent = p.label; sel.appendChild(o); });
    sel.value = d.provider || cfg.provider || 'smtp';
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = (v === undefined || v === null) ? '' : v; };
    set('ep-from-name', cfg.from_name); set('ep-from-address', cfg.from_address);
    set('ep-domain', cfg.domain); set('ep-api-url', cfg.api_url); set('ep-api-key', cfg.api_key);
    set('ep-smtp-host', cfg.smtp_host); set('ep-smtp-port', cfg.smtp_port);
    set('ep-smtp-username', cfg.smtp_username); set('ep-smtp-password', cfg.smtp_password);
    set('ep-smtp-encryption', cfg.smtp_encryption || '');
    const badge = document.getElementById('ep-status-badge');
    if (badge) {
      badge.textContent = d.configured ? ('configured · ' + (d.provider || '')) : 'not configured';
      badge.className = 'badge ' + (d.configured ? 'badge-green' : 'badge-yellow');
    }
    /* The at-rest posture of the SAVED credential (the rule CoreSwift's panel set, kanban
       t_d1fcda7e). "configured" says the send path has a key; this says whether the DATABASE holds
       it encrypted. A row that arrived from a restored dump, a manual write or a rotation tool
       reads "stored in the clear" until the app's next start seals it, so the panel states the
       measured fact instead of implying that "saved" means "encrypted". */
    const at = document.getElementById('ep-atrest-badge');
    if (at) {
      if (!d.credential_present) { at.style.display = 'none'; at.textContent = ''; }
      else {
        at.style.display = '';
        at.textContent = d.sealed ? '🔒 credential encrypted at rest' : '⚠ credential stored in the clear';
        at.className = 'badge ' + (d.sealed ? 'badge-green' : 'badge-red');
        at.title = d.sealed
          ? 'A copy of the database cannot yield the saved key.'
          : 'The saved key is readable in the database as it stands — restart the app (or save the key again) and it is encrypted at rest.';
      }
    }
    /* The LAST transactional send this installation attempted (the send funnel records it under
       admin_settings.email_last_send). "configured" only says the provider is set up; it says nothing
       about whether the credentials mail of the last real signup actually left. A REFUSAL is shown in
       red with the provider's own reason, so an operator sees that a customer got no password. */
    const ls = document.getElementById('ep-last-send');
    if (ls) {
      const last = d.last_send || null;
      if (!last || typeof last !== 'object') {
        ls.innerHTML = '<span style="color:#64748b">No transactional email attempted yet on this installation.</span>';
      } else {
        const when = last.at ? new Date(last.at).toLocaleString() : 'time not recorded';
        const withheld = /withheld/i.test(String(last.detail || ''));
        ls.innerHTML = (last.ok
          ? '<span style="color:#15803d">✅ Last email accepted by the provider</span>'
          : withheld
          ? '<span style="color:#b45309">⛔ Last email was NOT SENT — the recipient is a reserved/test address, so no customer mail was affected</span>'
          : '<span style="color:#b91c1c">❌ Last email was REFUSED — the customer received nothing</span>')
          + ' <span style="color:#64748b">· ' + x(when) + ' · &quot;' + x(last.subject || '') + '&quot; to ' + x(last.to || '') + '</span>'
          + (last.ok ? '' : '<div style="color:#b91c1c;margin-top:4px">' + x(String(last.detail || 'no reason recorded')) + '</div>');
      }
    }
    /* The HISTORY beside the one-slot "last email" line (GET /admin/email-log, migration 109):
       the slot is overwritten by every later message, so a credentials mail the provider refused at
       signup vanished from the panel as soon as any other mail succeeded. This is the list an
       operator reads to answer "did that customer ever get their password?". */
    const hist = document.getElementById('ep-history');
    if (hist) {
      try {
        const h = await api('/admin/email-log');
        const rows = (h && h.sends) || [];
        /* THE WINDOW, NOT JUST THE TAIL (2026-10-21). The table below lists the last sends, so a
           refusal older than that list has scrolled away — which is exactly the case an operator
           worries about ("did that customer ever get their password?"). The API counts the last
           7 days by outcome, and this line states the verdict in one sentence before the detail. */
        const sm = (h && h.summary) || null;
        const sumLine = !sm ? '' : '<div style="font-size:12px;margin-bottom:8px;padding:8px 10px;border-radius:6px;background:'
          + ((sm.refused > 0) ? '#fef2f2' : '#f0fdf4') + ';color:' + ((sm.refused > 0) ? '#b91c1c' : '#15803d') + '">'
          + ((sm.refused > 0)
              ? '\u274c ' + sm.refused + ' email' + (sm.refused === 1 ? ' was' : 's were') + ' REFUSED in the last '
                + sm.window_days + ' days \u2014 those customers received nothing.'
              : '\u2705 No email was refused in the last ' + sm.window_days + ' days.')
          + ' <span style="color:#475569">\u00b7 ' + sm.sent + ' sent \u00b7 ' + sm.withheld
          + ' not sent (reserved/test addresses)</span>'
          + (sm.last_refused ? '<div style="margin-top:4px">Last refusal: ' + x(sm.last_refused.to || '')
              + ' \u2014 ' + x(String(sm.last_refused.detail || '')) + '</div>' : '')
          + '</div>';
        if (!rows.length) {
          hist.innerHTML = sumLine + '<div style="color:#64748b;font-size:12px">No email attempts recorded yet.</div>';
        } else {
          const colour = st => st === 'sent' ? '#15803d' : st === 'withheld' ? '#b45309' : '#b91c1c';
          const word = st => st === 'sent' ? 'sent' : st === 'withheld' ? 'not sent (reserved address)' : 'REFUSED';
          hist.innerHTML = sumLine + '<div style="font-weight:600;font-size:12px;margin-bottom:6px">Recent sends (last ' + rows.length + ')</div>'
            + '<table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr style="text-align:left;color:#64748b">'
            + '<th style="padding:2px 6px">When</th><th style="padding:2px 6px">To</th><th style="padding:2px 6px">Subject</th>'
            + '<th style="padding:2px 6px">Result</th><th style="padding:2px 6px">Reason</th></tr></thead><tbody>'
            + rows.map(r => '<tr style="border-top:1px solid #e2e8f0">'
              + '<td style="padding:2px 6px;color:#64748b">' + x(r.at ? new Date(r.at).toLocaleString() : '') + '</td>'
              + '<td style="padding:2px 6px">' + x(r.to || '') + '</td>'
              + '<td style="padding:2px 6px">' + x(r.subject || '') + '</td>'
              + '<td style="padding:2px 6px;color:' + colour(r.status) + '">' + x(word(r.status)) + '</td>'
              + '<td style="padding:2px 6px;color:#b91c1c">' + x(r.detail || '') + '</td></tr>').join('')
            + '</tbody></table>';
        }
      } catch (e) { hist.innerHTML = '<div style="color:#b91c1c;font-size:12px">Could not load the send history: ' + x(e.message) + '</div>'; }
    }
  } catch (e) {
    showToast('Could not load email provider: ' + e.message, 'error');
  }

  document.getElementById('ep-test')?.addEventListener('click', testEmailProvider);
