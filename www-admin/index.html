<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FunnelSwift — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="alternate icon" href="/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--primary:#6366f1;--primary-dark:#4f46e5;--bg:#f1f5f9;--surface:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#10b981;--warning:#f59e0b}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);margin:0;color:var(--text)}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);min-height:100vh;padding:12px;display:flex;flex-direction:column;flex-shrink:0;position:fixed;left:0;top:0;bottom:0;z-index:100;overflow-y:auto}
.main{margin-left:240px;padding:24px;min-height:100vh}
.logo-area{display:flex;align-items:center;gap:8px;padding:12px 8px 16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-area .icon{font-size:24px}
.logo-area .title{font-weight:700;font-size:16px;color:var(--text)}
.nav-section{margin-bottom:4px}
.nav-section-header{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:#f1f5f9;color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge{font-size:10px;padding:1px 6px;border-radius:10px;background:#e2e8f0;color:var(--muted);margin-left:auto}
.nav-item.active .badge{background:rgba(255,255,255,.25);color:#fff}
.nav-divider{height:1px;background:var(--border);margin:8px 0}
.nav-footer{padding:8px;border-top:1px solid var(--border);margin-top:auto}
.nav-user{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted)}
.nav-user:hover{background:#f1f5f9}
.nav-user .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.nav-user .logout{color:var(--danger);font-size:11px;margin-left:auto;cursor:pointer}
.nav-guide{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.nav-guide:hover{background:#f1f5f9;color:var(--text)}
/* Cards & Tables */
.card{background:var(--surface);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600}
.card-subtitle{font-size:13px;color:var(--muted)}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
.table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f1f5f9}
.table tr:hover td{background:#f8fafc}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#f1f5f9;color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:2px 8px;font-size:11px;border-radius:6px}
.btn-icon{padding:6px;border-radius:8px;background:0 0;border:none;cursor:pointer;font-size:16px}
.btn-icon:hover{background:#f1f5f9}
.btn-group{display:flex;gap:6px}
/* Inputs */
.input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:100%;outline:0;background:var(--surface);box-sizing:border-box}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.select{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;outline:0;background:var(--surface)}
.search-bar{position:relative}
.search-bar .input{padding-left:32px}
.search-bar .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;animation:slideUp .2s}
.modal-lg{max-width:700px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:600}
.modal-close{background:0 0;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{margin-bottom:20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:11px;color:var(--muted);margin-top:2px}
/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500}
.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#ede9fe;color:#5b21b6}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-value{font-size:24px;font-weight:700;color:var(--text)}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.stat-change{font-size:11px;margin-top:4px}
.stat-change.up{color:var(--success)}.stat-change.down{color:var(--danger)}
/* Toggle */
.toggle{position:relative;width:40px;height:22px;background:#cbd5e1;border-radius:11px;cursor:pointer;transition:background .2s;display:inline-block}
.toggle.on{background:var(--primary)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}
/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:40px;margin-bottom:12px}
.empty .title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.empty .desc{font-size:13px}
/* Section divider in sidebar */
.sidebar-section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#94a3b8;padding:8px 12px 2px}
/* Role indicator */
.role-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fef3c7;color:#92400e;margin-left:4px}
.role-badge.admin{background:#ede9fe;color:#5b21b6}
/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;z-index:300;animation:slideUp .2s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--primary)}
/* Responsive */
@media(max-width:768px){.sidebar{width:60px!important}.sidebar .nav-text,.sidebar .nav-section-header,.sidebar .logo-area .title,.sidebar .badge,.sidebar .role-badge,.sidebar .section-divider-label{display:none}.sidebar .nav-item{justify-content:center;padding:10px}.sidebar .nav-item .icon{font-size:18px}.main{margin-left:60px!important}}
/* Plan card in upgrade */
.plan-card{border:2px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:all .2s}
.plan-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(99,102,241,.1)}
.plan-card.current{border-color:var(--primary);background:#eef2ff}
.plan-name{font-size:18px;font-weight:700;margin-bottom:8px}
.plan-price{font-size:32px;font-weight:800;color:var(--primary);margin-bottom:4px}
.plan-price span{font-size:14px;font-weight:400;color:var(--muted)}
.plan-features{list-style:none;padding:0;margin:16px 0;text-align:left;font-size:13px}
.plan-features li{padding:6px 0;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px}
.plan-features li .check{color:var(--success);font-weight:700}
.plan-features li .cross{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// ── FunnelSwift Admin SPA ──
const API_BASE = '/api/v1';
let TOKEN = localStorage.getItem('ws_fs_token') || '';
let USER = null; // { user_id, tenant_id, email, name, role, is_admin, api_key, current_plan, planObj }
let STATE = { view: 'dashboard', modal: null, data: {}, toast: null, subView: null };

// ── API ──
async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  if (res.status === 401) { TOKEN = ''; localStorage.removeItem('ws_fs_token'); window.location.href = '/login'; throw new Error('auth'); }
  if (res.status === 402) { showToast('Upgrade required — this feature needs a paid plan', 'error'); throw new Error('402'); }
  if (!res.ok) { const e = await res.json().catch(()=>({error:'Request failed'})); throw new Error(e.error||e.message||'Error '+res.status); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── Toast ──
function showToast(msg, type='info') {
  STATE.toast = { msg, type };
  /* kanban t_d10ac776/[post]: a modal's body is NOT part of this shell's markup -- renderApp()
     paints `<div class="modal-body" id="modal-body">${m.content||''}</div>` from the PLACEHOLDER
     the opener stored, while every opener fills that node itself afterwards, in its own
     setTimeout, from its own fetch. So the immediate renderApp() here repainted the shell over an
     open modal and destroyed the injected form: the overlay stayed up and the admin had nothing to
     submit (measured on the failed-create path, admin.funnelswift.net). While a modal is open the
     toast is therefore painted into the node it owns, `#toast`, and the shell is left alone --
     exactly what this slot's own 3500 ms clear timer already does in reverse.
     Outside a modal the repaint is KEPT on purpose: it is the refresh mechanism for 52 of
     showToast's 93 call sites (classify-renders.py: those sites call no renderView themselves), so
     dropping it everywhere would stop those panels reloading. This is arm (a) narrowed to the one
     situation where the repaint is destructive. */
  if (!STATE.modal) {
    renderApp();
  } else {
    const prev = document.getElementById('toast');
    if (prev) prev.remove();
    const app = document.getElementById('app');
    if (app) {
      const el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.id = 'toast';
      el.textContent = msg;
      app.appendChild(el);
    }
  }
  /* kanban t_20c72970: clear the slot WITHOUT rebuilding the shell. A modal is not part of the
     shell's markup: every modal fills #modal-body itself, after its own fetch, in its own
     setTimeout (openAffiliateProductModal, openTagModal, openWebhookModal, ...), so the full
     renderApp() that used to run here repainted the shell 3500 ms later and wiped a body a modal
     had already painted -- an operator who opened any modal within 3.5 s of a toast saw an empty
     form with no way to save (measured, admin.funnelswift.net). Candidate (b) -- have renderApp()
     preserve the painted #modal-body -- was rejected by measurement: re-injecting the saved
     innerHTML re-creates the nodes, so every handler a modal bound as a property (the product
     form's submit listener) is gone and the form renders but cannot be submitted. STATE.toast is
     the only state this timer changes, so removing the painted node leaves the DOM exactly as a
     re-render would produce, minus the modal body. Doing no renderApp() here at all also means a
     STALE timer (two toasts in flight, single toast slot) can no longer repaint the shell over an
     open modal. */
  setTimeout(() => {
    STATE.toast = null;
    const t = document.getElementById('toast');
    if (t) t.remove();
  }, 3500);
}

// ── Helpers ──
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id) { return document.getElementById(id); }
/* kanban t_02f8fd6d: this gate asked for a vocabulary the app never issues. /api/v1/auth/me
   (src/auth/handlers.rs) returns `role` straight from the JWT and `is_admin` (= role === "admin"),
   and `auth.is_admin` is what every /api/v1/admin/* route checks server-side. `role === "super_admin"`
   and `is_super_admin` are therefore never true for a real sign-in (users.role is admin | company_admin
   | user), so the entire SUPER ADMIN nav section was hidden and its screens answered "Access Denied" —
   including the Tag Groups screen whose Edit button this card fixes. Accept the server's own
   vocabulary, the way IncentiveSwift's console already does. */
function isSuperAdmin() { return !!(USER && (USER.role === 'super_admin' || USER.role === 'admin' || USER.is_admin === true)); }
function canManageAffiliates() { return isSuperAdmin(); }
function formatDate(d) { if(!d) return '-'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function formatCurrency(n) { return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0); }

/* ── kanban t_02f8fd6d: prefill sources for the Edit modals ──────────────────────────────────
   The rows each list screen last rendered, keyed by id. These lists are `SELECT *`, so the row an
   Edit button came from already carries every field its modal reads — prefilling from it is the
   only source that cannot disagree with what the operator clicked. */
const EDIT_ROWS = { tags: {}, sysTags: {}, groups: {}, affiliateProducts: {}, webhooks: {} };
/* `rows` is that cache (optional); `fallback(id)` is the detail route for an out-of-band id.
   NOTE: GET /api/v1/tag-groups/:id is NOT routed (PUT/DELETE only — src/api_router.rs), which is
   what made the tag-group Edit answer an empty-bodied 405 and open a blank form. Its fallback is
   the LIST route, which IS served. */
async function rowForEdit(id, rows, fallback) {
  if (!id) return {};
  const hit = rows && rows[String(id)];
  if (hit) return hit;
  return (await fallback(String(id))) || {};
}
/* A failed prefill must never leave an editable form half-empty (the pre-fix tag-group Edit
   rendered an empty, `required` Name for a group that HAS one, so a no-touch save was impossible
   and a retyped name silently renamed the group): close the modal and say what failed instead of
   swallowing the rejection. */
function failEdit(e, what) {
  showToast((what || 'Could not load the record') + ': ' + ((e && e.message) || 'unknown error'), 'error');
  STATE.modal = null;
  renderApp();
}
/* Fallback for an out-of-band tag-group id: the LIST route, scoped and served. */
async function loadTagGroupById(id) {
  const list = await api('/tag-groups');
  const arr = Array.isArray(list) ? list : ((list && (list.data || list.groups)) || []);
  const found = arr.filter(g => String(g.id) === String(id))[0];
  if (!found) throw new Error('Tag group not found');
  return found;
}

/* -- kanban t_5289fd7b / t_968c2b09: the tags GROUP column and editor -------------------------
   `tags` stores `group_id` (Option<Uuid>, src/models/tag.rs) and has NO `group_name` column, and
   `UpdateTagRequest` accepts no such field -- so the old cell fell back to a hard-coded badge on
   every row (it read a key neither that table nor GET /api/v1/tags returns) and the old editor's
   free-text group box wrote a key serde silently ignored.
   The VOCABULARY is now the admin read GET /api/v1/admin/tag-groups (kanban t_968c2b09): the
   caller's own groups PLUS the groups its visible tags point at. The fleet's shared taxonomy is
   owned by the SYSTEM tenant, so the tenant-scoped GET /api/v1/tag-groups answers [] here and this
   console could not name a single taxonomy group -- the admin read is derived from `tags.group_id`,
   the very column being rendered, so it can never disagree with the rows it names. It is a READ:
   rename/delete stay tenant-scoped and the Tag Groups screen offers them only for its OWN rows. */
const TAG_GROUPS = { list: [], names: {} };
async function loadTagGroups() {
  let items = [];
  try { items = await api('/admin/tag-groups'); }
  catch(e) { try { items = await api('/tag-groups'); } catch(e2) { items = []; } }
  if (!Array.isArray(items)) items = items.data || items.groups || [];
  TAG_GROUPS.list = items;
  TAG_GROUPS.names = {};
  items.forEach(g => { TAG_GROUPS.names[String(g.id)] = g.name; });
}
function tagGroupCell(t) {
  if (!t || !t.group_id) return '<span style="color:var(--muted)">—</span>';
  const id = String(t.group_id);
  const name = TAG_GROUPS.names[id];
  if (name) return `<span class="badge badge-blue">${x(name)}</span>`;
  return `<span class="badge badge-blue" title="group id ${x(id)} - not in this console's tag-groups list">${x(id.slice(0,8)+'…')}</span>`;
}
/* kanban t_f94a8a00: a tag's group can now be CLEARED. `update_tag()` binds `req.group_id.or(
   tag.group_id)`, so an absent key AND an explicit null both mean "keep the stored one" -- null cannot
   express a clear, and a bare "" is an axum 422. The clear is therefore an explicit ADDITIVE flag,
   `clear_group: true` (UpdateTagRequest.clear_group): it ungroups the tag and leaves every body shape
   a shipped caller already sends (null = keep) meaning exactly what it means today, so no surface can
   silently wipe a tag's group. The select ALWAYS offers "— No group —"; choosing it sends
   `clear_group` (not a group_id), while an untouched select still sends the stored group (a no-op). */
function tagGroupOptions(current) {
  const cur = current ? String(current) : '';
  let opts = `<option value=""${cur ? '' : ' selected'}>— No group —</option>`;
  let found = false;
  TAG_GROUPS.list.forEach(g => {
    const id = String(g.id);
    if (id === cur) found = true;
    opts += `<option value="${x(id)}"${id === cur ? ' selected' : ''}>${x(g.name)}</option>`;
  });
  if (cur && !found)
    opts += `<option value="${x(cur)}" selected>${x(cur.slice(0,8)+'…')} - not in this console's group list</option>`;
  return opts;
}

/* Fallback for the affiliate-product Edit (kanban t_2b82d8f0): `GET
   /api/v1/affiliate-products/:id` is NOT routed either (PUT/DELETE only — src/api_router.rs), so the
   console's Edit prefilled through an empty-bodied 405 and failEdit closed the modal without a form.
   Same shape as loadTagGroupById: the LIST route is served, so resolve the row from it. */
async function loadAffiliateProductById(id) {
  const list = await api('/affiliate-products');
  const arr = Array.isArray(list) ? list : ((list && (list.data || list.products)) || []);
  const found = arr.filter(p => String(p.id) === String(id))[0];
  if (!found) throw new Error('Affiliate product not found');
  return found;
}

/* Fallback for an out-of-band WEBHOOK id (kanban t_ae907da8). `GET /api/v1/webhooks/:id` is not
   routed either (PUT/DELETE only — src/api_router.rs), so the editor's prefill used to reject with
   an empty-bodied 405 and failEdit closed the modal without a form. The LIST route is served, so
   resolve the row from it — the same shape as loadAffiliateProductById and loadTagGroupById. */
async function loadWebhookById(id) {
  const list = await api('/webhooks');
  const arr = Array.isArray(list) ? list : ((list && (list.data || list.webhooks)) || []);
  const found = arr.filter(w => String(w.id) === String(id))[0];
  if (!found) throw new Error('Webhook not found');
  return found;
}

// ── Login ──
async function doLogin(email, password) {
  const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
  TOKEN = res.token;
  localStorage.setItem('ws_fs_token', TOKEN);
  await loadUser();
  renderApp();
}

async function loadUser() {
  try {
    const me = await api('/auth/me');
    // `/me` serves the tenant's active plan row as `current_plan` (every column, including `price`);
    // it carries no plan id and no slug, so bind the plan from the field the endpoint really returns
    // instead of re-fetching a row that cannot be addressed (kanban t_c284c098).
    USER = { ...me, planObj: me.current_plan || null };
  } catch(e) { USER = null; TOKEN = ''; localStorage.removeItem('ws_fs_token'); }
}

function doLogout() { TOKEN = ''; USER = null; localStorage.removeItem('ws_fs_token'); window.location.href = '/login'; }

// ── Init ──
(async function init() {
  if (TOKEN) await loadUser();
  renderApp();
})();

// ── Render ──
function renderApp() {
  const app = document.getElementById('app');
  if (!TOKEN || !USER) {
    app.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  app.innerHTML = renderShell();
  bindShell();
  renderView();
}

function renderLogin() {
  return `<div class="flex items-center justify-center min-h-screen bg-gray-50">
    <div class="card w-full max-w-sm" style="padding:40px">
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:40px;margin-bottom:8px">🚀</div>
        <h1 style="font-size:20px;font-weight:700">FunnelSwift Admin</h1>

/* kanban t_9ef0b460: an inline on* attribute is compiled in GLOBAL scope and can never see this
   module's bindings. Eight of them named STATE/renderApp directly (census:

window._setState = function (patch) {

};

      e.preventDefault();
      const fd = new FormData(e.target);

      if (id && !data.group_id && tag.group_id) data.clear_group = true;
      try {
        if (id) await api('/tags/'+id, { method: 'PUT', body: JSON.stringify(data) });
        else await api('/tags', { method: 'POST', body: JSON.stringify(data) });

};

           promoted but never attributed: tag_logic::attribute_affiliate_on_tags (src/tag_logic.rs:319)
           resolves every active product whose system_tag_id equals the tag the lead received. Options are
           loaded below from GET /api/v1/admin/system-tags — the route that had no caller in any shipped
           surface. "(No system tag)" clears the link; the API needs the explicit additive
           clear_system_tag flag for that, because a bare null KEEPS the stored tag (a backtick in
           this comment would terminate the template literal that builds this form). -->
      <div class="form-group"><label class="form-label">System Tag</label><select class="input" name="system_tag_id" id="product-system-tag" ${isAdmin?'':'disabled'}><option value="">(No system tag)</option>${p.system_tag_id?`<option value="${x(p.system_tag_id)}" selected>${x(p.system_tag_name||'Current system tag')}</option>`:''}</select><div style="font-size:11px;color:var(--muted);margin-top:4px">Attributes this product to the affiliate who brought a lead carrying the tag.</div></div>
      ${isAdmin?`<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${id?'Update':'Create'} Product</button>
      </div>`:''}
    </form>`;
    if (isAdmin) {
      /* The picker is FILLED by the route that had no caller (kanban t_2b82d8f0). */
      api('/admin/system-tags').then((list) => {
        const sel = document.getElementById('product-system-tag');
        if (!sel) return;
        const arr = Array.isArray(list) ? list : ((list && list.data) || []);
        arr.forEach((t) => {
          if (String(t.id) === String(p.system_tag_id || '')) return;   /* already offered, with its own name */
          const o = document.createElement('option');
          o.value = t.id; o.textContent = t.name || '';
          sel.appendChild(o);
        });
      }).catch(() => {});
      const tagSel = document.getElementById('product-system-tag');
      if (tagSel) tagSel.value = p.system_tag_id || '';
      document.getElementById('product-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd);
        /* kanban t_2b82d8f0: a BLANK number input arrives as '' and serde refuses it
           ("invalid type: string \"\", expected f64" -> 422), so the key is dropped instead: absent means
           "keep" on PUT and 0.0 on POST (the handler's own unwrap_or). Measured on the deployed binary. */
        if (data.default_commission_rate === '') delete data.default_commission_rate;
        else data.default_commission_rate = parseFloat(data.default_commission_rate);
        /* kanban t_5c2a9bde: a plan-derived product's rate comes from its plan, so the form never sends
           the key at all — the API would refuse a different value with a 409 naming the plan, and the
           handler writes the plan's own rate back for a product whose plan owns the column. */
        if (rateLocked) delete data.default_commission_rate;
        data.is_third_party = data.is_third_party === 'true';
        /* `system_tag_id` goes out as JSON null, never "" (axum answers a bare 422 "UUID parsing failed");
           null alone KEEPS a stored tag (measured), so un-assigning one sends the additive
           `clear_system_tag` flag — kanban t_2b82d8f0. */
        const tagVal = data.system_tag_id || '';
        data.system_tag_id = tagVal || null;
        if (id && !tagVal && p.system_tag_id) data.clear_system_tag = true;
        try {
          if (id) await api('/affiliate-products/'+id, { method: 'PUT', body: JSON.stringify(data) });
          else await api('/affiliate-products', { method: 'POST', body: JSON.stringify(data) });
          showToast(id?'Product updated':'Product created', 'success');
          STATE.modal = null; renderApp();
        } catch(e) { showToast(e.message, 'error'); }
      });
    }
  }, 100);
}

     refuses the WHOLE request with a 409 naming the plan to edit, and — kanban t_db5d07aa — so do the group
     routes, because a group rate OUTRANKS the product's own rate (`src/commission.rs`, rule 2) and would
     therefore have spoken for the plan: POST /api/v1/affiliate-product-groups (and /:id/products) now answer
     the same 409, and migration 089 refuses the write in the database. So the tick-box list below is the
     same list the bulk form uses: every product whose rate is its OWN. */

  const planLocked = products.length - ratable.length;

              <input type="checkbox" name="product_ids" value="${x(p.id)}"> ${x(p.name || p.product_name || '-')}

function bindCommissionGroups() {
  document.getElementById('group-form')?.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const ids = fd.getAll('product_ids').map(String).filter(Boolean);
    const rateRaw = fd.get('commission_rate');
    const payload = { name: (fd.get('name') || '').toString().trim() };
    if (rateRaw !== null && rateRaw !== '') payload.commission_rate = Number(rateRaw);
    if (ids.length) payload.product_ids = ids;
    if (!payload.name) { showToast('A group needs a name', 'error'); return; }
    try {
      await api('/affiliate-product-groups', { method: 'POST', body: JSON.stringify(payload) });
      showToast('Group created' + (ids.length ? ' with ' + ids.length + ' product(s)' : ''), 'success');
      renderView();
    } catch(e) { showToast(e.message, 'error'); }
  });
  document.getElementById('bulk-rate-form')?.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const ids = fd.getAll('product_ids').map(String).filter(Boolean);
    const rate = Number(fd.get('commission_rate'));
    if (!ids.length) { showToast('Tick at least one product', 'error'); return; }
    if (!Number.isFinite(rate)) { showToast('Enter a rate', 'error'); return; }
    try {
      const r = await api('/affiliate-product-rates/bulk', { method: 'POST', body: JSON.stringify({ product_ids: ids, commission_rate: rate }) });
      /* The server's own count, not the tick count: it reports what it actually wrote (`products_updated`)
         and the ids it could not reach (`products_skipped`), so a toast can never claim more than landed
         (kanban t_5c2a9bde). */
      const done = (r && typeof r.products_updated === 'number') ? r.products_updated : ids.length;
      const skipped = (r && r.products_skipped) || 0;
      showToast('Rate set on ' + done + ' product(s)' + (skipped ? ' — ' + skipped + ' not reachable' : ''), (skipped && !done) ? 'error' : 'success');
      renderView();
    } catch(e) { showToast(e.message, 'error'); }
  });
}
window._deleteCommissionGroup = async function(id) {

  try { await api('/affiliate-product-groups/' + encodeURIComponent(id), { method: 'DELETE' }); showToast('Group deleted', 'success'); renderView(); }

function openEmailTemplateModal(id) {
  STATE.modal = { title: id ? 'Edit Email Template' : 'Add Email Template', content: `<div class="empty"><div class="icon">⏳</div></div>` };
  renderApp();
  setTimeout(async () => {
    let t = {};
    if (id) { try { t = await rowForEdit(id, null, (i) => api('/admin/email-templates/'+i)); }
              catch(e) { return failEdit(e, 'Could not load the email template'); } }
    /* The API's row field is `template_type` — this table has no `type` column and the create route
       REQUIRES `template_type` (kanban t_052b4c7a): the old form sent `type`, so every POST was a 422
       ("missing field `template_type`", nothing written) and the Type select could never leave its
       default. The type list is the one endpoint that advertises types AND their merge fields. */
    let types = [{ type: 'welcome', merge_fields: ['name', 'email', 'login_url', 'app_name'] },
                 { type: 'password_reset', merge_fields: ['name', 'token', 'app_name'] },
                 { type: 'purchase_confirmed', merge_fields: ['name', 'plan_name', 'login_url', 'app_name'] }];
    let rows = [];
    try { const ty = await api('/admin/email-templates/types'); if (Array.isArray(ty) && ty.length) types = ty; } catch(e) {}
    try { const rs = await api('/admin/email-templates'); rows = Array.isArray(rs) ? rs : ((rs && (rs.data || rs.templates)) || []); } catch(e) {}
    const names = types.map(v => v.type).filter(Boolean);
    const cur = t.template_type || names[0] || 'welcome';
    if (names.indexOf(cur) === -1) names.unshift(cur);
    /* The partial unique index allows ONE default per type and the sender only reads
       `template_type = $1 AND (aid = $2 OR is_default = true)`, so a new NON-default row for a type
       that has no default is a row nothing can ever send: a new template therefore starts as that
       type's default, and when the type already has one the box starts unchecked (ticking it
       replaces the incumbent — the API demotes it in the same transaction). */
    const hasDefault = rows.some(r => r.template_type === cur && r.is_default);
    const defOn = id ? !!t.is_default : !hasDefault;
    const body = document.getElementById('modal-body');
    if (!body) return;
    window._etMergeHint = function() {
      const sel = document.querySelector('#email-form [name=template_type]');
      const hit = types.filter(v => v.type === (sel && sel.value))[0];
      const el = document.getElementById('et-merge');
      if (el) el.textContent = 'Merge fields for this type: ' + ((((hit || {}).merge_fields) || []).join(', ') ||
        'none advertised — write placeholders as {{double_braces}}; a single brace is sent literally');
      /* Keep the toggle in step with the CHOSEN type on a new template: ticked when that type has no
         default yet, unticked when it has one (ticking it then replaces the incumbent). Without this
         an admin who switched the type would create a row the sender never reads. An EDIT never moves
         the admin's own choice. */
      if (!id) {
        const box = document.querySelector('#email-form [name=is_default]');
        if (box) box.checked = !rows.some(r => r.template_type === (sel && sel.value) && r.is_default);
      }
    };
    body.innerHTML = `<form id="email-form">
      <div class="form-group"><label class="form-label">Name</label><input class="input" name="name" value="${x(t.name||'')}" required></div>
      <div class="form-group"><label class="form-label">Subject</label><input class="input" name="subject" value="${x(t.subject||'')}"></div>
      <div class="form-group"><label class="form-label">Type</label><select class="input" name="template_type" onchange="window._etMergeHint()">${names.map(n => `<option value="${x(n)}" ${n === cur ? 'selected' : ''}>${x(n)}</option>`).join('')}</select>
        <div id="et-merge" style="font-size:12px;color:var(--muted);margin-top:6px"></div></div>
      <div class="form-group"><label class="form-label">Body (plain text)</label><textarea class="input" name="body" rows="6" style="font-family:monospace;font-size:12px;resize:vertical">${x(t.body||'')}</textarea></div>
      <div class="form-group"><label class="form-label">HTML body (optional — when non-empty this is what the recipient sees)</label><textarea class="input" name="html_body" rows="6" style="font-family:monospace;font-size:12px;resize:vertical">${x(t.html_body||'')}</textarea></div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="is_default" id="et-default" ${defOn ? 'checked' : ''}><label class="form-label" for="et-default" style="margin:0">Default for this type — one default per type, ticking it replaces the current one</label></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button type="button" class="btn btn-secondary" onclick="window._closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${id?'Update':'Create'}</button>
      </div>
    </form>`;
    window._etMergeHint();
    document.getElementById('email-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      /* An explicit payload rather than serialising the whole form in one go: the API wants
         `template_type`, the two bodies are separate columns, and an unchecked box must send `false`
         instead of vanishing from the body (the route's `is_default` is Option<bool>). */
      const data = {
        template_type: fd.get('template_type'),
        name: fd.get('name'),
        subject: fd.get('subject'),
        body: fd.get('body'),
        html_body: fd.get('html_body'),
        is_default: e.target.querySelector('[name=is_default]').checked
      };
      try {
        if (id) await api('/admin/email-templates/'+id, { method: 'PUT', body: JSON.stringify(data) });
        else await api('/admin/email-templates', { method: 'POST', body: JSON.stringify(data) });
        showToast('Saved!', 'success');
        STATE.modal = null; renderApp();
      } catch(e) { showToast(e.message, 'error'); }
    });
  }, 100);
}

            // A provider with a key but no signing secret LOOKS complete and cannot verify a single

window._deletePaymentProvider = async function(ptype) {

  try { await api('/payment-providers/' + encodeURIComponent(ptype), { method: 'DELETE' }); showToast('Payment provider deleted', 'success'); renderView(); }

};

function bindProviderKeys() {
  const kf = document.getElementById('provider-key-form');

    e.preventDefault();

    if (!data.base_url) delete data.base_url;
    try {
      // upsert semantics: the endpoint appends, so clear the provider's row first
      await api('/provider-keys/' + encodeURIComponent(data.provider), { method: 'DELETE' }).catch(() => {});

async function renderTagGroups() {
  if (!isSuperAdmin()) return `<div class="empty"><div class="icon">🔒</div><div class="title">Access Denied</div></div>`;

  let items = [];
  try { items = await api('/admin/tag-groups'); }
  catch(e) { try { items = await api('/tag-groups'); } catch(e2) { items = []; } }
  if (!Array.isArray(items)) items = items.data || items.groups || [];
  EDIT_ROWS.groups = {};
  items.forEach(g => { EDIT_ROWS.groups[String(g.id)] = g; });
  /* kanban t_968c2b09: the admin read is a superset -- it also carries the shared taxonomy's
     groups, which belong to the SYSTEM tenant. PUT/DELETE /tag-groups/:id are `WHERE tenant_id =
     $1`, so an Edit button on one of those rows could only ever 404. The row is real and is shown;
     the control is offered only where it can save, and the Scope column says which is which. */
  const MINE = String((USER && USER.tenant_id) || '');

  return `<div>
    <div class="card-header" style="padding:0;margin-bottom:20px">
      <h1 style="font-size:22px;font-weight:700">📁 Tag Groups</h1>
      <button class="btn btn-primary btn-sm" id="add-group-btn">+ Add Group</button>
    </div>
    ${items.length === 0 ? `<div class="empty"><div class="icon">📁</div><div class="title">No tag groups yet</div></div>` : `
    <div class="card"><div class="table-wrap"><table class="table">
      <!-- kanban t_02f8fd6d: both of the old cells were fabricated. tag_groups has no
           description column (so it could only ever print '-') and GET /tag-groups returns
           TagGroup rows — no tag_count/count — so the count could only ever print 0. The two
           cells below read columns the row really carries. (No backticks in here: this comment
           lives inside a JS template literal.) -->
      <thead><tr><th>Name</th><th>Collapsible</th><th>Sort</th><th>Scope</th><th>Actions</th></tr></thead>
      <tbody>${items.map(g=>{ const own = String(g.tenant_id||'') === MINE; return `<tr>
        <td><strong>${x(g.name)}</strong></td>
        <td>${g.is_collapsible?'Yes':'No'}</td>
        <td>${g.sort_order||0}</td>
        <td>${own ? '<span class="badge badge-green">yours</span>' : `<span class="badge badge-blue" title="owned by tenant ${x(g.tenant_id||'')} - the shared taxonomy; rename/delete is tenant-scoped and this console does not own it">shared</span>`}</td>
        <td>${own ? `<button class="btn btn-secondary btn-xs" onclick="window._editTagGroup('${g.id}')">Edit</button>` : '<span style="color:var(--muted)">—</span>'}</td>
      </tr>`; }).join('')}</tbody>
    </table></div></div>`}
  </div>`;
}

}

           and the update request struct has no such field, so the textarea wrote a key PUT

function bindCardUtmBuilder() {
  document.getElementById('save-utm-btn')?.addEventListener('click', async () => {
    const cardId = STATE.data?.cardId;
    if (!cardId) return;
    const data = {
      utm_source: document.getElementById('utm-source')?.value||'',
      utm_medium: document.getElementById('utm-medium')?.value||'',
      utm_campaign: document.getElementById('utm-campaign')?.value||'',
      utm_content: document.getElementById('utm-content')?.value||'',
      utm_term: document.getElementById('utm-term')?.value||''
    };
    try {
      await api('/card-analytics/'+cardId+'/utm', { method: 'PUT', body: JSON.stringify(data) });
      showToast('UTM parameters saved!', 'success');
    } catch(e) { showToast(e.message, 'error'); }
  });

  document.getElementById('gen-url-btn')?.addEventListener('click', async () => {
    const cardId = STATE.data?.cardId;
    if (!cardId) return;
    try {
      const res = await api('/card-analytics/'+cardId+'/tracking-url');
      const url = res?.tracking_url||res?.url||'';
      const area = document.getElementById('utm-url-area');
      const input = document.getElementById('utm-url-display');
      if (area) area.style.display = 'block';
      if (input) input.value = url;
    } catch(e) { showToast(e.message, 'error'); }
  });

  document.getElementById('copy-url-btn')?.addEventListener('click', () => {
    const input = document.getElementById('utm-url-display');
    if (!input) return;
    navigator.clipboard.writeText(input.value).then(() => showToast('URL copied!', 'success')).catch(() => showToast('Failed to copy', 'error'));
  });
}

// ── Helpers ──
function countryFlag(country) {
  const map = {
    'US':'🇺🇸','GB':'🇬🇧','CA':'🇨🇦','DE':'🇩🇪','FR':'🇫🇷','AU':'🇦🇺','BR':'🇧🇷','IN':'🇮🇳','JP':'🇯🇵','CN':'🇨🇳',
    'KR':'🇰🇷','MX':'🇲🇽','ES':'🇪🇸','IT':'🇮🇹','NL':'🇳🇱','SE':'🇸🇪','NO':'🇳🇴','DK':'🇩🇰','FI':'🇫🇮','PL':'🇵🇱',
    'CH':'🇨🇭','AT':'🇦🇹','BE':'🇧🇪','PT':'🇵🇹','IE':'🇮🇪','NZ':'🇳🇿','SG':'🇸🇬','AE':'🇦🇪','ZA':'🇿🇦','RU':'🇷🇺'
  };
  return map[country?.toUpperCase()] || '🌐';
}

function bindPlanAdmin() {
  const rl = $('planadmin-reload'); if (rl) rl.onclick = () => renderView();
  document.querySelectorAll('[data-plan-edit]').forEach(b => { b.onclick = () => window._editPlanFeatures(b.dataset.planEdit); });
  const ab = $('planadmin-assign-btn');
  if (ab) ab.onclick = async () => {
    const tenant_id = ($('planadmin-assign-tenant') || {}).value;
    const plan_id = ($('planadmin-assign-plan') || {}).value;
    const msg = $('planadmin-assign-msg');
    if (!tenant_id || !plan_id) { if (msg) msg.textContent = 'Select both a tenant and a plan.'; return; }
    ab.disabled = true; if (msg) msg.textContent = 'Assigning…';
    try {
      const r = await api('/admin/plans/assign', { method: 'POST', body: JSON.stringify({ tenant_id, plan_id }) });
      if (msg) msg.textContent = '✓ ' + (r.message || 'Plan assigned');
      showToast('Plan assigned', 'success');
    } catch (e) { if (msg) msg.textContent = '✗ ' + e.message; }
    ab.disabled = false;
  };
  const os = $('planadmin-ov-save');
  if (os) os.onclick = async () => {
    const tid = ($('planadmin-ov-tenant') || {}).value;
    const key = (($('planadmin-ov-key') || {}).value || '').trim();
    const val = parseInt((($('planadmin-ov-val') || {}).value || '0'), 10);
    const msg = $('planadmin-ov-msg');
    if (!tid || !key || isNaN(val)) { if (msg) msg.textContent = 'Tenant, feature_key and numeric limit_value are all required.'; return; }
    os.disabled = true;
    try {
      const r = await api('/admin/tenants/' + tid + '/feature-override', { method: 'POST', body: JSON.stringify({ feature_key: key, limit_value: val }) });
      if (msg) msg.textContent = '✓ ' + (r.message || 'Override set');
      showToast('Feature override set', 'success');
    } catch (e) { if (msg) msg.textContent = '✗ ' + e.message; }
    os.disabled = false;
  };
  const ol = $('planadmin-ov-load');
  if (ol) ol.onclick = async () => {
    const tid = ($('planadmin-ov-tenant') || {}).value;
    const out = $('planadmin-ov-out');
    if (!tid) { if (out) out.textContent = 'Select a tenant first.'; return; }
    ol.disabled = true;
    try {
      const r = await api('/admin/tenants/' + tid + '/feature-overrides');
      const ov = (r && r.overrides) || [];
      if (out) out.innerHTML = ov.length
        ? `<table class="table"><thead><tr><th>feature_key</th><th>limit_value</th></tr></thead><tbody>${ov.map(o => `<tr><td><code>${x(o.feature_key)}</code></td><td>${x(o.limit_value)}</td></tr>`).join('')}</tbody></table>`
        : 'No overrides set for this tenant.';
    } catch (e) { if (out) out.textContent = '✗ ' + e.message; }
    ol.disabled = false;
  };
  const gt = $('planadmin-grant-top');
  if (gt) gt.onclick = async () => {
    if (!confirm('Grant EVERY registry feature to the top tier?\n\nExisting limit caps are never raised, and booleans not already granted are turned on.')) return;
    gt.disabled = true;
    try { const r = await api('/admin/plans/grant-top-tier', { method: 'POST' }); showToast(r.message || 'Top tier granted', 'success'); }
    catch (e) { showToast('✗ ' + e.message, 'error'); }
    gt.disabled = false;
    loadPlanRegistry();
  };
  loadPlanRegistry();
}

// ── Feature registry matrix (kanban t_35acff73, AF-5) ─────────────────────────────────────────
// One row per key the app's gates can read, one column per plan, showing the value the GATE will
// actually see (not just what the row stores). Loaded AFTER its container exists, in
// bindPlanAdmin — a loader that runs before its own element is the bug that leaves a panel stuck
// on "Loading…" forever.
async function loadPlanRegistry() {
  const host = $('planadmin-registry');
  if (!host) return;
  try {
    const d = await api('/admin/plans/registry');
    host.innerHTML = planRegistryHTML(d);
  } catch (e) {
    host.innerHTML = '<div class="empty" style="padding:14px"><div class="desc">Could not load the registry: ' + x(e.message) + '</div></div>';
  }
}

function planRegistryValue(kind, v) {
  if (kind === 'boolean') return v === true ? '✅' : (v === false ? '❌' : '—');
  if (v === null || v === undefined) return '<span style="color:var(--muted)" title="not configured — the gate ALLOWS">unset</span>';
  if (v === -1) return '∞';
  if (v === 0) return '<span class="badge badge-red">off</span>';
  return String(v);
}

function planRegistryHTML(d) {
  const feats = (d && d.features) || [], plans = (d && d.plans) || [];
  if (!feats.length || !plans.length) return '<div class="empty" style="padding:14px"><div class="desc">The registry returned nothing.</div></div>';
  const head = '<tr><th style="text-align:left">Feature (gate key)</th>' +
    plans.map(p => '<th>' + (p.is_top ? '★ ' : '') + x(p.name) +
      '<div style="font-weight:400;font-size:11px;color:var(--muted)">' + x(p.slug) + ' · ' + formatCurrency(p.price) + '</div></th>').join('') +
    '</tr>';
  const rows = feats.map(f => {
    const cells = plans.map(p => {
      const v = (p.values || {})[f.key];
      const hint = f.kind === 'boolean' ? 'true or false' : 'a number: -1 unlimited, 0 off, blank = unset';
      return '<td style="text-align:center;cursor:pointer" title="click to change — ' + x(hint) + '" ' +
        'onclick="window._fsEditEntitlement(\'' + x(p.slug) + '\',\'' + x(f.key) + '\',\'' + x(f.kind) + '\')">' +
        planRegistryValue(f.kind, v) + '</td>';
    }).join('');
    return '<tr><td style="text-align:left"><strong>' + x(f.label) + '</strong>' +
      '<div style="font-size:11px;color:var(--muted)"><code>' + x(f.key) + '</code> · ' + x(f.kind) +
      (f.unit ? ' (' + x(f.unit) + ')' : '') + ' · ' + x(f.enforced_by) + '</div></td>' + cells + '</tr>';
  }).join('');
  const viol = (d && d.superset_violations) || [];
  const inert = (d && d.inert_on_top) || [];
  const topName = (d && d.top_plan && d.top_plan.name) || 'the top tier';
  const status = (viol.length === 0
    ? '<div style="color:#16a34a;font-weight:600">✅ No plan beats ' + x(topName) + ' on any registry key.</div>'
    : '<div style="color:#dc2626;font-weight:600">⚠ ' + viol.length + ' key(s) where another plan beats the top tier: ' +
      viol.map(v => x(v.feature) + ' (' + x(v.beats_plan) + ' = ' + x(v.beats_value) + ', top = ' + x(v.top) + ')').join('; ') + '</div>') +
    (inert.length
      ? '<div style="color:#b45309;margin-top:4px">Inert on the top tier (no row, no column — the gate allows by ABSENCE, not by a grant): ' +
        inert.map(i => x(i.key)).join(', ') + '</div>'
      : '');
  const retired = (d && d.retired_keys) || [];
  const retiredLine = retired.length
    ? '<div style="font-size:11px;color:#b45309;margin-top:6px">Retired keys — their ' +
      '<code>feature_limits</code> rows were DELETED by migration 086 because no gate ever read them ' +
      '(so they are not editable here, and they enforce nothing): ' +
      retired.map(r => x(r.key)).join(', ') + '</div>'
    : '';
  return '<div style="font-size:12px;margin-bottom:8px">' + status + '</div>' +
    '<div class="table-wrap"><table class="table"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="font-size:11px;color:var(--muted);margin-top:6px">' + x((d && d.limit_semantics) || '') + '<br>' + x((d && d.boolean_semantics) || '') + '</div>' +
    retiredLine;
}

window._fsEditEntitlement = async function (plan, feature, kind) {
  const answer = prompt(kind === 'boolean'
    ? 'Set ' + feature + ' for ' + plan + ' — type true or false'
    : 'Set ' + feature + ' for ' + plan + ' — a number (-1 = unlimited, 0 = off, blank = unset)', '');
  if (answer === null) return;
  let value;
  if (kind === 'boolean') {
    const t = answer.trim().toLowerCase();
    if (t !== 'true' && t !== 'false') { showToast('Type true or false', 'error'); return; }
    value = t === 'true';
  } else if (answer.trim() === '') {
    value = null;
  } else {
    value = parseInt(answer, 10);
    if (isNaN(value)) { showToast('That is not a number', 'error'); return; }
  }
  try {
    const r = await api('/admin/plans/entitlement', { method: 'PUT', body: JSON.stringify({ plan: plan, feature: feature, value: value }) });
    showToast('Saved — the gate now sees ' + JSON.stringify(r.effective), 'success');
  } catch (e) { showToast('✗ ' + e.message, 'error'); }
};

/* kanban t_aad42041: the plan-features editor is the one modal whose SUCCESS path calls BOTH
   showToast() (which re-renders the shell) and an inline status line. STATE.modal.content used to be
   a STRING captured when the modal opened, so showToast's renderApp() rebuilt the modal from that
   stale string: #planadmin-features-msg came back empty and the textarea was repainted with the
   features the plan had at OPEN time. admin_update_plan_features MERGES
   (`features = features::jsonb || $1::jsonb`), so an operator who saved, saw the reverted box, typed a
   second change on top of it and saved again re-sent the OLD value of every key the first save had
   changed -- the first change was silently undone behind a 200 and a green toast. So:
     * renderModal() now evaluates a FUNCTION content, and this modal's content reads the draft (PFS)
       below -- that is what makes a repaint show the truth instead of the open-time snapshot;
     * the Save control is an inline `onclick`, because renderApp() replaces the node and a handler
       bound as a property on that node is destroyed with it, so a second Save click performed no
       request at all;
     * the success path stores the SAVED value in the draft (and in the list row the editor prefills
       from) BEFORE it toasts, so the box the operator keeps editing holds what the DB holds;
     * the refusal path (400, e.g. the retired features.card_types key) writes the same draft with NO
       toast, so the operator's '✗ ...' stays on screen exactly as before.
   The box is also the draft's authority while typing (oninput), so no repaint can drop a keystroke. */
const PFS = { id: null, features: '{}', templates: '', msg: '', busy: false };
window._planFeaturesInput = function (v) { PFS.features = v; };
window._planTemplatesInput = function (v) { PFS.templates = v; };
window._planFeaturesHTML = function () {
  return `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">PUT /api/v1/admin/plans/${x(PFS.id)}/features — the JSON object is merged into the plan's existing <code>features</code>.</div>
      <textarea id="planadmin-features-json" class="input" style="width:100%;height:170px;font-family:ui-monospace,monospace;font-size:12px" oninput="window._planFeaturesInput(this.value)">${x(PFS.features)}</textarea>
      <div style="font-size:12px;color:var(--muted);margin:10px 0 4px">allowed_template_ids (optional JSON array, leave blank to keep unchanged)</div>
      <input id="planadmin-templates-json" class="input" style="width:100%" placeholder='["tpl_1","tpl_2"]' value="${x(PFS.templates)}" oninput="window._planTemplatesInput(this.value)">
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-primary btn-sm" id="planadmin-features-save" onclick="window._savePlanFeatures()">Save Features</button>
        <button class="btn btn-secondary btn-sm" onclick="window._closeModal()">Cancel</button>
      </div>
      <div id="planadmin-features-msg" style="font-size:12px;margin-top:10px;color:var(--muted)">${x(PFS.msg)}</div>`;
};
window._editPlanFeatures = function (id) {
  const p = (STATE.data.planAdminPlans || []).find(z => z.id === id) || {};
  PFS.id = id;
  PFS.features = JSON.stringify(p.features || {}, null, 2);
  PFS.templates = p.allowed_template_ids ? JSON.stringify(p.allowed_template_ids) : '';
  PFS.msg = '';
  PFS.busy = false;
  STATE.modal = { title: 'Feature flags — ' + (p.name || id), content: window._planFeaturesHTML };
  renderApp();
};
window._savePlanFeatures = async function () {
  if (PFS.busy) return;
  /* snapshot the box FIRST: it is the authority on what the operator typed, and the success path
     re-renders, so the box is rebuilt from this draft */
  const ta = document.getElementById('planadmin-features-json');
  const tp = document.getElementById('planadmin-templates-json');
  const sv = document.getElementById('planadmin-features-save');
  const msg = document.getElementById('planadmin-features-msg');
  if (ta) PFS.features = ta.value;
  if (tp) PFS.templates = tp.value;
  /* the NON-success paths write the live status node, exactly as they always did: they raise no toast,
     so no re-render is involved and the operator's text is left where it is. */
  const sayMsg = (t) => { PFS.msg = t; if (msg) msg.textContent = t; };
  let features;
  try { features = JSON.parse(PFS.features || '{}'); }
  catch (e) { sayMsg('✗ features must be valid JSON: ' + e.message); return; }
  const tplRaw = (PFS.templates || '').trim();
  const body = { features };
  if (tplRaw) { try { body.allowed_template_ids = JSON.parse(tplRaw); } catch (e) { sayMsg('✗ allowed_template_ids must be valid JSON array'); return; } }
  PFS.busy = true; sayMsg('Saving…'); if (sv) sv.disabled = true;
  try {
    const r = await api('/admin/plans/' + PFS.id + '/features', { method: 'PUT', body: JSON.stringify(body) });
    PFS.busy = false; if (sv) sv.disabled = false;
    /* the SAVED value stays in the box (and in the row the editor prefills from) so the toast's
       re-render repaints the operator's own committed value, and a SECOND change typed on top of it is
       merged against what the first save wrote rather than against the open-time snapshot. */
    PFS.features = JSON.stringify(features, null, 2);
    const row = (STATE.data.planAdminPlans || []).find(z => z.id === PFS.id);
    if (row) { row.features = features; if (body.allowed_template_ids) row.allowed_template_ids = body.allowed_template_ids; }
    sayMsg('✓ ' + (r.message || 'Features updated'));
    showToast('Plan features updated', 'success');
  } catch (e) { PFS.busy = false; if (sv) sv.disabled = false; sayMsg('✗ ' + e.message); }
};

// ═══════════════════════════════════════════════════════════════════════════════
// WIRED SURFACES — kanban t_4cc3f695 (dead-endpoint triage)
// Every endpoint below was served by the backend with no caller in any shipped
// shell. Each one is now reachable from this console: four first-class sidebar
// views, plus a panel appended to the view that owns the feature. Panels mount
// after the owning view renders and swallow their own errors, so a failing
// endpoint can never blank a working view.
// ═══════════════════════════════════════════════════════════════════════════════

function wiredPanel(view, title, endpoint) {
  const c = document.getElementById('view-container');
  if (!c) return null;
  const host = document.createElement('div');
  host.innerHTML = '<div class="card"><div class="card-header"><div><div class="card-title">' + x(title) +
    '</div><div class="card-subtitle">' + x(endpoint) + '</div></div></div><div class="wbody"></div></div>';
  c.appendChild(host);
  return host.querySelector('.wbody');
}

function wiredErr(body, e) {
  body.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div class="desc">' + x((e && e.message) || String(e)) + '</div></div>';
}

function wiredInput(id, placeholder, type, value) {
  return '<input class="input" id="' + id + '" type="' + (type || 'text') + '" placeholder="' + x(placeholder || '') + '" value="' + x(value === undefined || value === null ? '' : value) + '" style="max-width:320px">';
}

function wiredTable(cols, rows, empty) {
  if (!rows || !rows.length) return '<div class="empty" style="padding:14px">' + x(empty || 'Nothing here yet') + '</div>';
  return '<div class="table-wrap"><table class="table"><thead><tr>' + cols.map(c => '<th>' + x(c) + '</th>').join('') +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}

function mountWiredPanels(view) {
  try {
    switch (view) {
      case 'dashboard': wiredInsights(); break;
      case 'affiliateProducts': wiredAffiliateProductSync(); break;
      case 'portfolio': wiredPortfolioSync(); break;
      case 'emailTemplates': wiredTemplateTypes(); break;
      case 'settings': wiredSettingDelete(); break;
      case 'affiliates': wiredAffiliateDetail(); break;
    }
  } catch (e) { /* a panel must never break the view it is attached to */ }
}

// ── POST /api/v1/admin/affiliate-products/sync ───────────────────────────────
async function wiredAffiliateProductSync() {
  const body = wiredPanel('affiliateProducts', '📦 Sync affiliate products', 'POST /api/v1/admin/affiliate-products/sync');
  if (!body) return;
  body.innerHTML = '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">Creates one affiliate product row per plan that does not have one yet. Paid plans are left alone — an affiliate may only hand out a FREE plan (migration 070).</div>' +
    '<button class="btn btn-primary" id="wired-ap-sync">Sync from plans</button><span id="wired-ap-msg" style="font-size:12px;margin-left:10px"></span>';
  /* kanban t_b2a9059b: same one-shape bind as the panels below. This panel injects its markup and
     binds in one synchronous block, so a re-render cannot catch it detached today — guarded anyway
     so every wired control binds the same way (`const el = $(...); if (!el) return;`). */
  const apSync = document.getElementById('wired-ap-sync');
  if (!apSync) return;
  apSync.onclick = async () => {
    const b = document.getElementById('wired-ap-sync'), m = document.getElementById('wired-ap-msg');
    b.disabled = true; m.textContent = 'Syncing…';
    try {
      const r = await api('/admin/affiliate-products/sync', { method: 'POST' });
      /* kanban t_a88f6d66: the route now SKIPS the plans it may not materialise (migration 070's
         free-plan rule) and reports them, instead of answering 500 "Database error". Name them, so
         the panel can explain why a paid plan has no product. */
      const skipped = (r.skipped_plans || []).map(p => p.name + (p.price != null ? ' ($' + p.price + ')' : '')).join(', ');
      m.textContent = '✓ ' + (r.message || 'Synced') + (r.created !== undefined ? ' (' + r.created + ' created)' : '') +

// ── GET /api/v1/affiliates/:id/commissions + POST /:id/calculate-tier ───────
async function wiredAffiliateDetail() {
  const body = wiredPanel('affiliates', '💵 Affiliate commissions & tier', 'GET /api/v1/affiliates/:id/commissions · POST /api/v1/affiliates/:id/calculate-tier');
  if (!body) return;
  let affs = [];
  try { affs = await api('/affiliates') || []; } catch (e) { }
  if (!Array.isArray(affs)) affs = affs.data || [];
  body.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">' +
    '<select class="input" id="wired-aff-sel" style="max-width:320px"><option value="">Choose an affiliate…</option>' +
    affs.map(a => '<option value="' + x(a.id) + '">' + x(a.name || a.email || a.id) + '</option>').join('') + '</select>' +
    '<button class="btn" id="wired-aff-tier">Calculate tier</button><button class="btn btn-primary" id="wired-aff-load">Load commissions</button>' +
    '<span id="wired-aff-msg" style="font-size:12px"></span></div><div id="wired-aff-out"></div>';
  const sel = document.getElementById('wired-aff-sel'), out = document.getElementById('wired-aff-out'), msg = document.getElementById('wired-aff-msg');
  /* kanban t_b2a9059b: `sel`/`out`/`msg` above are references captured BEFORE the /affiliates
     await; a re-render landing in that window leaves them in a DETACHED subtree (the markup above
     went where nobody can see it) and a document-wide lookup returns null, so the unguarded
     property write threw an uncaught TypeError and BOTH controls stayed dead (the throw aborted
     this binder before the second bind). Each bind is guarded independently so one lost node can
     never take the other control down with it. */
  const affTier = document.getElementById('wired-aff-tier');
  const affLoad = document.getElementById('wired-aff-load');
  if (affTier) affTier.onclick = async () => {
    if (!sel.value) { msg.textContent = '✗ pick an affiliate'; return; }
    msg.textContent = 'Calculating…';
    try {
      const r = await api('/affiliates/' + encodeURIComponent(sel.value) + '/calculate-tier', { method: 'POST' });
      out.innerHTML = '<div class="stats-grid"><div class="stat-card"><div class="stat-value">' + x(((r.commission_rate || 0) * 1)) +
        '%</div><div class="stat-label">Commission rate</div></div><div class="stat-card"><div class="stat-value">' + formatCurrency(r.total_earned || 0) +
        '</div><div class="stat-label">Total earned</div></div></div>';
      msg.textContent = '';
    } catch (e) { msg.textContent = '✗ ' + e.message; }
  };
  if (affLoad) affLoad.onclick = async () => {
    if (!sel.value) { msg.textContent = '✗ pick an affiliate'; return; }
    msg.textContent = 'Loading…';
    try {
      const rows = await api('/affiliates/' + encodeURIComponent(sel.value) + '/commissions') || [];
      out.innerHTML = wiredTable(['Amount', 'Rate', 'Commission', 'Status', 'Created'],
        (Array.isArray(rows) ? rows : []).map(c => '<tr><td>' + formatCurrency(c.amount || 0) + '</td><td>' + x(c.rate || c.commission_rate || '') +
          '</td><td>' + formatCurrency(c.commission || c.commission_amount || 0) + '</td><td>' + x(c.status || '') + '</td><td>' + formatDate(c.created_at) + '</td></tr>'),
        'No commissions');
      msg.textContent = '';
    } catch (e) { msg.textContent = '✗ ' + e.message; }
  };
}

// ═══ SIDEBAR VIEW: Site Settings (site_settings + SEO injection preview) ═════
async function renderSiteSettings() {
  let rows = [], inject = null;
  try { rows = await api('/admin/sites') || []; } catch (e) { }
  if (!Array.isArray(rows)) rows = rows.data || [];
  try { inject = await api('/seo/inject'); } catch (e) { }
  return `<div>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:6px">Site Settings</h1>
    <div style="font-size:12px;color:var(--muted);margin-bottom:18px">GET/PUT /api/v1/admin/sites(/:key) — global site settings, including the <code>seo_*</code> keys that are injected into every card, funnel and public page.</div>
    <div class="card">
      <div class="card-header"><span class="card-title">Configured settings</span></div>
      ${wiredTable(['Key', 'Value', ''], rows.map(r => `<tr><td><code>${x(r.key)}</code></td><td style="font-size:12px;color:var(--muted);max-width:420px;overflow:hidden;text-overflow:ellipsis">${x(typeof r.value === 'string' ? r.value : JSON.stringify(r.value))}</td><td><button class="btn" data-site-key="${x(r.key)}">Edit</button></td></tr>`), 'No site settings yet — add the first one below')}
    </div>
    <div class="card">
      <div class="card-header"><div><div class="card-title">Add or update a setting</div><div class="card-subtitle">PUT /api/v1/admin/sites/:key</div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        ${wiredInput('wired-ss-key', 'seo_site_name')}
        <button class="btn" id="wired-ss-load">Load</button>
      </div>
      <textarea class="input" id="wired-ss-value" rows="4" style="width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px" placeholder='{"value": "..."} or a plain string'></textarea>
      <div style="margin-top:8px"><button class="btn btn-primary" id="wired-ss-save">Save setting</button><span id="wired-ss-msg" style="font-size:12px;margin-left:10px"></span></div>
    </div>
    <div class="card">
      <div class="card-header"><div><div class="card-title">SEO injection preview</div><div class="card-subtitle">GET /api/v1/seo/inject — exactly what public pages get</div></div></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">meta tags</div>
      <pre style="background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;font-size:11px;overflow:auto">${x((inject && inject.meta_tags) || '(none)')}</pre>
      <div style="font-size:12px;color:var(--muted);margin:8px 0 6px">script tags</div>
      <pre style="background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;font-size:11px;overflow:auto">${x((inject && inject.script_tags) || '(none)')}</pre>
    </div>
  </div>`;
}

function bindSiteSettings() {
  const load = document.getElementById('wired-ss-load');
  const save = document.getElementById('wired-ss-save');
  const keyEl = document.getElementById('wired-ss-key');
  const valEl = document.getElementById('wired-ss-value');
  const msg = document.getElementById('wired-ss-msg');
  const doLoad = async () => {
    const key = keyEl.value.trim();
    if (!key) { msg.textContent = '✗ enter a key'; return; }
    msg.textContent = 'Loading…';
    try {
      const r = await api('/admin/sites/' + encodeURIComponent(key));
      valEl.value = typeof r.value === 'string' ? r.value : JSON.stringify(r.value, null, 2);
      msg.textContent = '✓ loaded';
    } catch (e) { msg.textContent = '✗ ' + e.message; }
  };
  if (load) load.onclick = doLoad;
  document.querySelectorAll('button[data-site-key]').forEach(b => {
    b.onclick = async () => {
      keyEl.value = b.dataset.siteKey;
      await doLoad();
      valEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  });
  if (save) save.onclick = async () => {
    const key = keyEl.value.trim();
    if (!key) { msg.textContent = '✗ enter a key'; return; }
    let value = valEl.value;
    try { value = JSON.parse(valEl.value); } catch (e) { value = valEl.value; }
    save.disabled = true; msg.textContent = 'Saving…';
    try {
      await api('/admin/sites/' + encodeURIComponent(key), { method: 'PUT', body: JSON.stringify({ value: value }) });
      msg.textContent = '✓ saved';
      showToast('Site setting saved', 'success');
      renderView();
    } catch (e) { msg.textContent = '✗ ' + e.message; save.disabled = false; }
  };
}

        ${wiredInput('wired-tr-name', 'Rule name')}
        <select class="input" id="wired-tr-trigger" style="max-width:220px">${'<option value="">Trigger tag…</option>' + tags.map(t => `<option value="${x(t.id)}">${x(t.name || t.id)}</option>`).join('')}</select>
        <select class="input" id="wired-tr-action" style="max-width:200px">
          <option value="">Action…</option><option value="add_tag">add_tag</option><option value="remove_tag">remove_tag</option><option value="route_lead">route_lead</option><option value="notify">notify</option>
        </select>
        <select class="input" id="wired-tr-actiontag" style="max-width:220px"><option value="">Action tag (optional)…</option>${tagOpts()}</select>
        <select class="input" id="wired-tr-app" style="max-width:200px"><option value="funnelswift">funnelswift</option><option value="coreswift">coreswift</option><option value="incentiveswift">incentiveswift</option></select>
        <button class="btn btn-primary" id="wired-tr-add">Create rule</button><span id="wired-tr-msg" style="font-size:12px"></span>
      </div>
    </div>
  </div>`;

function bindTagRules() {
  const add = document.getElementById('wired-tr-add');
  if (add) add.onclick = async () => {
    const msg = document.getElementById('wired-tr-msg');
    const body = {
      name: document.getElementById('wired-tr-name').value.trim(),
      trigger_tag_id: document.getElementById('wired-tr-trigger').value,
      action_type: document.getElementById('wired-tr-action').value,
      target_app: document.getElementById('wired-tr-app').value,
      is_active: true,
    };
    const atag = document.getElementById('wired-tr-actiontag').value;
    if (atag) body.action_tag_id = atag;
    if (!body.name || !body.trigger_tag_id || !body.action_type) { msg.textContent = '✗ name, trigger tag and action are required'; return; }
    add.disabled = true; msg.textContent = 'Saving…';
    try {
      await api('/tag-rules', { method: 'POST', body: JSON.stringify(body) });
      showToast('Tag rule created', 'success');
      renderView();
    } catch (e) { msg.textContent = '✗ ' + e.message; add.disabled = false; }
  };
  document.querySelectorAll('button[data-rule-del]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try { await api('/tag-rules/' + b.dataset.ruleDel, { method: 'DELETE' }); showToast('Tag rule deleted', 'success'); renderView(); }
      catch (e) { showToast(e.message, 'error'); b.disabled = false; }
    };
  });
  document.querySelectorAll('button[data-rule-toggle]').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      try { await api('/tag-rules/' + b.dataset.ruleToggle, { method: 'PUT', body: JSON.stringify({ is_active: false }) }); showToast('Tag rule updated', 'success'); renderView(); }
      catch (e) { showToast(e.message, 'error'); b.disabled = false; }
    };
  });
}
