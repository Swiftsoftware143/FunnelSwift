// ═══ SIDEBAR VIEW: Plan Requests ═════════════════════════════════════════════
// kanban cron-1019 — the operator's queue for a workspace that ASKED to be moved onto a paid plan.
// The ask is filed from the customer's own Upgrade screen (this install has no payment provider, so
// a purchase cannot complete and the ask IS the buying path), and it is a real row in
// `plan_requests`. Before this screen the operator could only read it by calling the API, while the
// customer waited on a state nobody could move. Read: GET /api/v1/admin/plan-requests.
// Write: PUT /api/v1/admin/plan-requests/:id — the same row the customer's screen re-reads on load.
const PLAN_REQ_LABEL = {
  open: 'Open — waiting on us',
  contacted: 'Contacted — we reached out',
  done: 'Done — moved onto the plan',
  declined: 'Declined',
  // The customer took the ask back while it was still open (2026-10-19). Kept in the queue as a
  // record, and it can no longer be answered: the server refuses to move a withdrawn ask.
  withdrawn: 'Withdrawn by the customer'
};
const PLAN_REQ_BG = { open: '#fef3c7', contacted: '#dbeafe', done: '#dcfce7', declined: '#fee2e2', withdrawn: '#f1f5f9' };
const PLAN_REQ_FG = { open: '#92400e', contacted: '#1e40af', done: '#166534', declined: '#991b1b', withdrawn: '#475569' };
function planReqChip(s) {
  const k = String(s || 'open');
  return '<span style="background:' + (PLAN_REQ_BG[k] || '#f1f5f9') + ';color:' + (PLAN_REQ_FG[k] || '#334155') +
    ';padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">' + x(PLAN_REQ_LABEL[k] || k) + '</span>';
}

async function renderPlanRequests() {
  let payload = { requests: [], open: 0 };
  let err = '';
  try { payload = await api('/admin/plan-requests') || payload; }
  catch (e) { err = (e && e.message) || 'Could not load the queue'; }
  // Keep the shared cache warm from the queue's own read (cron-1020): the operator's status move
  // re-renders this screen, so the dashboard card must not keep counting a request they just closed
  // — one list feeds both surfaces, so they can never disagree.
  if (!err && Array.isArray(payload.requests)) { PREQ_LIST = payload.requests; paintPlanRequests(); }
  const list = Array.isArray(payload.requests) ? payload.requests : [];
  const open = typeof payload.open === 'number' ? payload.open : list.filter(r => r.status === 'open').length;
  PLAN_REQ_OPEN = open;
  const rowFor = (r) => {
    // A WITHDRAWN ask has no answer to give: the customer took it back, and the server refuses to
    // move it (409). Offering the state buttons here would only produce a red toast, so the cell says
    // what happened instead — the row stays readable as a record.
    const acts = r.status === 'withdrawn'
      ? '<span style="font-size:11px;color:var(--muted)">Customer withdrew it</span>'
      : ['contacted', 'done', 'declined'].filter(st => st !== r.status).map(st =>
      '<button class="btn" data-pr-id="' + x(r.id) + '" data-pr-status="' + st + '" data-pr-ws="' + x(r.tenant_name || '') +
      '" data-pr-tenant="' + x(r.tenant_id || '') + '" data-pr-slug="' + x(r.plan_slug || '') +
      '" style="padding:4px 8px;font-size:11px;margin-left:4px">' + st + '</button>').join('');
    return '<tr data-plan-request="' + x(r.id) + '">' +
      '<td><strong>' + x(r.tenant_name || r.tenant_id) + '</strong><div style="font-size:11px;color:var(--muted)">' +
      x(r.requested_by || '') + '</div></td>' +
      '<td>' + x(r.plan_name || r.plan_slug) +
      (r.note ? '<div style="font-size:11px;color:var(--muted);max-width:280px">' + x(r.note) + '</div>' : '') + '</td>' +
      '<td>' + planReqChip(r.status) + '</td>' +
      '<td>' + formatDate(r.created_at) + '</td>' +
      '<td><div style="display:flex;gap:4px;align-items:center">' +
      '<input data-pr-reply="' + x(r.id) + '" value="' + x(r.reply || '') + '" placeholder="Visible to the customer" ' +
      'style="width:150px;padding:3px 6px;font-size:11px;border:1px solid var(--border);border-radius:4px">' +
      '<button class="btn" data-pr-save-reply="' + x(r.id) + '" data-pr-cur="' + x(r.status) + '" ' +
      'style="padding:3px 6px;font-size:11px">Save</button></div>' +
      (r.replied_at ? '<div style="font-size:10px;color:var(--muted);margin-top:2px">sent ' + formatDate(r.replied_at) + '</div>' : '') +
      '</td>' +
      '<td style="text-align:right;white-space:nowrap">' + acts + '</td></tr>';
  };
  return `<div>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:6px">Plan Requests</h1>
    <!-- routes: GET /api/v1/admin/plan-requests · PUT /api/v1/admin/plan-requests/:id -->
    <div style="font-size:12px;color:var(--muted);margin-bottom:18px">A workspace asks to be moved onto a paid plan from its own Upgrade screen. Nothing is charged on either side — moving the state here is what the customer sees the next time their screen loads.</div>
    ${err ? '<div style="background:#fef2f2;border-left:4px solid #dc2626;padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:13px;color:#991b1b">' + x(err) + '</div>' : ''}
    ${open ? '<div style="background:#fffbeb;border:1px solid #fde68a;padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:13px;color:#92400e"><strong>' + open + '</strong> workspace' + (open === 1 ? ' is' : 's are') + ' waiting on an answer.</div>' : ''}
    <div class="card">
      ${wiredTable(['Workspace', 'Requested plan', 'State', 'Asked', 'Note to customer', ''], list.map(rowFor), 'No workspace has asked for a plan change')}
    </div>
  </div>`;
}

function planReqReplyValue(id) {
  const el = document.querySelector('input[data-pr-reply="' + id + '"]');
  return el ? String(el.value || '') : '';
}

function bindPlanRequests() {
  // The note can be saved on its own: an operator who only wants to EXPLAIN a declined ask should
  // not have to move the state to do it, and a corrected sentence should not restate the state.
  document.querySelectorAll('button[data-pr-save-reply]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.getAttribute('data-pr-save-reply');
      const cur = b.getAttribute('data-pr-cur') || 'open';
      b.disabled = true;
      try {
        await api('/admin/plan-requests/' + encodeURIComponent(id),
          { method: 'PUT', body: JSON.stringify({ status: cur, reply: planReqReplyValue(id) }) });
        showToast('Note saved \u2014 the customer reads it on their Upgrade screen', 'success');
        renderApp();
      } catch (e) {
        b.disabled = false;
        showToast((e && e.message) || 'Could not save the note', 'error');
      }
    });
  });
  document.querySelectorAll('button[data-pr-id]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.getAttribute('data-pr-id');
      const status = b.getAttribute('data-pr-status');
      const ws = b.getAttribute('data-pr-ws') || 'this workspace';
      const tid = b.getAttribute('data-pr-tenant');
      const slug = b.getAttribute('data-pr-slug');
      if (status === 'declined' && !confirm('Decline ' + ws + '\u2019s plan request?')) return;
      b.disabled = true;
      try {
        // "done" means the workspace was actually MOVED onto the plan it asked for. The state alone
        // would leave the customer on the old plan while the chip told them they had been moved, so
        // the move is written here (the same writer the Tenants screen's plan selector uses:
        // POST /api/v1/tenants/:id/plan) BEFORE the request is marked done. If the plan cannot be
        // resolved the operator is told, and the request is NOT marked done — a lie is worse than
        // an unfinished step.
        let moved = '';
        if (status === 'done' && tid && slug) {
          let plans = [];
          try { plans = await api('/plans') || []; } catch (e) { plans = []; }
          const plan = (Array.isArray(plans) ? plans : (plans.plans || [])).find(p => p && p.slug === slug);
          if (!plan) {
            b.disabled = false;
            showToast('Plan "' + slug + '" is not in the catalogue — nothing was changed', 'error');
            return;
          }
          await api('/tenants/' + encodeURIComponent(tid) + '/plan', { method: 'POST', body: JSON.stringify({ plan_id: plan.id }) });
          moved = ' and moved the workspace onto ' + (plan.name || slug);
        }
        // The note typed beside the buttons travels WITH the state change, so a "declined" chip is
        // never shown to the customer without the sentence that explains it.
        await api('/admin/plan-requests/' + encodeURIComponent(id),
          { method: 'PUT', body: JSON.stringify({ status, reply: planReqReplyValue(id) }) });
        showToast('Marked ' + status + moved, 'success');
        renderApp();
      } catch (e) {
        b.disabled = false;
        showToast((e && e.message) || 'Could not update the request', 'error');
      }
    });
  });
}

// Run once at boot: a wait nobody can see is the defect this screen exists for, so the count is put
// on the nav label before the operator clicks anything.
async function refreshPlanRequestBadge() {
  if (!USER || (USER.role !== 'admin' && !USER.is_admin)) return;
  try {
    const d = await api('/admin/plan-requests');
    PREQ_LIST = Array.isArray(d && d.requests) ? d.requests : [];
  } catch (e) { return; }
  paintPlanRequests();
}

// kanban cron-1020 — the count reached the sidebar ONLY at boot, so a request that arrived while an
// operator had the console open was invisible until they reloaded (measured: filing a request left
// the open console unchanged, with the row already in the queue). Two things follow from one cached
// read: the sidebar label (as before) and a card at the TOP of the dashboard, because a label on a
// collapsed sidebar section is easy to miss and this is the one screen the operator lands on. Both
// repaint from the same list, so they can never disagree, and a workspace with nothing waiting gets
// no card at all — nothing is invented.
var PREQ_LIST = null;
function paintPlanRequests() {
  if (PREQ_LIST === null) return;
  const openRows = PREQ_LIST.filter(r => r.status === 'open');
  PLAN_REQ_OPEN = openRows.length;
  const nav = document.querySelector('.nav-item[data-view="planRequests"]');
  if (nav) {
    const lbl = nav.querySelector('.nav-text');
    if (lbl) lbl.textContent = 'Plan Requests' + (PLAN_REQ_OPEN ? ' (' + PLAN_REQ_OPEN + ')' : '');
    nav.style.background = PLAN_REQ_OPEN ? 'rgba(239,68,68,.08)' : '';
  }
  const box = document.getElementById('preqCard');
  if (!box) return;
  if (!openRows.length) { box.innerHTML = ''; return; }
  const r = openRows[0];
  const who = r.tenant_name || r.requested_by || '';
  box.innerHTML = '<div class="card" data-plan-requests-waiting="' + PLAN_REQ_OPEN + '"'
    + ' style="border-left:4px solid #ef4444;margin-bottom:16px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">'
    + '<div><div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Waiting on you</div>'
    + '<div style="font-size:20px;font-weight:800">' + PLAN_REQ_OPEN + ' plan request' + (PLAN_REQ_OPEN === 1 ? '' : 's') + '</div>'
    + '<div style="color:#475569;font-size:13px;margin-top:2px">' + x(r.plan_name || r.plan_slug || '')
    + (who ? ' &middot; ' + x(who) : '') + ' &middot; ' + formatDate(r.created_at) + '</div></div>'
    + '<button class="btn" data-open-plan-requests="1">Open the queue</button></div></div>';
  const btn = box.querySelector('[data-open-plan-requests]');
  if (btn) btn.addEventListener('click', () => { STATE.view = 'planRequests'; STATE.subView = null; renderApp(); });
}

</script>
