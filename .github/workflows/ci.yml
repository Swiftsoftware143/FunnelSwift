name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      # Pinned, not @stable: sqlx-postgres 0.7.4 does not compile on rustc 1.100.0
      # (rust-lang/rust#148922, 15 type-inference errors). rust-toolchain.toml carries the same
      # pin so the build box and CI agree. Bump both together after the sqlx 0.8 upgrade.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release
